[package]
name = "permaura-platform"
description = "Small audited OS boundary for private Permaura files and child processes that die with the gateway."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Children that die with the gateway. Off by default, so the security core that depends on this crate takes no Tokio or libc through this crate; the gateway and the connectors turn it on.
child = ["dep:tokio", "dep:libc"]
# The exclusive lock a self-run store is held by. Off by default for the same reason; the gateway turns it on.
lock = ["dep:libc"]

[dependencies]
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "process", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "process", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
