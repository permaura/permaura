<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Permaura gateway</title>
<style>
:root{color-scheme:light dark;--bg:#f7faf8;--card:#fff;--line:#e3ebe7;--fg:#12241c;--muted:#5a6b63;--brand:#25a777;--brand-hover:#1e8f65}
@media (prefers-color-scheme:dark){:root{--bg:#0d1310;--card:#141c18;--line:#22302a;--fg:#e8f0ec;--muted:#93a89e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:26rem;padding:2.5rem 2rem;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.05)}
h1{margin:0 0 .5rem;font-size:1.125rem;font-weight:600;letter-spacing:-.01em}
p{margin:0;color:var(--muted)}
.note{margin-top:.75rem;font-size:.875rem}
.btn{display:inline-block;margin-top:1.75rem;padding:.7rem 1.4rem;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;text-decoration:none}
.btn:hover{background:var(--brand-hover)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:3px}

/* The mark, animated exactly as the console and the phone animate it: three blades open out, turn
   once around the centre seal, and close back into the shield. Paths, spread, origin and timings are
   the console's own (its logo paths and its logo-turn/logo-blade keyframes) rather than
   a second interpretation of the brand. The seal is a SIBLING of the turning group and never rotates:
   the group turns about the seal's own centre, not the box's, which is what holds every blade at a
   fixed distance from the star instead of sweeping them through it.

   Per the brand spec the mark is always #25a777 and is never retinted per theme. */
.mark{--size:56px;--spread:calc(var(--size) * 58 / 736);position:relative;width:var(--size);height:var(--size);margin:0 auto 1.25rem}
.mark svg{position:absolute;inset:0;width:100%;height:100%}
.turn{position:absolute;inset:0;transform-origin:49.688% 42.668%;animation:logo-turn 2s linear infinite}
.blade{position:absolute;inset:0;animation:logo-blade 2s linear infinite}
@keyframes logo-turn{
  0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.68,0,.32,1)}
  76%,100%{transform:rotate(360deg)}
}
/* The blades open and close as a function of the turn's ANGLE, not of the clock, which is what makes
   the separation and the spin one gesture. The stop percentages are the turn's own curve solved for
   the times it passes 90 and 270 degrees, so retuning the turn means recomputing these with it. */
@keyframes logo-blade{
  0%{transform:translate(0,0);animation-timing-function:cubic-bezier(.547,0,.821,.426)}
  30.84%{transform:translate(calc(var(--dx) * var(--spread)),calc(var(--dy) * var(--spread)));animation-timing-function:linear}
  45.16%{transform:translate(calc(var(--dx) * var(--spread)),calc(var(--dy) * var(--spread)));animation-timing-function:cubic-bezier(.179,.574,.453,1)}
  76%,100%{transform:translate(0,0)}
}
/* Reduced motion still has to move: a frozen mark on a page that says the gateway is RUNNING reads as
   a screenshot of one that is not. */
@keyframes logo-hold{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .turn,.blade{animation:none}
  .mark{animation:logo-hold .9s ease-in-out infinite alternate}
}
</style>
</head>
<body>

</div>
