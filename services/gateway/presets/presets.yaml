    - { id: invoices.create, method: POST, path: "/v2/invoicing/invoices", body_params: [detail, invoicer, primary_recipients, additional_recipients, items, configuration, amount], description: "Create a draft invoice" }
    - { id: invoices.send, method: POST, path: "/v2/invoicing/invoices/{invoice_id}/send", path_params: [invoice_id], body_params: [subject, note, send_to_recipient, send_to_invoicer, additional_recipients], action: send, risk: high, requires_approval: true, description: "Send a draft invoice to its recipient" }
    - { id: orders.capture, method: POST, path: "/v2/checkout/orders/{id}/capture", path_params: [id], body_params: [payment_source], action: charge, risk: critical, requires_approval: true, description: "Capture payment for an order the buyer has approved" }
    - { id: captures.refund, method: POST, path: "/v2/payments/captures/{capture_id}/refund", path_params: [capture_id], body_params: [amount, invoice_id, custom_id, note_to_payer], action: refund, risk: critical, requires_approval: true, description: "Refund a captured payment in full or in part" }
