  static_headers: { Accept: "application/json", X-Snowflake-Authorization-Token-Type: "PROGRAMMATIC_ACCESS_TOKEN" }
  credential:
    label: "Programmatic access token"
    url: "https://docs.snowflake.com/en/user-guide/programmatic-access-tokens"
    hint: "In Snowsight open Governance & security, Users & roles, pick the user, and generate a token under Programmatic access tokens. Restrict it to a read-only role. The user needs a network policy."
  capabilities:
    - { id: databases.list, method: GET, path: "/databases", query_params: [like, startsWith, showLimit, fromName, history], description: "List databases" }
    - { id: databases.read, method: GET, path: "/databases/{name}", path_params: [name], description: "Read a database" }
    - { id: schemas.list, method: GET, path: "/databases/{database}/schemas", path_params: [database], query_params: [like, startsWith, showLimit, fromName, history], description: "List the schemas in a database" }
    - { id: tables.list, method: GET, path: "/databases/{database}/schemas/{schema}/tables", path_params: [database, schema], query_params: [like, startsWith, showLimit, fromName, history, deep], description: "List the tables in a schema" }
    - { id: tables.read, method: GET, path: "/databases/{database}/schemas/{schema}/tables/{name}", path_params: [database, schema, name], description: "Read a table's definition and columns" }
    - { id: views.list, method: GET, path: "/databases/{database}/schemas/{schema}/views", path_params: [database, schema], query_params: [like, startsWith, showLimit, fromName, deep], description: "List the views in a schema" }
    - { id: views.read, method: GET, path: "/databases/{database}/schemas/{schema}/views/{name}", path_params: [database, schema, name], description: "Read a view's definition" }
    - { id: warehouses.list, method: GET, path: "/warehouses", query_params: [like], description: "List warehouses and their state" }
    - { id: warehouses.read, method: GET, path: "/warehouses/{name}", path_params: [name], description: "Read a warehouse" }
    - { id: statements.read, method: GET, path: "/statements/{statement_handle}", path_params: [statement_handle], query_params: [partition, requestId], description: "Read a statement's status or results; large results come in numbered partitions starting at 0" }
    - { id: statements.execute, method: POST, path: "/statements", query_params: [requestId, async, nullable], body_params: [statement, timeout, database, schema, warehouse, role, bindings, parameters], action: execute, risk: high, requires_approval: true, description: "Run SQL with the token's role; it may read or change data and grants, and it uses warehouse credits" }
    - { id: statements.cancel, method: POST, path: "/statements/{statement_handle}/cancel", path_params: [statement_handle], query_params: [requestId], action: update, risk: high, description: "Cancel a running statement" }
    - { id: warehouses.resume, method: POST, path: "/warehouses/{name}:resume", path_params: [name], query_params: [ifExists], action: update, risk: high, requires_approval: true, description: "Resume a suspended warehouse, which starts using credits" }
    - { id: warehouses.suspend, method: POST, path: "/warehouses/{name}:suspend", path_params: [name], query_params: [ifExists], action: update, risk: high, description: "Suspend a warehouse" }
    - { id: tables.delete, method: DELETE, path: "/databases/{database}/schemas/{schema}/tables/{name}", path_params: [database, schema, name], query_params: [ifExists], description: "Drop a table" }

- id: facebook-pages
  name: "Facebook Pages"
  vertical: social
  description: "Read a Page's posts, comments, insights and conversations, and publish or edit posts, comments and Messenger replies with an approval."
  base_url: "https://graph.facebook.com/v26.0"
  logo: facebook
  brand_color: "#0866FF"
  auth: { scheme: bearer }
  redact_fields: [access_token, page_token, email, emails, phone, whatsapp_number, single_line_address, contact_address, birthday, personal_info]
  credential:
    label: "Page access token"
    url: "https://developers.facebook.com/tools/explorer/"
    hint: "In Graph API Explorer pick your Meta app, add the pages_ permissions and choose Get Page Access Token. Derive it from a long-lived user token so it has no set expiry."
  capabilities:
    - { id: me.read, method: GET, path: "/me", query_params: [fields], description: "Read the Page the token acts as, including the id other calls need" }
    - { id: pages.read, method: GET, path: "/{page_id}", path_params: [page_id], query_params: [fields], description: "Read a Page's details" }
    - { id: posts.list, method: GET, path: "/{page_id}/feed", path_params: [page_id], query_params: [fields, limit, after, before], description: "List a Page's posts, up to 100 per request; request the is_published field to tell published posts from unpublished ones" }
    - { id: posts.scheduled, method: GET, path: "/{page_id}/scheduled_posts", path_params: [page_id], query_params: [fields, limit, after, before], description: "List a Page's scheduled posts" }
    - { id: posts.read, method: GET, path: "/{post_id}", path_params: [post_id], query_params: [fields], description: "Read one Page post" }
    - { id: comments.list, method: GET, path: "/{object_id}/comments", path_params: [object_id], query_params: [fields, filter, summary, limit, after, before], description: "List comments on a post, photo or comment; filter stream returns every level" }
    - { id: insights.read, method: GET, path: "/{object_id}/insights", path_params: [object_id], query_params: [metric, period, since, until], description: "Read insights for a Page or a Page post; metric is required" }
    - { id: conversations.list, method: GET, path: "/{page_id}/conversations", path_params: [page_id], query_params: [platform, folder, user_id, fields, limit, after, before], description: "List the Page's Messenger conversations" }
    - { id: posts.create, method: POST, path: "/{page_id}/feed", path_params: [page_id], body_params: [message, link, published, scheduled_publish_time, place, tags, call_to_action, child_attachments, targeting, feed_targeting], action: send, risk: high, requires_approval: true, description: "Publish or schedule a post on the Page" }
    - { id: photos.create, method: POST, path: "/{page_id}/photos", path_params: [page_id], body_params: [url, caption, published, scheduled_publish_time, no_story, temporary], action: send, risk: high, requires_approval: true, description: "Publish a photo on the Page from a public URL" }
    - { id: posts.update, method: POST, path: "/{post_id}", path_params: [post_id], body_params: [message], action: update, risk: high, requires_approval: true, description: "Edit a published Page post; only posts created by the same app can be edited" }
    - { id: comments.create, method: POST, path: "/{object_id}/comments", path_params: [object_id], body_params: [message, attachment_id, attachment_url, attachment_share_url], action: send, risk: high, requires_approval: true, description: "Post a public comment as the Page on a post, photo or comment" }
    - { id: comments.update, method: POST, path: "/{comment_id}", path_params: [comment_id], body_params: [message, is_hidden], action: update, risk: high, requires_approval: true, description: "Edit a comment's text, or hide or show a comment on the Page" }
    - { id: messages.send, method: POST, path: "/{page_id}/messages", path_params: [page_id], body_params: [recipient, messaging_type, message, reply_to], action: send, risk: high, requires_approval: true, description: "Reply to a person on Messenger as the Page, normally within 24 hours of their last message" }
    - { id: posts.delete, method: DELETE, path: "/{post_id}", path_params: [post_id], description: "Delete a Page post" }
    - { id: comments.delete, method: DELETE, path: "/{comment_id}", path_params: [comment_id], description: "Delete a comment on the Page" }

- id: posthog
  name: "PostHog"
  vertical: data
  description: "Query product analytics and read insights, dashboards, flags, persons and experiments, and create insights or change feature flags with an approval."
  base_url: "https://us.posthog.com"
  logo: posthog
  brand_color: "#000000"
  auth: { scheme: bearer }
  redact_fields: [api_token, secret_api_token, secret_api_token_backup, created_by.email, last_modified_by.email, "$ip", "$geoip_latitude", "$geoip_longitude", "$geoip_postal_code"]
  credential:
    label: "Personal API key"
    url: "https://us.posthog.com/settings/user-api-keys"
    hint: "Choose Create a personal API key and select only the scopes you need, such as query:read, insight:read and feature_flag:read. EU accounts use eu.posthog.com and need the operator to change the host."
  capabilities:
    - { id: organizations.list, method: GET, path: "/api/organizations/", query_params: [limit, offset], description: "List the organizations the key can see" }
    - { id: projects.list, method: GET, path: "/api/organizations/{organization_id}/projects/", path_params: [organization_id], query_params: [limit, offset, search, tags, tags_match], description: "List the projects in an organization, to get a project id" }
    - { id: query.run, method: POST, path: "/api/projects/{project_id}/query/", path_params: [project_id], body_params: [query, name, refresh, client_query_id, filters_override, variables_override], action: search, risk: medium, description: "Run a read-only analytics query, such as HogQL over events and persons" }
    - { id: insights.list, method: GET, path: "/api/projects/{project_id}/insights/", path_params: [project_id], query_params: [search, saved, favorited, created_by, short_id, tags, limit, offset, order], description: "List and search saved insights" }
    - { id: insights.read, method: GET, path: "/api/projects/{project_id}/insights/{id}/", path_params: [project_id, id], query_params: [refresh, from_dashboard], description: "Read a saved insight and its results" }
    - { id: dashboards.list, method: GET, path: "/api/projects/{project_id}/dashboards/", path_params: [project_id], query_params: [search, pinned, created_by, limit, offset, ordering], description: "List and search dashboards" }
    - { id: dashboards.read, method: GET, path: "/api/projects/{project_id}/dashboards/{id}/", path_params: [project_id, id], description: "Read a dashboard" }
    - { id: feature_flags.list, method: GET, path: "/api/projects/{project_id}/feature_flags/", path_params: [project_id], query_params: [active, archived, key, search, tags, type, limit, offset], description: "List and search feature flags" }
    - { id: feature_flags.read, method: GET, path: "/api/projects/{project_id}/feature_flags/{id}/", path_params: [project_id, id], description: "Read a feature flag and its rollout rules" }
    - { id: persons.list, method: GET, path: "/api/projects/{project_id}/persons/", path_params: [project_id], query_params: [distinct_id, email, properties, search, limit, offset], description: "List and search persons" }
    - { id: persons.read, method: GET, path: "/api/projects/{project_id}/persons/{id}/", path_params: [project_id, id], description: "Read a person and their properties" }
    - { id: experiments.list, method: GET, path: "/api/projects/{project_id}/experiments/", path_params: [project_id], query_params: [archived, status, search, feature_flag_id, tags, limit, offset, order], description: "List experiments" }
    - { id: surveys.list, method: GET, path: "/api/projects/{project_id}/surveys/", path_params: [project_id], query_params: [archived, search, status, type, ids, limit, offset], description: "List surveys" }
    - { id: insights.create, method: POST, path: "/api/projects/{project_id}/insights/", path_params: [project_id], body_params: [name, query, description, tags, favorited], description: "Save a new insight" }
    - { id: feature_flags.create, method: POST, path: "/api/projects/{project_id}/feature_flags/", path_params: [project_id], body_params: [key, name, filters, active, tags, ensure_experience_continuity, evaluation_runtime], description: "Create a feature flag" }
    - { id: feature_flags.update, method: PATCH, path: "/api/projects/{project_id}/feature_flags/{id}/", path_params: [project_id, id], body_params: [name, filters, active, archived, tags, ensure_experience_continuity, evaluation_runtime, version], description: "Change a flag's rollout, turn it on or off, or archive it" }
    - { id: annotations.create, method: POST, path: "/api/projects/{project_id}/annotations/", path_params: [project_id], body_params: [content, date_marker, scope, dashboard_id, dashboard_item], description: "Add an annotation to charts, such as a deploy marker" }
    - { id: surveys.delete, method: DELETE, path: "/api/projects/{project_id}/surveys/{id}/", path_params: [project_id, id], description: "Delete a survey" }

- id: meta-ads
  name: Meta Marketing API
  vertical: marketing
  description: "Read ad accounts, campaigns, ad sets, ads, creatives, audiences and insights across Facebook and Instagram, with every change that can start or alter spend held behind an approval."
  base_url: "https://graph.facebook.com/v26.0"
  logo: meta
  brand_color: "#0866FF"
  auth: { scheme: bearer }
  redact_fields: [email, phone]
  oauth:
    authorize_url: "https://www.facebook.com/v26.0/dialog/oauth"
    token_url: "https://graph.facebook.com/v26.0/oauth/access_token"
    scopes: [ads_read, ads_management]
    pkce: false
    # Meta issues no refresh token: the code's short-lived token is exchanged for a sixty-day one, and the gateway renews that by exchanging it again before it expires.
    refresh_grant: exchange_token
  capabilities:
    - { id: me.read, method: GET, path: "/me", query_params: [fields], description: Read the user the connection acts as }
    - { id: ad_accounts.list, method: GET, path: "/me/adaccounts", query_params: [fields, limit, after, before], description: "List the ad accounts the user can reach; ask for fields such as name, account_status, currency and amount_spent" }
    - { id: ad_accounts.read, method: GET, path: "/act_{ad_account_id}", path_params: [ad_account_id], query_params: [fields], description: Read an ad account }
    - { id: campaigns.list, method: GET, path: "/act_{ad_account_id}/campaigns", path_params: [ad_account_id], query_params: [fields, effective_status, filtering, date_preset, time_range, limit, after, before], description: List an ad account's campaigns }
    - { id: adsets.list, method: GET, path: "/act_{ad_account_id}/adsets", path_params: [ad_account_id], query_params: [fields, effective_status, filtering, date_preset, time_range, limit, after, before], description: "List an ad account's ad sets, with budgets, bids, schedules and targeting" }
    - { id: ads.list, method: GET, path: "/act_{ad_account_id}/ads", path_params: [ad_account_id], query_params: [fields, effective_status, filtering, date_preset, time_range, limit, after, before], description: List an ad account's ads }
    - { id: creatives.list, method: GET, path: "/act_{ad_account_id}/adcreatives", path_params: [ad_account_id], query_params: [fields, limit, after, before], description: List an ad account's ad creatives }
    - { id: audiences.list, method: GET, path: "/act_{ad_account_id}/customaudiences", path_params: [ad_account_id], query_params: [fields, limit, after, before], description: List an ad account's custom audiences }
    - { id: insights.read, method: GET, path: "/act_{ad_account_id}/insights", path_params: [ad_account_id], query_params: [fields, level, date_preset, time_range, time_increment, breakdowns, action_breakdowns, filtering, sort, limit, after, before], description: "Read performance for an ad account at campaign, ad set or ad level over a date range" }
    - { id: objects.read, method: GET, path: "/{object_id}", path_params: [object_id], query_params: [fields], description: "Read one campaign, ad set, ad, creative or audience by id" }
    - { id: objects.insights, method: GET, path: "/{object_id}/insights", path_params: [object_id], query_params: [fields, level, date_preset, time_range, time_increment, breakdowns, action_breakdowns, filtering, sort, limit, after, before], description: "Read performance for one campaign, ad set or ad" }
    - { id: delivery.estimate, method: GET, path: "/act_{ad_account_id}/delivery_estimate", path_params: [ad_account_id], query_params: [targeting_spec, optimization_goal, promoted_object], description: Estimate the audience size and daily reach for a targeting }
    - { id: targeting.search, method: GET, path: "/search", query_params: [type, q, limit, location_types, country_code], description: "Search targeting options: interests, behaviors, locations and more, by type" }
    - { id: campaigns.create, method: POST, path: "/act_{ad_account_id}/campaigns", path_params: [ad_account_id], body_params: [name, objective, status, special_ad_categories, buying_type, daily_budget, lifetime_budget, bid_strategy, spend_cap, start_time, stop_time, is_skadnetwork_attribution], action: create, risk: high, requires_approval: true, description: Create a campaign }
    - { id: adsets.create, method: POST, path: "/act_{ad_account_id}/adsets", path_params: [ad_account_id], body_params: [name, campaign_id, status, daily_budget, lifetime_budget, billing_event, optimization_goal, bid_amount, bid_strategy, targeting, start_time, end_time, promoted_object, destination_type, attribution_spec, pacing_type], action: create, risk: high, requires_approval: true, description: "Create an ad set with its budget, bid, schedule and targeting" }
    - { id: ads.create, method: POST, path: "/act_{ad_account_id}/ads", path_params: [ad_account_id], body_params: [name, adset_id, creative, status, tracking_specs, conversion_domain], action: create, risk: high, requires_approval: true, description: Create an ad from a creative }
    - { id: creatives.create, method: POST, path: "/act_{ad_account_id}/adcreatives", path_params: [ad_account_id], body_params: [name, object_story_spec, object_story_id, asset_feed_spec, degrees_of_freedom_spec, url_tags, call_to_action_type], action: create, risk: high, requires_approval: true, description: "Create an ad creative, the content an ad publishes under the account's pages" }
    - { id: objects.update, method: POST, path: "/{object_id}", path_params: [object_id], body_params: [name, status, daily_budget, lifetime_budget, spend_cap, bid_amount, bid_strategy, targeting, optimization_goal, billing_event, start_time, end_time, stop_time, promoted_object, creative, special_ad_categories, adlabels], action: update, risk: high, requires_approval: true, description: "Update a campaign, ad set or ad, including pausing or activating it and changing its budget" }
    - { id: objects.delete, method: DELETE, path: "/{object_id}", path_params: [object_id], action: delete, risk: critical, requires_approval: true, description: "Delete a campaign, ad set, ad or creative" }

- id: linkedin
  name: "LinkedIn"
  vertical: social
  description: "Post, comment and react as a member or company page with an approval, and read company posts, followers and statistics where LinkedIn grants access."
  base_url: "https://api.linkedin.com"
  logo: linkedin
  brand_color: "#0A66C2"
  auth: { scheme: bearer }
  static_headers: { Linkedin-Version: "202610", X-Restli-Protocol-Version: "2.0.0" }
  redact_fields: [email, phoneNumber1]
  credential:
    label: "Your own OAuth app"
    url: "https://www.linkedin.com/developers/apps"
    hint: "Create an app, add the Share on LinkedIn and Sign In with LinkedIn using OpenID Connect products, and add the redirect URL. Tokens last 60 days, then you reconnect."
  oauth:
    authorize_url: "https://www.linkedin.com/oauth/v2/authorization"
    token_url: "https://www.linkedin.com/oauth/v2/accessToken"
    scopes: ["openid", "profile", "w_member_social"]
    pkce: false
    refresh_grant: none
  capabilities:
    - { id: profile.read, method: GET, path: "/v2/userinfo", description: "Read the connected member's name and id; the sub value forms the author URN urn:li:person:{sub}" }
    - { id: posts.read, method: GET, path: "/rest/posts/{post_urn}", path_params: [post_urn], query_params: [viewContext], description: "Read a post by share or ugcPost URN; needs r_organization_social or the restricted r_member_social" }
    - { id: posts.list, method: GET, path: "/rest/posts", query_params: [q, author, viewContext, start, count, sortBy], action: list, risk: medium, description: "List an author's posts; set q to author. An organization needs r_organization_social, a person r_member_social" }
    - { id: comments.list, method: GET, path: "/rest/socialActions/{entity_urn}/comments", path_params: [entity_urn], query_params: [start, count], description: "List comments on a post or comment; needs an organization or restricted member read scope" }
    - { id: reactions.list, method: GET, path: "/rest/reactions/(entity:{entity_urn})", path_params: [entity_urn], query_params: [q, start, count], description: "List reactions on a post or comment; set q to entity. Needs an organization or restricted member read scope" }
    - { id: organizations.acls, method: GET, path: "/rest/organizationAcls", query_params: [q, role, state, organization, start, count], action: list, risk: medium, description: "List the pages a member can manage, with q set to roleAssignee, or a page's admins, with q set to organization" }
    - { id: organizations.read, method: GET, path: "/rest/organizations/{organization_id}", path_params: [organization_id], description: "Read a company page; the member must be an administrator and needs rw_organization_admin" }
    - { id: organizations.follower_count, method: GET, path: "/rest/networkSizes/urn:li:organization:{organization_id}", path_params: [organization_id], query_params: [edgeType], description: "Read a company page's follower count; set edgeType to COMPANY_FOLLOWED_BY_MEMBER" }
    - { id: statistics.followers, method: GET, path: "/rest/organizationalEntityFollowerStatistics", query_params: [q, organizationalEntity], action: read, risk: medium, description: "Read a company page's lifetime follower statistics; set q to organizationalEntity. Needs rw_organization_admin" }
    - { id: statistics.shares, method: GET, path: "/rest/organizationalEntityShareStatistics", query_params: [q, organizationalEntity], action: read, risk: medium, description: "Read a company page's lifetime post statistics; set q to organizationalEntity. Needs rw_organization_admin" }
    - { id: posts.create, method: POST, path: "/rest/posts", body_params: [author, commentary, visibility, distribution, lifecycleState, isReshareDisabledByAuthor, content, contentLandingPage, contentCallToActionLabel, reshareContext], action: send, risk: high, requires_approval: true, description: "Publish a post as the member or a company page; set lifecycleState to PUBLISHED" }
    - { id: comments.create, method: POST, path: "/rest/socialActions/{entity_urn}/comments", path_params: [entity_urn], body_params: [actor, object, message, content, parentComment], action: send, risk: high, requires_approval: true, description: "Post a public comment on a post or a reply to a comment" }
    - { id: reactions.create, method: POST, path: "/rest/reactions", query_params: [actor], body_params: [root, reactionType], action: send, risk: high, requires_approval: true, description: "React to a post or comment as the actor passed in the actor query parameter" }
    - { id: posts.delete, method: DELETE, path: "/rest/posts/{post_urn}", path_params: [post_urn], description: "Delete a post" }
    - { id: comments.delete, method: DELETE, path: "/rest/socialActions/{entity_urn}/comments/{comment_id}", path_params: [entity_urn, comment_id], query_params: [actor], description: "Delete a comment; pass actor when deleting as an organization" }
    - { id: reactions.delete, method: DELETE, path: "/rest/reactions/(actor:{actor_urn},entity:{entity_urn})", path_params: [actor_urn, entity_urn], description: "Remove a reaction" }

- id: shopify
  name: "Shopify"
  vertical: commerce
  description: "Read orders, products, customers and inventory, and edit products or orders, fulfill, capture, cancel or refund with an approval."
  base_url: "https://{shop}.myshopify.com/admin/api/2026-10"
  logo: shopify
  brand_color: "#7AB55C"
  auth: { scheme: api_key_header, header: X-Shopify-Access-Token }
  redact_fields: [phone, address1, address2, latitude, longitude, clientIp, creditCardNumber, phoneNumber, accessToken]
  credential:
    label: "Client ID and secret"
    url: "https://shopify.dev/docs/apps/build/dev-dashboard"
    hint: "Create an app in the Dev Dashboard under your store's organization, install it on the store, and paste client_id:client_secret. A custom app made before 2026 can paste its Admin API token instead."
  oauth:
    token_url: "/admin/oauth/access_token"
    grant: client_credentials
    accepts_token: true
  capabilities:
    - { id: shop.read, method: POST, path: "/graphql.json", body_params: [query, variables], action: read, risk: medium, graphql: { operation: query, root_fields: [shop] }, description: "Read the store's details and settings" }
    - { id: orders.query, method: POST, path: "/graphql.json", body_params: [query, variables], action: list, risk: medium, graphql: { operation: query, root_fields: [orders, order, ordersCount] }, description: "List, search or read orders with a GraphQL query" }
    - { id: products.query, method: POST, path: "/graphql.json", body_params: [query, variables], action: list, risk: medium, graphql: { operation: query, root_fields: [products, product, productsCount, productVariants, productVariant] }, description: "List, search or read products and variants with a GraphQL query" }
    - { id: customers.query, method: POST, path: "/graphql.json", body_params: [query, variables], action: list, risk: medium, graphql: { operation: query, root_fields: [customers, customer, customersCount] }, description: "List, search or read customers with a GraphQL query" }
    - { id: inventory.query, method: POST, path: "/graphql.json", body_params: [query, variables], action: list, risk: medium, graphql: { operation: query, root_fields: [inventoryItems, inventoryItem, inventoryLevel, locations, location] }, description: "Read inventory items, levels and locations with a GraphQL query" }
    - { id: products.create, method: POST, path: "/graphql.json", body_params: [query, variables], action: create, risk: high, graphql: { operation: mutation, root_fields: [productCreate] }, description: "Create a product (productCreate)" }
    - { id: products.update, method: POST, path: "/graphql.json", body_params: [query, variables], action: update, risk: high, graphql: { operation: mutation, root_fields: [productUpdate, productVariantsBulkUpdate] }, description: "Update a product or its variants (productUpdate, productVariantsBulkUpdate)" }
    - { id: products.delete, method: POST, path: "/graphql.json", body_params: [query, variables], action: delete, risk: critical, requires_approval: true, graphql: { operation: mutation, root_fields: [productDelete] }, description: "Delete a product (productDelete)" }
