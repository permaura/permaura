    - { id: files.read, method: GET, path: "/files/{file_id}", path_params: [file_id], query_params: [fields], description: "Read a file's details, not its bytes" }
    - { id: files.versions, method: GET, path: "/files/{file_id}/versions", path_params: [file_id], query_params: [fields, limit, offset], description: "List a file's past versions" }
    - { id: comments.list, method: GET, path: "/files/{file_id}/comments", path_params: [file_id], query_params: [fields, limit, offset], description: "List the comments on a file" }
    - { id: collaborations.list, method: GET, path: "/folders/{folder_id}/collaborations", path_params: [folder_id], query_params: [fields, limit, marker], description: "List who has access to a folder" }
    - { id: folders.create, method: POST, path: "/folders", query_params: [fields], body_params: [name, parent], description: "Create a folder" }
    - { id: files.update, method: PUT, path: "/files/{file_id}", path_params: [file_id], query_params: [fields], body_params: [name, description, parent, tags], description: "Rename or move a file, or change its description or tags" }
    - { id: folders.update, method: PUT, path: "/folders/{folder_id}", path_params: [folder_id], query_params: [fields], body_params: [name, description, parent, tags], description: "Rename or move a folder, or change its description or tags" }
    - { id: comments.create, method: POST, path: "/comments", query_params: [fields], body_params: [item, message, tagged_message], action: send, risk: high, requires_approval: true, description: "Add a comment to a file" }
    - { id: tasks.create, method: POST, path: "/tasks", body_params: [item, action, message, due_at, completion_rule], description: "Create a review or completion task on a file" }
    - { id: files.share, method: PUT, path: "/files/{file_id}", path_params: [file_id], query_params: [fields], body_params: [shared_link], action: update, risk: high, requires_approval: true, description: "Create or change a file's shared link; fields must be set to shared_link" }
    - { id: collaborations.create, method: POST, path: "/collaborations", query_params: [fields, notify], body_params: [item, accessible_by, role, expires_at, can_view_path], action: create, risk: high, requires_approval: true, description: "Give a person or group access to a file or folder" }
    - { id: files.delete, method: DELETE, path: "/files/{file_id}", path_params: [file_id], description: "Delete a file, or move it to the trash, as the enterprise settings decide" }
    - { id: folders.delete, method: DELETE, path: "/folders/{folder_id}", path_params: [folder_id], query_params: [recursive], description: "Delete a folder or move it to the trash; recursive is needed when it is not empty" }

