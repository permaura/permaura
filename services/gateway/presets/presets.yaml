    - { id: assignments.list, method: GET, path: "/courses/{course_id}/assignments", path_params: [course_id], query_params: ["include[]", search_term, override_assignment_dates, needs_grading_count_by_section, bucket, "assignment_ids[]", order_by, post_to_sis, per_page, page], description: "List or search the assignments in a course" }
    - { id: assignments.read, method: GET, path: "/courses/{course_id}/assignments/{id}", path_params: [course_id, id], query_params: ["include[]", override_assignment_dates, needs_grading_count_by_section, all_dates], description: "Read an assignment" }
    - { id: submissions.list, method: GET, path: "/courses/{course_id}/assignments/{assignment_id}/submissions", path_params: [course_id, assignment_id], query_params: ["include[]", grouped, per_page, page], description: "List the submissions for an assignment" }
    - { id: submissions.read, method: GET, path: "/courses/{course_id}/assignments/{assignment_id}/submissions/{user_id}", path_params: [course_id, assignment_id, user_id], query_params: ["include[]"], description: "Read one student's submission" }
    - { id: users.list, method: GET, path: "/courses/{course_id}/users", path_params: [course_id], query_params: [search_term, sort, "enrollment_type[]", enrollment_role_id, "section_ids[]", "include[]", user_id, "user_ids[]", "enrollment_state[]", per_page, page], description: "List or search the people in a course" }
    - { id: modules.list, method: GET, path: "/courses/{course_id}/modules", path_params: [course_id], query_params: ["include[]", search_term, student_id, per_page, page], description: "List the modules in a course" }
    - { id: announcements.list, method: GET, path: "/announcements", query_params: ["context_codes[]", start_date, end_date, available_after, active_only, latest_only, "include[]", per_page, page], description: "List announcements; context_codes[] is required, such as course_123" }
    - { id: conversations.list, method: GET, path: "/conversations", query_params: [scope, "filter[]", filter_mode, include_all_conversation_ids, "include[]", per_page, page], description: "List the inbox conversations of the token's user" }
    - { id: assignments.create, method: POST, path: "/courses/{course_id}/assignments", path_params: [course_id], body_params: [assignment], requires_approval: true, description: "Create an assignment in a course" }
    - { id: assignments.update, method: PUT, path: "/courses/{course_id}/assignments/{id}", path_params: [course_id, id], body_params: [assignment], requires_approval: true, description: "Edit an assignment" }
    - { id: submissions.grade, method: PUT, path: "/courses/{course_id}/assignments/{assignment_id}/submissions/{user_id}", path_params: [course_id, assignment_id, user_id], body_params: [submission, comment, rubric_assessment, include, prefer_points_over_scheme], action: update, risk: high, requires_approval: true, description: "Grade or comment on a student's submission" }
    - { id: announcements.create, method: POST, path: "/courses/{course_id}/discussion_topics", path_params: [course_id], body_params: [title, message, is_announcement, published, delayed_post_at, lock_comment, specific_sections], action: send, risk: high, requires_approval: true, description: "Post an announcement to a course; set is_announcement to true" }
    - { id: conversations.create, method: POST, path: "/conversations", body_params: [recipients, subject, body, force_new, group_conversation, attachment_ids, mode, context_code], action: send, risk: high, requires_approval: true, description: "Send an inbox message to people or a course group" }
    - { id: assignments.delete, method: DELETE, path: "/courses/{course_id}/assignments/{id}", path_params: [course_id, id], description: "Delete an assignment" }

- id: salesforce
  name: "Salesforce"
  vertical: crm
  description: "Query and search any object you can see, and create or update records, send email or delete with an approval."
  base_url: "https://{my_domain}.my.salesforce.com/services/data/v68.0"
  logo: salesforce
  brand_color: "#00A1E0"
  auth: { scheme: bearer }
  redact_fields: [Phone, MobilePhone, HomePhone, OtherPhone, AssistantPhone, Fax, Birthdate, MailingStreet, OtherStreet, MailingAddress, OtherAddress, SuppliedPhone, PersonBirthdate, PersonMobilePhone, PersonHomePhone, PersonMailingStreet, PersonMailingAddress, Street, Address, PersonOtherStreet, PersonOtherPhone, PersonAssistantPhone, ConsumerSecret, SecretValue, SessionToken, SharedKey, DeleteToken]
  credential:
    label: "Your own OAuth app"
    url: "https://help.salesforce.com/s/articleView?id=xcloud.create_a_local_external_client_app.htm&type=5"
    hint: "In Setup open App Manager, New External Client App, Distribution State Local. Enable OAuth with the api and refresh_token scopes and the gateway's callback URL, and keep PKCE on."
    oauth_only: true
  oauth:
    authorize_url: "https://login.salesforce.com/services/oauth2/authorize"
    token_url: "https://login.salesforce.com/services/oauth2/token"
    scopes: ["api", "refresh_token"]
    pkce: true
  capabilities:
    - { id: query.run, method: GET, path: "/query", query_params: [q], description: "Run a SOQL query, such as SELECT Id, Name FROM Account LIMIT 10" }
    - { id: query.next, method: GET, path: "/query/{query_locator}", path_params: [query_locator], description: "Get the next batch of a query; query_locator is the last part of nextRecordsUrl" }
    - { id: search.run, method: GET, path: "/search", query_params: [q], description: "Run a SOSL text search across objects, such as FIND {Acme} IN ALL FIELDS" }
    - { id: objects.list, method: GET, path: "/sobjects", description: "List the objects available to the signed-in user" }
    - { id: objects.describe, method: GET, path: "/sobjects/{sobject}/describe", path_params: [sobject], description: "Read an object's fields, types and relationships" }
    - { id: records.read, method: GET, path: "/sobjects/{sobject}/{id}", path_params: [sobject, id], query_params: [fields], description: "Read a record; fields is a comma-separated list" }
    - { id: limits.read, method: GET, path: "/limits", description: "Read the org's API usage and limits" }
    - { id: leads.create, method: POST, path: "/sobjects/Lead", body_params: [FirstName, LastName, Company, Email, Phone, Title, Status, LeadSource, Description, Industry, Website, OwnerId], description: "Create a lead; LastName and Company are required" }
    - { id: contacts.create, method: POST, path: "/sobjects/Contact", body_params: [FirstName, LastName, Email, Phone, Title, Department, AccountId, Description, LeadSource, OwnerId], description: "Create a contact; LastName is required" }
    - { id: accounts.create, method: POST, path: "/sobjects/Account", body_params: [Name, Industry, Website, Type, Description, Phone, NumberOfEmployees, AnnualRevenue, ParentId, OwnerId], description: "Create an account; Name is required" }
    - { id: opportunities.create, method: POST, path: "/sobjects/Opportunity", body_params: [Name, StageName, CloseDate, AccountId, Amount, Description, Type, NextStep, Probability, LeadSource, OwnerId], description: "Create an opportunity; Name, StageName and CloseDate are required" }
    - { id: cases.create, method: POST, path: "/sobjects/Case", body_params: [Subject, Description, Status, Priority, Origin, ContactId, AccountId, Type, Reason, OwnerId], description: "Create a case" }
    - { id: tasks.create, method: POST, path: "/sobjects/Task", body_params: [Subject, Status, Priority, ActivityDate, WhoId, WhatId, Description, OwnerId], description: "Create a task, optionally about a person (WhoId) or record (WhatId)" }
    - { id: records.create_many, method: POST, path: "/composite/sobjects", body_params: [allOrNone, records], risk: high, requires_approval: true, description: "Create up to 200 records of any object, custom fields included; each needs attributes.type" }
    - { id: records.update_many, method: PATCH, path: "/composite/sobjects", body_params: [allOrNone, records], risk: high, requires_approval: true, description: "Update up to 200 records of any object; each needs attributes.type and id" }
    - { id: emails.send, method: POST, path: "/actions/standard/emailSimple", body_params: [inputs], action: send, risk: high, requires_approval: true, description: "Send an email from Salesforce; inputs holds recipientAddresses, emailSubject and emailBody" }
    - { id: records.delete, method: DELETE, path: "/sobjects/{sobject}/{id}", path_params: [sobject, id], description: "Delete a record" }

- id: tavily
  name: "Tavily"
  vertical: data
  description: "Search the web, extract pages and map sites using plan credits, read usage, and run site crawls or research tasks with an approval."
  base_url: "https://api.tavily.com"
  logo: tavily
  auth: { scheme: bearer }
  connection_headers:
    - { name: X-Project-ID, label: "Project ID", required: false, description: "Optional Tavily project to track this connection's usage under." }
  redact_fields: [api_key]
  credential:
    label: "API key"
    url: "https://app.tavily.com"
    hint: "Create a key in the Tavily dashboard and paste it as is. It starts with tvly-."
  capabilities:
    - { id: search.web, method: POST, path: "/search", body_params: [query, search_depth, chunks_per_source, max_results, topic, time_range, start_date, end_date, max_age_hours, include_answer, include_raw_content, include_images, include_image_descriptions, include_favicon, include_domains, exclude_domains, include_domains_mode, country, language, filter_by_language, auto_parameters, exact_match, include_usage, safe_search], action: search, risk: medium, description: "Search the web and return ranked results, with an optional answer. Uses plan credits: 1 for basic, 2 for advanced." }
    - { id: extract.pages, method: POST, path: "/extract", body_params: [urls, query, chunks_per_source, extract_depth, include_images, include_favicon, format, timeout, include_usage], action: search, risk: medium, description: "Extract clean content from 1 to 20 URLs. Uses plan credits: 1 per 5 pages on basic, 2 on advanced." }
    - { id: map.site, method: POST, path: "/map", body_params: [url, instructions, max_depth, max_breadth, limit, select_paths, select_domains, exclude_paths, exclude_domains, allow_external, timeout, include_usage], action: search, risk: medium, description: "List the URLs on a site without reading them. Uses plan credits: 1 per 10 pages, 2 with instructions." }
    - { id: crawl.run, method: POST, path: "/crawl", body_params: [url, instructions, chunks_per_source, max_depth, max_breadth, limit, select_paths, select_domains, exclude_paths, exclude_domains, allow_external, include_images, extract_depth, format, include_favicon, timeout, include_usage], description: "Crawl a site and return page contents in one call of up to 150 seconds. Uses plan credits for pages mapped and extracted." }
    - { id: research.start, method: POST, path: "/research", body_params: [input, model, output_schema, citation_format, include_domains, exclude_domains, output_length], description: "Start a cited research task, then poll research.read. Uses 4 to 250 plan credits per task depending on the model." }
    - { id: research.read, method: GET, path: "/research/{request_id}", path_params: [request_id], query_params: [include_usage], description: "Read a research task's status and its report and sources" }
    - { id: usage.read, method: GET, path: "/usage", description: "Read credit usage and limits for this API key and the account plan" }
    - { id: logs.list, method: POST, path: "/logs", body_params: [limit, start_date, end_date, endpoints, project_id, filter_by_api_key], action: list, risk: medium, description: "List per-request usage logs for the account's keys, without inputs or outputs. Needs a paid plan or pay-as-you-go." }

- id: jira
  name: "Jira"
  vertical: devtools
  description: "Read and search issues, projects and comments, and create, edit, move or delete issues with an approval."
  base_url: "https://{site}.atlassian.net/rest/api/3"
  logo: jira
  brand_color: "#0052CC"
  auth: { scheme: basic }
  redact_fields: [emailAddress]
  credential:
    label: "Atlassian email and API token"
    url: "https://id.atlassian.com/manage-profile/security/api-tokens"
    hint: "Choose Create API token, not the scoped option, and paste it as email:token using your Atlassian account email. {site} is the part before .atlassian.net. Tokens last at most a year."
  capabilities:
    - { id: issues.search, method: GET, path: "/search/jql", query_params: [jql, nextPageToken, maxResults, fields, expand, properties, fieldsByKeys, failFast, reconcileIssues], description: "Search issues with JQL, paged with nextPageToken" }
    - { id: issues.count, method: POST, path: "/search/approximate-count", body_params: [jql], action: search, risk: medium, description: "Count the issues matching a JQL query" }
    - { id: issues.read, method: GET, path: "/issue/{issueIdOrKey}", path_params: [issueIdOrKey], query_params: [fields, fieldsByKeys, expand, properties, updateHistory, failFast], description: "Read an issue by id or key" }
    - { id: issues.create, method: POST, path: "/issue", query_params: [updateHistory], body_params: [fields, update, properties, transition], description: "Create an issue; text fields use Atlassian Document Format" }
    - { id: issues.update, method: PUT, path: "/issue/{issueIdOrKey}", path_params: [issueIdOrKey], query_params: [notifyUsers, returnIssue, expand], body_params: [fields, update, properties, transition], description: "Edit the fields of an issue" }
    - { id: issues.assign, method: PUT, path: "/issue/{issueIdOrKey}/assignee", path_params: [issueIdOrKey], body_params: [accountId], description: "Assign an issue to an account id, or null to unassign" }
    - { id: issues.transitions, method: GET, path: "/issue/{issueIdOrKey}/transitions", path_params: [issueIdOrKey], query_params: [expand, transitionId, skipRemoteOnlyCondition, includeUnavailableTransitions, sortByOpsBarAndStatus], description: "List the status changes available on an issue" }
    - { id: issues.transition, method: POST, path: "/issue/{issueIdOrKey}/transitions", path_params: [issueIdOrKey], body_params: [transition, fields, update, properties], description: "Move an issue to a new status using a transition id" }
    - { id: issues.delete, method: DELETE, path: "/issue/{issueIdOrKey}", path_params: [issueIdOrKey], query_params: [deleteSubtasks], description: "Delete an issue, and its subtasks if deleteSubtasks is true" }
    - { id: comments.list, method: GET, path: "/issue/{issueIdOrKey}/comment", path_params: [issueIdOrKey], query_params: [startAt, maxResults, orderBy, expand], description: "List the comments on an issue" }
    - { id: comments.create, method: POST, path: "/issue/{issueIdOrKey}/comment", path_params: [issueIdOrKey], query_params: [expand], body_params: [body, visibility, properties], action: send, risk: high, requires_approval: true, description: "Add a comment to an issue; body uses Atlassian Document Format" }
    - { id: comments.update, method: PUT, path: "/issue/{issueIdOrKey}/comment/{id}", path_params: [issueIdOrKey, id], query_params: [notifyUsers, expand], body_params: [body, visibility, properties], description: "Edit a comment on an issue" }
    - { id: comments.delete, method: DELETE, path: "/issue/{issueIdOrKey}/comment/{id}", path_params: [issueIdOrKey, id], description: "Delete a comment from an issue" }
    - { id: projects.list, method: GET, path: "/project/search", query_params: [startAt, maxResults, orderBy, id, keys, query, typeKey, categoryId, action, expand, status], description: "List and filter the projects the account can see" }
    - { id: projects.read, method: GET, path: "/project/{projectIdOrKey}", path_params: [projectIdOrKey], query_params: [expand, properties], description: "Read a project by id or key" }
    - { id: projects.issue_types, method: GET, path: "/issue/createmeta/{projectIdOrKey}/issuetypes", path_params: [projectIdOrKey], query_params: [startAt, maxResults], description: "List the issue types that can be created in a project" }
    - { id: users.search, method: GET, path: "/user/search", query_params: [query, accountId, startAt, maxResults, property], description: "Find users by name or email to get an account id" }
    - { id: users.assignable, method: GET, path: "/user/assignable/search", query_params: [query, accountId, project, issueKey, issueId, startAt, maxResults, recommend], description: "Find users who can be assigned to an issue or project" }
    - { id: users.me, method: GET, path: "/myself", query_params: [expand], description: "Read the account the token belongs to" }

- id: exa
  name: "Exa"
  vertical: data
  description: "Search the web, read page contents, get cited answers and read runs, monitors and Websets, and start agent runs or Websets with an approval."
  base_url: "https://api.exa.ai"
  logo: exa
  auth: { scheme: api_key_header, header: x-api-key }
  redact_fields: [webhook.url]
  credential:
    label: "API key"
    url: "https://dashboard.exa.ai/api-keys"
    hint: "Create a key under API Keys in the Exa dashboard and paste it as is."
  capabilities:
    - { id: search.web, method: POST, path: "/search", body_params: [query, type, category, numResults, includeDomains, excludeDomains, startPublishedDate, endPublishedDate, userLocation, moderation, contents, additionalQueries, outputSchema, systemPrompt, objective], action: search, risk: medium, description: "Search the web and optionally return page contents. Uses account credits; deep search types cost more." }
    - { id: contents.read, method: POST, path: "/contents", body_params: [urls, ids, text, highlights, summary, extras, maxAgeHours, livecrawlTimeout, snapshotAsOf], action: search, risk: medium, description: "Read the text, highlights or summary of known URLs or result ids. Uses account credits." }
    - { id: answer.ask, method: POST, path: "/answer", body_params: [query, text, model, systemPrompt, userLocation, outputSchema], action: search, risk: medium, description: "Answer a question from Exa search results, with citations. Uses account credits." }
    - { id: agent.start, method: POST, path: "/agent/runs", body_params: [query, systemPrompt, effort, input, outputSchema, previousRunId, metadata, budget], requires_approval: true, description: "Start a long research or list-building run. Bills real money: default cap $5 for auto and $20 for ultra, set in budget." }
    - { id: agent.list, method: GET, path: "/agent/runs", query_params: [limit, cursor], description: "List the team's agent runs, newest first" }
    - { id: agent.read, method: GET, path: "/agent/runs/{id}", path_params: [id], description: "Read an agent run's status, output and cost" }
    - { id: agent.cancel, method: POST, path: "/agent/runs/{id}/cancel", path_params: [id], description: "Cancel a queued or running agent run. Usage so far is still billed and no results are returned." }
    - { id: agent.delete, method: DELETE, path: "/agent/runs/{id}", path_params: [id], description: "Delete a stored agent run" }
    - { id: monitors.list, method: GET, path: "/monitors", query_params: [status, cursor, limit, name], description: "List the team's scheduled search monitors" }
    - { id: monitors.read, method: GET, path: "/monitors/{id}", path_params: [id], description: "Read a monitor's search, schedule and status" }
    - { id: monitors.runs, method: GET, path: "/monitors/{id}/runs", path_params: [id], query_params: [cursor, limit], description: "List a monitor's runs, newest first" }
    - { id: monitors.run_read, method: GET, path: "/monitors/{id}/runs/{runId}", path_params: [id, runId], description: "Read one monitor run, including its output once it completes" }
    - { id: websets.list, method: GET, path: "/websets/v0/websets", query_params: [cursor, limit, search], description: "List Websets, optionally filtered by id, external id or title. Needs a paid Websets plan." }
    - { id: websets.read, method: GET, path: "/websets/v0/websets/{id}", path_params: [id], query_params: [expand], description: "Read a Webset's status, searches and enrichments. Set expand to items for the first 100 items." }
    - { id: websets.items, method: GET, path: "/websets/v0/websets/{webset}/items", path_params: [webset], query_params: [cursor, limit, sourceId], description: "List the items in a Webset" }
    - { id: websets.create, method: POST, path: "/websets/v0/websets", body_params: [title, search, import, enrichments, exclude, externalId, metadata], description: "Create a Webset, which starts finding and enriching items at once. Uses Websets credits." }

- id: instagram
  name: "Instagram"
  vertical: social
  description: "Read a professional account's media, comments, tags and insights, and publish posts, reply to, hide or delete comments with an approval."
  base_url: "https://graph.facebook.com/v26.0"
  logo: instagram
  brand_color: "#FF0069"
  auth: { scheme: bearer }
  redact_fields: [access_token, page_token]
  credential:
    label: "Your own OAuth app"
    url: "https://developers.facebook.com/apps"
    hint: "Create a Meta Business app, add Facebook Login for Business and the redirect URL. The Instagram account must be a Business or Creator account linked to a Facebook Page you manage."
    oauth_only: true
  oauth:
    authorize_url: "https://www.facebook.com/v26.0/dialog/oauth"
    token_url: "https://graph.facebook.com/v26.0/oauth/access_token"
    scopes: ["instagram_basic", "instagram_content_publish", "instagram_manage_comments", "instagram_manage_insights", "instagram_manage_contents", "pages_show_list", "pages_read_engagement"]
    pkce: false
    refresh_grant: exchange_token
  capabilities:
    - { id: pages.list, method: GET, path: "/me/accounts", query_params: [fields, limit, after, before], description: "List the user's Pages; ask for fields name and instagram_business_account to find the Instagram account id" }
    - { id: account.read, method: GET, path: "/{ig_user_id}", path_params: [ig_user_id], query_params: [fields], description: "Read the account; fields can also request business_discovery.username(name) to read another professional account" }
    - { id: account.insights, method: GET, path: "/{ig_user_id}/insights", path_params: [ig_user_id], query_params: [metric, period, since, until, metric_type, timeframe, breakdown], description: "Read account insights over a period; metric and period are required" }
    - { id: media.list, method: GET, path: "/{ig_user_id}/media", path_params: [ig_user_id], query_params: [fields, since, until, limit, after, before], description: "List the account's posts, excluding stories" }
    - { id: tags.list, method: GET, path: "/{ig_user_id}/tags", path_params: [ig_user_id], query_params: [fields, limit, after, before], description: "List media other accounts have tagged this account in" }
    - { id: media.read, method: GET, path: "/{media_id}", path_params: [media_id], query_params: [fields], description: "Read a post, or a publishing container's progress with fields set to status_code" }
    - { id: media.insights, method: GET, path: "/{media_id}/insights", path_params: [media_id], query_params: [metric, period, breakdown], description: "Read a post's insights" }
    - { id: comments.list, method: GET, path: "/{media_id}/comments", path_params: [media_id], query_params: [fields, limit, after, before], description: "List comments on a post" }
    - { id: comments.replies, method: GET, path: "/{comment_id}/replies", path_params: [comment_id], query_params: [fields, limit, after, before], description: "List replies to a comment" }
    - { id: containers.create, method: POST, path: "/{ig_user_id}/media", path_params: [ig_user_id], body_params: [image_url, video_url, media_type, is_carousel_item, children, caption, alt_text, location_id, user_tags, collaborators, share_to_feed, cover_url, thumb_offset, audio_name, is_ai_generated], action: create, risk: high, description: "Create an unpublished media container from a public image or video URL, which media.publish then publishes" }
    - { id: media.publish, method: POST, path: "/{ig_user_id}/media_publish", path_params: [ig_user_id], body_params: [creation_id], action: send, risk: high, requires_approval: true, description: "Publish a finished media container to the account, where it is public at once" }
    - { id: comments.create, method: POST, path: "/{media_id}/comments", path_params: [media_id], body_params: [message], action: send, risk: high, requires_approval: true, description: "Post a public comment on a post" }
    - { id: comments.reply, method: POST, path: "/{comment_id}/replies", path_params: [comment_id], body_params: [message], action: send, risk: high, requires_approval: true, description: "Post a public reply to a comment" }
    - { id: comments.hide, method: POST, path: "/{comment_id}", path_params: [comment_id], body_params: [hide], action: update, risk: high, requires_approval: true, description: "Hide or show a comment on the account's own media" }
    - { id: comments.delete, method: DELETE, path: "/{comment_id}", path_params: [comment_id], description: "Delete a comment on the account's own media" }
    - { id: media.delete, method: DELETE, path: "/{media_id}", path_params: [media_id], description: "Delete a post, story, reel or whole carousel" }

- id: serpapi
  name: "SerpApi"
  vertical: data
  description: "Read structured results from Google, Bing, YouTube, Amazon and other search engines using plan searches. The API is read-only, so nothing needs an approval."
  base_url: "https://serpapi.com"
  logo: serpapi
  auth: { scheme: api_key_query, param: api_key }
  redact_fields: [api_key, account_email]
  credential:
    label: "API key"
    url: "https://serpapi.com/manage-api-key"
    hint: "Copy your private key from the API Key page of your SerpApi account and paste it as is."
  capabilities:
    - { id: search.google, method: GET, path: "/search.json", query_params: [engine, q, location, uule, lat, lon, radius, ludocid, kgmid, uds, google_domain, gl, hl, cr, lr, tbs, safe, nfpr, filter, tbm, start, device, no_cache, json_restrictor], action: search, description: "Search Google for structured results. Set engine to google. Uses one plan search; cached repeats are free." }
    - { id: search.google_news, method: GET, path: "/search.json", query_params: [engine, q, gl, hl, topic_token, kgmid, publication_token, section_token, story_token, so, no_cache, json_restrictor], action: search, description: "Search Google News. Set engine to google_news. Uses one plan search; cached repeats are free." }
    - { id: search.google_maps, method: GET, path: "/search.json", query_params: [engine, type, q, ll, location, lat, lon, z, m, nearby, google_domain, hl, gl, place_id, data_cid, min_price, max_price, min_rating, open_state, open_on_day, open_at_hour, start, no_cache, json_restrictor], action: search, description: "Search Google Maps or read a place. Set engine to google_maps and type to search or place. Uses one plan search." }
