- id: youtube
  name: "YouTube"
  vertical: social
  description: "Search and read videos, channels, playlists and comments; comments, video edits and playlist changes need an approval and OAuth."
  base_url: "https://youtube.googleapis.com/youtube/v3"
  logo: youtube
  brand_color: "#FF0000"
  auth: { scheme: api_key_query, param: key }
  credential:
    label: "API key"
    url: "https://console.cloud.google.com/apis/credentials"
    hint: "Create an API key in Google Cloud with the YouTube Data API v3 enabled. A key reads public data only; your own channel's private data and every write need the OAuth connection."
  oauth:
    authorize_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/youtube.force-ssl"]
    pkce: true
    token_scheme: { scheme: bearer }
  capabilities:
    - { id: search.list, method: GET, path: "/search", query_params: [part, q, type, channelId, forMine, order, maxResults, pageToken, publishedAfter, publishedBefore, regionCode, relevanceLanguage, safeSearch, videoCategoryId, videoDuration, videoCaption, eventType], description: "Search videos, channels and playlists; set part to snippet. Limited by default to 100 calls a day per project" }
    - { id: videos.list, method: GET, path: "/videos", query_params: [part, id, chart, myRating, regionCode, videoCategoryId, hl, maxResults, pageToken], description: "Read videos by id or chart; set part, such as snippet,statistics. myRating needs OAuth" }
    - { id: channels.list, method: GET, path: "/channels", query_params: [part, id, forHandle, forUsername, mine, hl, maxResults, pageToken], description: "Read channels by id or handle; set part, such as snippet,statistics. mine needs OAuth" }
    - { id: playlists.list, method: GET, path: "/playlists", query_params: [part, id, channelId, mine, hl, maxResults, pageToken], description: "List playlists by id or channel; set part, such as snippet. mine needs OAuth" }
    - { id: playlist_items.list, method: GET, path: "/playlistItems", query_params: [part, id, playlistId, videoId, maxResults, pageToken], description: "List the videos in a playlist; set part, such as snippet,contentDetails" }
    - { id: comment_threads.list, method: GET, path: "/commentThreads", query_params: [part, id, videoId, allThreadsRelatedToChannelId, searchTerms, moderationStatus, order, textFormat, maxResults, pageToken], description: "List comment threads on a video or channel; set part, such as snippet,replies. moderationStatus needs OAuth" }
    - { id: comments.list, method: GET, path: "/comments", query_params: [part, id, parentId, textFormat, maxResults, pageToken], description: "List replies with parentId or read comments by id; set part to snippet" }
    - { id: videos.update, method: PUT, path: "/videos", query_params: [part], body_params: [id, snippet, status, localizations], requires_approval: true, description: "Edit a video's title, description, tags or privacy; set part to the parts sent. Can make a video public. Needs OAuth" }
    - { id: comment_threads.create, method: POST, path: "/commentThreads", query_params: [part], body_params: [snippet], action: send, risk: high, requires_approval: true, description: "Post a public top-level comment on a video; set part to snippet. Needs OAuth" }
    - { id: comments.reply, method: POST, path: "/comments", query_params: [part], body_params: [snippet], action: send, risk: high, requires_approval: true, description: "Post a public reply to a comment; set part to snippet. Needs OAuth" }
    - { id: comments.set_moderation, method: POST, path: "/comments/setModerationStatus", query_params: [id, moderationStatus, banAuthor], action: update, risk: high, requires_approval: true, description: "Publish, hold or reject comments, optionally banning the author, on your own channel. Needs OAuth" }
    - { id: playlists.create, method: POST, path: "/playlists", query_params: [part], body_params: [snippet, status], requires_approval: true, description: "Create a playlist; set part to snippet,status. status.privacyStatus decides who can see it. Needs OAuth" }
    - { id: playlist_items.add, method: POST, path: "/playlistItems", query_params: [part], body_params: [snippet, contentDetails], description: "Add a video to a playlist; set part to snippet. Needs OAuth" }
    - { id: playlist_items.remove, method: DELETE, path: "/playlistItems", query_params: [id], description: "Remove an item from a playlist by playlist item id. Needs OAuth" }
    - { id: comments.delete, method: DELETE, path: "/comments", query_params: [id], description: "Delete a comment by id. Needs OAuth" }
    - { id: videos.delete, method: DELETE, path: "/videos", query_params: [id], description: "Permanently delete a video by id. Needs OAuth" }

- id: clickup
  name: "ClickUp"
  vertical: productivity
  description: "Read workspaces, lists, tasks and comments, and create, edit or delete tasks and add comments with an approval."
  base_url: "https://api.clickup.com/api/v2"
  logo: clickup
  brand_color: "#7B68EE"
  auth: { scheme: raw, header: Authorization, prefix: "" }
  redact_fields: [email, sharing.token]
  credential:
    label: "Personal API token"
    url: "https://app.clickup.com/settings/apps"
    hint: "Under API Token select Generate, or Regenerate if you already have one, and copy it. It starts with pk_ and acts as you in every Workspace you belong to."
  oauth:
    authorize_url: "https://app.clickup.com/api"
    token_url: "https://api.clickup.com/api/v2/oauth/token"
    pkce: false
    refresh_grant: none
    token_scheme: { scheme: bearer }
  capabilities:
    - { id: user.read, method: GET, path: "/user", description: "Read the user behind the token" }
    - { id: workspaces.list, method: GET, path: "/team", description: "List the Workspaces the token can reach; ClickUp calls a Workspace a team in this API" }
    - { id: spaces.list, method: GET, path: "/team/{team_id}/space", path_params: [team_id], query_params: [archived], description: "List the Spaces in a Workspace" }
    - { id: folders.list, method: GET, path: "/space/{space_id}/folder", path_params: [space_id], query_params: [archived], description: "List the Folders in a Space" }
    - { id: lists.list, method: GET, path: "/folder/{folder_id}/list", path_params: [folder_id], query_params: [archived], description: "List the Lists in a Folder" }
    - { id: lists.list_folderless, method: GET, path: "/space/{space_id}/list", path_params: [space_id], query_params: [archived], description: "List the Lists in a Space that sit outside any Folder" }
    - { id: tasks.list, method: GET, path: "/list/{list_id}/task", path_params: [list_id], query_params: [archived, include_markdown_description, page, order_by, reverse, subtasks, "statuses[]", include_closed, "assignees[]", "tags[]", due_date_gt, due_date_lt, date_created_gt, date_created_lt, date_updated_gt, date_updated_lt, date_done_gt, date_done_lt, custom_fields], description: "List the tasks in a List, with filters and paging" }
    - { id: tasks.search, method: GET, path: "/team/{team_id}/task", path_params: [team_id], query_params: [page, order_by, reverse, subtasks, "space_ids[]", "project_ids[]", "list_ids[]", "statuses[]", include_closed, "assignees[]", "tags[]", due_date_gt, due_date_lt, date_created_gt, date_created_lt, date_updated_gt, date_updated_lt, date_done_gt, date_done_lt, custom_fields, parent, include_markdown_description], description: "Filter tasks across a Workspace; returns up to 100 tasks per page" }
    - { id: tasks.read, method: GET, path: "/task/{task_id}", path_params: [task_id], query_params: [custom_task_ids, team_id, include_subtasks, include_markdown_description], description: "Read a task; team_id is required when custom_task_ids is true" }
    - { id: comments.list, method: GET, path: "/task/{task_id}/comment", path_params: [task_id], query_params: [custom_task_ids, team_id, start, start_id], description: "List a task's comments, newest first" }
    - { id: custom_fields.list, method: GET, path: "/list/{list_id}/field", path_params: [list_id], query_params: [include_applied_objects], description: "List the custom fields available on a List" }
    - { id: tasks.create, method: POST, path: "/list/{list_id}/task", path_params: [list_id], body_params: [name, description, markdown_content, assignees, group_assignees, tags, status, priority, due_date, due_date_time, start_date, start_date_time, time_estimate, points, parent, links_to, custom_fields, custom_item_id, check_required_custom_fields], description: "Create a task in a List" }
    - { id: tasks.update, method: PUT, path: "/task/{task_id}", path_params: [task_id], query_params: [custom_task_ids, team_id], body_params: [name, description, markdown_content, assignees, group_assignees, status, priority, due_date, due_date_time, start_date, start_date_time, time_estimate, points, parent, archived, custom_item_id], description: "Update a task's fields, status, dates or assignees" }
    - { id: custom_fields.set, method: POST, path: "/task/{task_id}/field/{field_id}", path_params: [task_id, field_id], query_params: [custom_task_ids, team_id], body_params: [value, value_options], description: "Set a custom field's value on a task" }
    - { id: comments.create, method: POST, path: "/task/{task_id}/comment", path_params: [task_id], query_params: [custom_task_ids, team_id], body_params: [comment_text, assignee, group_assignee, notify_all], action: send, risk: high, requires_approval: true, description: "Add a comment to a task; notify_all is required and also notifies the author when true" }
    - { id: tasks.delete, method: DELETE, path: "/task/{task_id}", path_params: [task_id], query_params: [custom_task_ids, team_id], description: "Delete a task" }

- id: microsoft-excel
  name: "Microsoft Excel"
  vertical: productivity
  description: "Read worksheets, ranges and tables in workbooks, and write cells or table rows with an approval."
  base_url: "https://graph.microsoft.com/v1.0"
  logo: microsoftexcel
  brand_color: "#217346"
  auth: { scheme: bearer }
  redact_fields: ["@microsoft.graph.downloadUrl"]
  credential:
    label: "Your own OAuth app"
    url: "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade"
    hint: "In Entra ID, App registrations, register a multitenant web app, add the delegated Graph permission Files.ReadWrite, and create a client secret."
    oauth_only: true
  oauth:
    authorize_url: "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
    token_url: "https://login.microsoftonline.com/common/oauth2/v2.0/token"
    scopes: ["Files.ReadWrite", "offline_access"]
    pkce: true
    authorize_params: { prompt: select_account }
  capabilities:
    - { id: drive.read, method: GET, path: "/me/drive", query_params: ["$select"], description: "Read the signed-in user's OneDrive; its id is the drive_id the other calls need" }
    - { id: files.search, method: GET, path: "/drives/{drive_id}/root/search(q='{q}')", path_params: [drive_id, q], query_params: ["$top", "$select", "$skipToken", "$skiptoken"], description: "Search a drive for workbooks by name or content; double any apostrophe in q" }
    - { id: worksheets.list, method: GET, path: "/drives/{drive_id}/items/{item_id}/workbook/worksheets", path_params: [drive_id, item_id], description: "List the worksheets in a workbook" }
    - { id: ranges.used, method: GET, path: "/drives/{drive_id}/items/{item_id}/workbook/worksheets/{worksheet}/usedRange()", path_params: [drive_id, item_id, worksheet], description: "Read the used range of a worksheet, including its values" }
    - { id: ranges.read, method: GET, path: "/drives/{drive_id}/items/{item_id}/workbook/worksheets/{worksheet}/range(address='{address}')", path_params: [drive_id, item_id, worksheet, address], query_params: ["$select"], description: "Read a range such as A1:C10 from a worksheet" }
    - { id: tables.list, method: GET, path: "/drives/{drive_id}/items/{item_id}/workbook/tables", path_params: [drive_id, item_id], description: "List the tables in a workbook" }
    - { id: tables.columns, method: GET, path: "/drives/{drive_id}/items/{item_id}/workbook/tables/{table}/columns", path_params: [drive_id, item_id, table], query_params: ["$top", "$skip"], description: "List a table's columns and their values" }
    - { id: tables.rows, method: GET, path: "/drives/{drive_id}/items/{item_id}/workbook/tables/{table}/rows", path_params: [drive_id, item_id, table], query_params: ["$top", "$skip"], description: "List a table's rows; use $top and $skip to page" }
    - { id: names.list, method: GET, path: "/drives/{drive_id}/items/{item_id}/workbook/names", path_params: [drive_id, item_id], description: "List the named items in a workbook" }
    - { id: ranges.update, method: PATCH, path: "/drives/{drive_id}/items/{item_id}/workbook/worksheets/{worksheet}/range(address='{address}')", path_params: [drive_id, item_id, worksheet, address], body_params: [values, formulas, numberFormat], description: "Write values, formulas or number formats to a range" }
    - { id: ranges.clear, method: POST, path: "/drives/{drive_id}/items/{item_id}/workbook/worksheets/{worksheet}/range(address='{address}')/clear", path_params: [drive_id, item_id, worksheet, address], body_params: [applyTo], action: update, risk: high, description: "Clear a range's contents, formats or both" }
    - { id: worksheets.add, method: POST, path: "/drives/{drive_id}/items/{item_id}/workbook/worksheets/add", path_params: [drive_id, item_id], body_params: [name], description: "Add a worksheet to a workbook" }
    - { id: tables.create, method: POST, path: "/drives/{drive_id}/items/{item_id}/workbook/tables/add", path_params: [drive_id, item_id], body_params: [address, hasHeaders], description: "Create a table from a range" }
    - { id: tables.add_row, method: POST, path: "/drives/{drive_id}/items/{item_id}/workbook/tables/{table}/rows", path_params: [drive_id, item_id, table], body_params: [values, index], description: "Add one or more rows to a table; values is a two-dimensional array" }
    - { id: tables.update_row, method: PATCH, path: "/drives/{drive_id}/items/{item_id}/workbook/tables/{table}/rows/{index}", path_params: [drive_id, item_id, table, index], body_params: [values], description: "Replace the values in a table row, addressed by its zero-based index" }
    - { id: tables.delete_row, method: DELETE, path: "/drives/{drive_id}/items/{item_id}/workbook/tables/{table}/rows/{index}", path_params: [drive_id, item_id, table, index], description: "Delete a table row, addressed by its zero-based index" }
    - { id: worksheets.delete, method: DELETE, path: "/drives/{drive_id}/items/{item_id}/workbook/worksheets/{worksheet}", path_params: [drive_id, item_id, worksheet], description: "Delete a worksheet and everything on it" }

- id: monday
  name: "monday.com"
  vertical: productivity
  description: "Read boards, items, updates and users, and create, edit, move, archive or delete items and post updates with an approval."
  base_url: "https://api.monday.com/v2"
  logo: monday
  auth: { scheme: raw, header: Authorization, prefix: "" }
  static_headers: { API-Version: "2026-10" }
  redact_fields: [email, phone, mobile_phone, birthday, location]
  credential:
    label: "Personal API token"
    url: "https://developer.monday.com/api-reference/docs/authentication"
    hint: "In monday.com select your profile picture, then Developers, API token, Show, and copy it. Admins also find it under Administration, Connections, Personal API token."
  capabilities:
    - { id: boards.list, method: POST, path: "/", body_params: [query, variables], action: list, risk: medium, graphql: { operation: query, root_fields: [boards] }, description: "List boards with their columns and groups using the boards root field" }
    - { id: items.list, method: POST, path: "/", body_params: [query, variables], action: list, risk: medium, graphql: { operation: query, root_fields: [boards, next_items_page] }, description: "List a board's items with items_page nested in boards, then next_items_page with the cursor" }
    - { id: items.search, method: POST, path: "/", body_params: [query, variables], action: search, risk: medium, graphql: { operation: query, root_fields: [items_page_by_column_values] }, description: "Find items on a board by column values using items_page_by_column_values" }
    - { id: items.read, method: POST, path: "/", body_params: [query, variables], action: read, risk: medium, graphql: { operation: query, root_fields: [items] }, description: "Read items by id using the items root field" }
    - { id: updates.list, method: POST, path: "/", body_params: [query, variables], action: list, risk: medium, graphql: { operation: query, root_fields: [updates] }, description: "Read updates, which are item comments, using the updates root field" }
    - { id: users.list, method: POST, path: "/", body_params: [query, variables], action: list, risk: medium, graphql: { operation: query, root_fields: [users, me] }, description: "List users with the users root field, or read the connected user with me" }
    - { id: workspaces.list, method: POST, path: "/", body_params: [query, variables], action: list, risk: medium, graphql: { operation: query, root_fields: [workspaces] }, description: "List workspaces using the workspaces root field" }
    - { id: items.create, method: POST, path: "/", body_params: [query, variables], action: create, risk: high, graphql: { operation: mutation, root_fields: [create_item] }, description: "Create an item on a board with create_item" }
    - { id: subitems.create, method: POST, path: "/", body_params: [query, variables], action: create, risk: high, graphql: { operation: mutation, root_fields: [create_subitem] }, description: "Create a subitem under an item with create_subitem" }
    - { id: items.update_columns, method: POST, path: "/", body_params: [query, variables], action: update, risk: high, graphql: { operation: mutation, root_fields: [change_column_value, change_simple_column_value, change_multiple_column_values] }, description: "Change one or several column values on an item" }
    - { id: items.move, method: POST, path: "/", body_params: [query, variables], action: update, risk: high, graphql: { operation: mutation, root_fields: [move_item_to_group] }, description: "Move an item to another group with move_item_to_group" }
    - { id: updates.create, method: POST, path: "/", body_params: [query, variables], action: send, risk: high, requires_approval: true, graphql: { operation: mutation, root_fields: [create_update] }, description: "Post an update on an item, or reply to one, with create_update" }
    - { id: boards.create, method: POST, path: "/", body_params: [query, variables], action: create, risk: high, graphql: { operation: mutation, root_fields: [create_board] }, description: "Create a board with create_board" }
    - { id: notifications.create, method: POST, path: "/", body_params: [query, variables], action: send, risk: high, requires_approval: true, graphql: { operation: mutation, root_fields: [create_notification] }, description: "Send a person a notification with create_notification" }
    - { id: items.archive, method: POST, path: "/", body_params: [query, variables], action: update, risk: high, graphql: { operation: mutation, root_fields: [archive_item] }, description: "Archive an item with archive_item" }
    - { id: items.delete, method: POST, path: "/", body_params: [query, variables], action: delete, risk: critical, requires_approval: true, graphql: { operation: mutation, root_fields: [delete_item] }, description: "Delete an item with delete_item" }

- id: reddit
  name: Reddit
  vertical: comms
  description: "Read subreddits, posts, comments, users and your inbox as your own Reddit account, with posting, commenting and messaging held behind an approval."
  base_url: "https://oauth.reddit.com"
  logo: reddit
  brand_color: "#FF4500"
  auth: { scheme: bearer }
  # Reddit rate-limits generic User-Agents to a crawl and asks every client to name itself.
  static_headers: { User-Agent: "permaura-gateway:reddit-connector:1.0 (+https://permaura.com)" }
  # Every Reddit write endpoint reads a form body, never JSON.
  body_style: form
  oauth:
    authorize_url: "https://www.reddit.com/api/v1/authorize"
    token_url: "https://www.reddit.com/api/v1/access_token"
    scopes: [identity, read, mysubreddits, history, submit, edit, privatemessages]
    pkce: false
    token_auth: basic
    authorize_params: { duration: permanent }
  capabilities:
    - { id: me.read, method: GET, path: "/api/v1/me", description: Read the account this connection acts as }
    - { id: subreddits.about, method: GET, path: "/r/{subreddit}/about", path_params: [subreddit], query_params: [raw_json], description: Read a subreddit's description, rules summary and subscriber count }
    - { id: subreddits.rules, method: GET, path: "/r/{subreddit}/about/rules", path_params: [subreddit], query_params: [raw_json], description: Read a subreddit's rules }
    - { id: subreddits.mine, method: GET, path: "/subreddits/mine/subscriber", query_params: [limit, after, before, raw_json], description: List the subreddits the account subscribes to }
    - { id: subreddits.search, method: GET, path: "/subreddits/search", query_params: [q, limit, after, sort, raw_json], description: Search subreddits by name and description }
    - { id: posts.hot, method: GET, path: "/r/{subreddit}/hot", path_params: [subreddit], query_params: [limit, after, before, raw_json], description: List a subreddit's hot posts }
