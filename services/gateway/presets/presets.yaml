    - { id: models.list, method: GET, path: "/v1/models", description: "List the models available to the Agent API" }
    - { id: embeddings.generate, method: POST, path: "/v1/embeddings", body_params: [input, model, dimensions, encoding_format], action: read, risk: medium, description: "Generate embeddings for up to 512 texts. Uses API credits, billed per token." }
    - { id: decisions.answer, method: POST, path: "/v1/decisions", body_params: [model, state, questions], action: read, risk: medium, description: "Answer yes or no, choice or score questions about supplied content, with probabilities. Uses API credits." }

