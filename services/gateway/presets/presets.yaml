    authorize_url: "https://airtable.com/oauth2/v1/authorize"
    token_url: "https://airtable.com/oauth2/v1/token"
    scopes: ["data.records:read", "data.records:write", "data.recordComments:read", "data.recordComments:write", "schema.bases:read"]
    pkce: true
    token_auth: basic
  capabilities:
    - { id: user.whoami, method: GET, path: "/meta/whoami", description: "Read the user id behind the token" }
    - { id: bases.list, method: GET, path: "/meta/bases", query_params: [offset], description: "List the bases the token can reach" }
    - { id: bases.schema, method: GET, path: "/meta/bases/{baseId}/tables", path_params: [baseId], query_params: [include], description: "Read a base's tables, fields and views" }
    - { id: records.list, method: GET, path: "/{baseId}/{tableIdOrName}", path_params: [baseId, tableIdOrName], query_params: [pageSize, maxRecords, offset, view, filterByFormula, cellFormat, timeZone, userLocale, returnFieldsByFieldId], description: "List records in a table, with a view or formula filter; use records.query to sort or pick fields" }
    - { id: records.query, method: POST, path: "/{baseId}/{tableIdOrName}/listRecords", path_params: [baseId, tableIdOrName], body_params: [sort, fields, filterByFormula, view, pageSize, maxRecords, offset, cellFormat, timeZone, userLocale, returnFieldsByFieldId, recordMetadata], action: list, risk: medium, description: "List records with sorting, chosen fields and long formula filters in the request body" }
    - { id: records.read, method: GET, path: "/{baseId}/{tableIdOrName}/{recordId}", path_params: [baseId, tableIdOrName, recordId], query_params: [cellFormat, timeZone, userLocale, returnFieldsByFieldId], description: "Read one record" }
    - { id: comments.list, method: GET, path: "/{baseId}/{tableIdOrName}/{recordId}/comments", path_params: [baseId, tableIdOrName, recordId], query_params: [pageSize, offset], description: "List comments on a record" }
    - { id: records.create, method: POST, path: "/{baseId}/{tableIdOrName}", path_params: [baseId, tableIdOrName], body_params: [fields, records, typecast, returnFieldsByFieldId], description: "Create one record with fields, or several with records" }
    - { id: records.update, method: PATCH, path: "/{baseId}/{tableIdOrName}/{recordId}", path_params: [baseId, tableIdOrName, recordId], body_params: [fields, typecast, returnFieldsByFieldId], description: "Update the listed fields on one record" }
    - { id: records.update_many, method: PATCH, path: "/{baseId}/{tableIdOrName}", path_params: [baseId, tableIdOrName], body_params: [records, performUpsert, typecast, returnFieldsByFieldId], description: "Update several records, or upsert them with performUpsert" }
    - { id: comments.create, method: POST, path: "/{baseId}/{tableIdOrName}/{recordId}/comments", path_params: [baseId, tableIdOrName, recordId], body_params: [text, parentCommentId], action: send, risk: high, requires_approval: true, description: "Add a comment or threaded reply to a record" }
    - { id: records.delete, method: DELETE, path: "/{baseId}/{tableIdOrName}/{recordId}", path_params: [baseId, tableIdOrName, recordId], description: "Delete one record" }

