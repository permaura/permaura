    - { id: users.me, method: GET, path: "/users/me", query_params: [include], description: "Read the user behind the token" }
    - { id: sheets.list, method: GET, path: "/sheets", query_params: [include, modifiedSince, page, pageSize], description: "List the sheets the token can reach" }
    - { id: sheets.read, method: GET, path: "/sheets/{sheetId}", path_params: [sheetId], query_params: [include, exclude, columnIds, filterId, level, page, pageSize, rowIds, rowNumbers, rowsModifiedSince], description: "Read a sheet's columns and rows; limit the result with rowIds, columnIds or pageSize" }
    - { id: rows.read, method: GET, path: "/sheets/{sheetId}/rows/{rowId}", path_params: [sheetId, rowId], query_params: [include, exclude, level], description: "Read one row" }
    - { id: search.all, method: GET, path: "/search", query_params: [query, modifiedSince, include, scopes], description: "Search everything the token can reach" }
    - { id: search.sheet, method: GET, path: "/search/sheets/{sheetId}", path_params: [sheetId], query_params: [query], description: "Search within one sheet" }
    - { id: workspaces.list, method: GET, path: "/workspaces", query_params: [maxItems, lastKey], description: "List workspaces, paging with lastKey" }
    - { id: workspaces.children, method: GET, path: "/workspaces/{workspaceId}/children", path_params: [workspaceId], query_params: [childrenResourceTypes, include, maxItems, lastKey], description: "List the sheets, reports, dashboards and folders in a workspace" }
    - { id: folders.children, method: GET, path: "/folders/{folderId}/children", path_params: [folderId], query_params: [childrenResourceTypes, include, maxItems, lastKey], description: "List the sheets, reports, dashboards and folders in a folder" }
    - { id: discussions.list, method: GET, path: "/sheets/{sheetId}/discussions", path_params: [sheetId], query_params: [include, page, pageSize], description: "List a sheet's discussions; include comments to get their text" }
    - { id: rows.add, method: POST, path: "/sheets/{sheetId}/rows", path_params: [sheetId], body_params: [cells, toTop, toBottom, parentId, siblingId, above, format, locked], description: "Add one row to a sheet, with its cells and position" }
    - { id: rows.update, method: PUT, path: "/sheets/{sheetId}/rows", path_params: [sheetId], body_params: [id, cells, toTop, toBottom, parentId, siblingId, above, indent, outdent, format, locked], description: "Update one row's cells or position, naming the row with id" }
    - { id: discussions.create_on_row, method: POST, path: "/sheets/{sheetId}/rows/{rowId}/discussions", path_params: [sheetId, rowId], body_params: [comment], action: send, risk: high, requires_approval: true, description: "Start a discussion on a row, with its first comment" }
    - { id: comments.create, method: POST, path: "/sheets/{sheetId}/discussions/{discussionId}/comments", path_params: [sheetId, discussionId], body_params: [text], action: send, risk: high, requires_approval: true, description: "Add a comment to an existing discussion" }
    - { id: rows.send, method: POST, path: "/sheets/{sheetId}/rows/emails", path_params: [sheetId], body_params: [sendTo, subject, message, ccMe, rowIds, columnIds, includeAttachments, includeDiscussions, layout], action: send, risk: high, requires_approval: true, description: "Email rows from a sheet to people or groups" }
