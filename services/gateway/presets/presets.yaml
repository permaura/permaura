- id: zendesk
  name: "Zendesk"
  vertical: support
  description: "Read and search tickets, comments, users and views, and reply to, create, update or merge tickets with an approval."
  base_url: "https://{subdomain}.zendesk.com/api/v2"
  logo: zendesk
  brand_color: "#03363D"
  auth: { scheme: bearer }
  redact_fields: [phone, shared_phone_number, ip_address, latitude, longitude, location]
  credential:
    label: "OAuth client, as identifier:secret"
    url: "https://support.zendesk.com/hc/en-us/articles/4408845965210-Using-OAuth-authentication-with-your-application"
    hint: "In Admin Center open Apps and integrations, APIs, OAuth clients and add a Confidential client. Paste identifier:secret. Calls act as the user who created the client."
  oauth:
    token_url: "/oauth/tokens"
    scopes: ["read", "tickets:write", "users:write"]
    grant: client_credentials
  capabilities:
    - { id: tickets.list, method: GET, path: "/tickets", query_params: [external_id, sort_by, sort_order, sort, include, page, per_page, "page[size]", "page[after]", "page[before]"], description: "List tickets" }
    - { id: tickets.read, method: GET, path: "/tickets/{ticket_id}", path_params: [ticket_id], query_params: [include], description: "Read a ticket" }
    - { id: tickets.comments.list, method: GET, path: "/tickets/{ticket_id}/comments", path_params: [ticket_id], query_params: [include, include_inline_images, sort_order, sort, per_page, page, "page[size]", "page[after]", "page[before]"], description: "List the comments on a ticket" }
    - { id: search.query, method: GET, path: "/search", query_params: [query, sort_by, sort_order, include, brand_id, page, per_page], description: "Search tickets, users and organizations with the Zendesk query syntax" }
    - { id: users.search, method: GET, path: "/users/search", query_params: [query, external_id, brand_id, include, page, per_page], description: "Search users by name, email or query" }
    - { id: users.read, method: GET, path: "/users/{user_id}", path_params: [user_id], query_params: [include], description: "Read a user" }
    - { id: organizations.read, method: GET, path: "/organizations/{organization_id}", path_params: [organization_id], query_params: [include], description: "Read an organization" }
    - { id: groups.list, method: GET, path: "/groups", query_params: [exclude_deleted, include, sort, page, per_page, "page[size]", "page[after]", "page[before]"], description: "List support groups" }
    - { id: views.list, method: GET, path: "/views", query_params: [access, active, group_id, sort, sort_by, sort_order, page, per_page, "page[size]", "page[after]", "page[before]"], description: "List ticket views" }
    - { id: views.tickets, method: GET, path: "/views/{view_id}/tickets", path_params: [view_id], query_params: [sort_by, sort_order, page, per_page, "page[size]", "page[after]", "page[before]"], description: "List the tickets in a view" }
    - { id: tickets.create, method: POST, path: "/tickets", body_params: [ticket], action: send, requires_approval: true, description: "Create a ticket; default triggers email the requester, and the ticket object carries the opening comment" }
    - { id: tickets.reply, method: PUT, path: "/tickets/{ticket_id}", path_params: [ticket_id], body_params: [ticket], action: send, requires_approval: true, description: "Reply to the requester or add a private note, using ticket.comment with body and public" }
    - { id: tickets.update, method: PUT, path: "/tickets/{ticket_id}", path_params: [ticket_id], body_params: [ticket], action: send, requires_approval: true, description: "Change status, assignee, tags or fields on a ticket; triggers can email the requester about the change" }
    - { id: tickets.merge, method: POST, path: "/tickets/{ticket_id}/merge", path_params: [ticket_id], body_params: [ids, target_comment, source_comment, target_comment_is_public, source_comment_is_public], action: send, requires_approval: true, description: "Merge tickets into this one; a public merge comment reaches the requester" }
    - { id: users.update, method: PUT, path: "/users/{user_id}", path_params: [user_id], body_params: [user], requires_approval: true, description: "Update a user; the user object can change their role and so their access" }
    - { id: tickets.delete, method: DELETE, path: "/tickets/{ticket_id}", path_params: [ticket_id], description: "Delete a ticket" }

- id: trello
