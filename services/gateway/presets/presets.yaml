    - { id: users.read, method: GET, path: "/users/{userId}", path_params: [userId], query_params: [login_type, search_by_unique_id], description: "Read a user; pass me for the connected user" }
    - { id: meetings.list, method: GET, path: "/users/{userId}/meetings", path_params: [userId], query_params: [type, page_size, next_page_token, page_number, from, to, timezone], description: "List a user's scheduled meetings; pass me for the connected user" }
    - { id: meetings.read, method: GET, path: "/meetings/{meetingId}", path_params: [meetingId], query_params: [occurrence_id, show_previous_occurrences], description: "Read a meeting" }
    - { id: meetings.invitation, method: GET, path: "/meetings/{meetingId}/invitation", path_params: [meetingId], description: "Read a meeting's invitation text, including its join details" }
    - { id: registrants.list, method: GET, path: "/meetings/{meetingId}/registrants", path_params: [meetingId], query_params: [occurrence_id, status, page_size, page_number, next_page_token], description: "List a meeting's registrants" }
    - { id: past_meetings.read, method: GET, path: "/past_meetings/{meetingId}", path_params: [meetingId], segment_params: [meetingId], description: "Read the details of a past meeting" }
    - { id: past_meetings.participants, method: GET, path: "/past_meetings/{meetingId}/participants", path_params: [meetingId], segment_params: [meetingId], query_params: [page_size, next_page_token], description: "List who attended a past meeting" }
    - { id: recordings.list, method: GET, path: "/users/{userId}/recordings", path_params: [userId], query_params: [page_size, next_page_token, from, to, meeting_id, trash, trash_type], description: "List a user's cloud recordings; pass me for the connected user" }
    - { id: recordings.read, method: GET, path: "/meetings/{meetingId}/recordings", path_params: [meetingId], segment_params: [meetingId], description: "Read a meeting's cloud recordings and their files" }
    - { id: transcripts.read, method: GET, path: "/meetings/{meetingId}/transcript", path_params: [meetingId], segment_params: [meetingId], description: "Read a meeting's transcript details and download link" }
    - { id: summaries.read, method: GET, path: "/meetings/{meetingId}/meeting_summary", path_params: [meetingId], segment_params: [meetingId], description: "Read a meeting's AI Companion summary; meetingId must be the meeting UUID" }
    - { id: meetings.create, method: POST, path: "/users/{userId}/meetings", path_params: [userId], body_params: [topic, type, agenda, start_time, duration, timezone, password, default_password, pre_schedule, recurrence, schedule_for, settings, template_id, tracking_fields], action: send, requires_approval: true, description: "Schedule a meeting; by default this emails any alternative hosts, and settings can list invitees" }
    - { id: meetings.update, method: PATCH, path: "/meetings/{meetingId}", path_params: [meetingId], query_params: [occurrence_id], body_params: [topic, type, agenda, start_time, duration, timezone, password, pre_schedule, recurrence, schedule_for, settings, template_id, tracking_fields], action: send, requires_approval: true, description: "Change a meeting; alternative hosts and invitees in settings can be emailed about it" }
    - { id: registrants.add, method: POST, path: "/meetings/{meetingId}/registrants", path_params: [meetingId], query_params: [occurrence_ids], body_params: [email, first_name, last_name, org, job_title, language, auto_approve, custom_questions, comments], action: send, requires_approval: true, description: "Register someone for a meeting, which can email them a confirmation" }
    - { id: meetings.delete, method: DELETE, path: "/meetings/{meetingId}", path_params: [meetingId], query_params: [occurrence_id], description: "Delete a meeting or one occurrence" }
    - { id: recordings.delete, method: DELETE, path: "/meetings/{meetingId}/recordings", path_params: [meetingId], segment_params: [meetingId], query_params: [action], description: "Delete a meeting's recordings; action is trash by default or delete to remove them for good" }

