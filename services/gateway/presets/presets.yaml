    - { id: records.query, method: POST, path: "/coql", body_params: [select_query], action: search, risk: medium, description: "Read records with a COQL select query" }
    - { id: related.list, method: GET, path: "/{module}/{record_id}/{related_list}", path_params: [module, record_id, related_list], query_params: [fields, page, per_page, page_token, ids], description: "List a record's related records, such as a contact's deals; fields is required" }
    - { id: notes.list, method: GET, path: "/{module}/{record_id}/Notes", path_params: [module, record_id], query_params: [fields, page, per_page], description: "List the notes on a record; fields is required" }
    - { id: records.create, method: POST, path: "/{module}", path_params: [module], body_params: [data, trigger, lar_id, apply_feature_execution], description: "Create records in a module; the records go in a data array, up to 100" }
    - { id: records.update, method: PUT, path: "/{module}/{record_id}", path_params: [module, record_id], body_params: [data, trigger, apply_feature_execution], description: "Update one record; the changed fields go in a data array" }
    - { id: notes.create, method: POST, path: "/{module}/{record_id}/Notes", path_params: [module, record_id], body_params: [data], description: "Add a note to a record; Note_Content and Parent_Id go in a data array" }
    - { id: email.send, method: POST, path: "/{module}/{record_id}/actions/send_mail", path_params: [module, record_id], body_params: [data], action: send, risk: high, requires_approval: true, description: "Send an email to a record's address from the CRM; from, to, subject and content go in a data array" }
    - { id: records.delete, method: DELETE, path: "/{module}/{record_id}", path_params: [module, record_id], query_params: [wf_trigger], description: "Delete one record" }

