    - { id: pages.versions, method: GET, path: "/api/v2/pages/{id}/versions", path_params: [id], query_params: [body-format, cursor, limit, sort], description: "List the versions of a page" }
    - { id: pages.labels, method: GET, path: "/api/v2/pages/{id}/labels", path_params: [id], query_params: [prefix, sort, cursor, limit], description: "List the labels on a page" }
    - { id: pages.comments, method: GET, path: "/api/v2/pages/{id}/footer-comments", path_params: [id], query_params: [body-format, status, sort, cursor, limit], description: "List the footer comments on a page" }
    - { id: blogposts.list, method: GET, path: "/api/v2/blogposts", query_params: [id, space-id, sort, status, title, body-format, cursor, limit], description: "List blog posts" }
    - { id: blogposts.read, method: GET, path: "/api/v2/blogposts/{id}", path_params: [id], query_params: [body-format, get-draft, status, version, include-labels, include-properties], description: "Read a blog post" }
    - { id: pages.create, method: POST, path: "/api/v2/pages", query_params: [private, root-level], body_params: [spaceId, status, title, parentId, body, subtype], description: "Create a page in a space" }
    - { id: pages.update, method: PUT, path: "/api/v2/pages/{page_id}", path_params: [page_id], body_params: [id, status, title, spaceId, parentId, ownerId, body, version], description: "Edit a page; repeat page_id as id and send the next version number" }
    - { id: pages.add_label, method: POST, path: "/rest/api/content/{id}/label", path_params: [id], body_params: [prefix, name], description: "Add a label to a page or blog post" }
    - { id: comments.create, method: POST, path: "/api/v2/footer-comments", body_params: [pageId, blogPostId, parentCommentId, body], action: send, risk: high, requires_approval: true, description: "Add a footer comment to a page or blog post" }
    - { id: blogposts.create, method: POST, path: "/api/v2/blogposts", query_params: [private], body_params: [spaceId, status, title, body], description: "Create a blog post in a space" }
    - { id: pages.delete, method: DELETE, path: "/api/v2/pages/{id}", path_params: [id], query_params: [draft], description: "Move a page to the trash, or delete a draft if draft is true" }

- id: gitlab
