    - { id: images.render, method: GET, path: "/v1/images/{file_key}", path_params: [file_key], query_params: [ids, version, scale, format, svg_outline_text, svg_include_id, svg_include_node_id, svg_simplify_stroke, contents_only, use_absolute_bounds], description: "Render file nodes to images and return links to them" }
    - { id: images.list_fills, method: GET, path: "/v1/files/{file_key}/images", path_params: [file_key], description: "Get links to the images used as fills in a file" }
    - { id: versions.list, method: GET, path: "/v1/files/{file_key}/versions", path_params: [file_key], query_params: [page_size, before, after], description: "List a file's version history" }
    - { id: comments.list, method: GET, path: "/v1/files/{file_key}/comments", path_params: [file_key], query_params: [as_md], description: "List the comments in a file" }
    - { id: comments.create, method: POST, path: "/v1/files/{file_key}/comments", path_params: [file_key], body_params: [message, comment_id, client_meta], action: send, risk: high, requires_approval: true, description: "Post a comment or reply in a file, visible to its collaborators" }
    - { id: comments.delete, method: DELETE, path: "/v1/files/{file_key}/comments/{comment_id}", path_params: [file_key, comment_id], description: "Delete a comment" }
