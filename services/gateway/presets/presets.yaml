    - { id: users.read, method: GET, path: "/users/{user_id}", path_params: [user_id], description: "Read a user by id, or pass me for the user behind the token" }
    - { id: pages.create, method: POST, path: "/pages", body_params: [parent, properties, icon, cover, children, markdown, markdown_version, template, position], description: "Create a page under a page or a data source, from blocks or Markdown" }
