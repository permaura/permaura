- id: discord
  name: Discord
  vertical: comms
  description: "Read guilds, channels, members and message history, and post to a channel."
  base_url: "https://discord.com/api/v10"
  logo: discord
  brand_color: "#5865F2"
  auth: { scheme: raw, header: Authorization, prefix: "Bot " }
  static_headers: { User-Agent: "DiscordBot (https://permaura.com, 1.0)" }
  redact_fields: [email, phone]
  capabilities:
    - { id: guilds.read, method: GET, path: "/guilds/{guild_id}", path_params: [guild_id], query_params: [with_counts], description: Read a guild's metadata }
    - { id: channels.list, method: GET, path: "/guilds/{guild_id}/channels", path_params: [guild_id], description: List a guild's channels }
    - { id: channels.read, method: GET, path: "/channels/{channel_id}", path_params: [channel_id], description: Read a channel }
    - { id: members.list, method: GET, path: "/guilds/{guild_id}/members", path_params: [guild_id], query_params: [limit, after], description: List guild members (needs the Server Members intent) }
    - { id: messages.list, method: GET, path: "/channels/{channel_id}/messages", path_params: [channel_id], query_params: [limit, before, after, around], description: Read a channel's message history }
    - { id: messages.read, method: GET, path: "/channels/{channel_id}/messages/{message_id}", path_params: [channel_id, message_id], description: Read a single message }
    - { id: messages.create, method: POST, path: "/channels/{channel_id}/messages", path_params: [channel_id], body_params: [content, embeds, tts, message_reference, allowed_mentions], requires_approval: true, description: Post a message to a channel (visible to everyone in it) }
    - { id: messages.delete, method: DELETE, path: "/channels/{channel_id}/messages/{message_id}", path_params: [channel_id, message_id], description: Delete a message }

- id: telegram
  name: "Telegram"
  vertical: comms
  description: "Read a bot's incoming updates, chats and members, and send, edit, pin or delete messages and ban members with an approval."
  base_url: "https://api.telegram.org"
  logo: telegram
  brand_color: "#26A5E4"
  auth: { scheme: path_token, prefix: "/bot" }
  redact_fields: [phone_number, birthdate, invite_link, business_location, shipping_address, order_info, passport_data]
  credential:
    label: "Bot token"
    url: "https://t.me/BotFather"
    hint: "In Telegram message @BotFather, send /newbot, and paste the token it returns, which looks like 123456:ABC-DEF. Add the bot to each chat it should use."
  capabilities:
    - { id: bot.read, method: GET, path: "/getMe", description: "Read the bot's own identity and settings" }
    - { id: updates.list, method: GET, path: "/getUpdates", query_params: [limit, timeout], description: "Read up to 100 of the oldest pending updates without confirming them; it fails while a webhook is set" }
    - { id: chats.read, method: GET, path: "/getChat", query_params: [chat_id], description: "Read a chat's details by id or @username" }
    - { id: chats.admins, method: GET, path: "/getChatAdministrators", query_params: [chat_id, return_bots], description: "List a chat's administrators" }
    - { id: chats.member, method: GET, path: "/getChatMember", query_params: [chat_id, user_id], description: "Read one member's status in a chat" }
    - { id: chats.member_count, method: GET, path: "/getChatMemberCount", query_params: [chat_id], description: "Read the number of members in a chat" }
    - { id: updates.confirm, method: GET, path: "/getUpdates", query_params: [offset, limit, timeout], action: update, risk: high, description: "Confirm updates up to an offset so later ones can be read. Confirmed updates are gone for good" }
    - { id: messages.send, method: POST, path: "/sendMessage", body_params: [chat_id, message_thread_id, text, parse_mode, entities, link_preview_options, disable_notification, protect_content, reply_parameters, reply_markup], action: send, risk: high, requires_approval: true, description: "Send a text message to a chat" }
    - { id: messages.send_photo, method: POST, path: "/sendPhoto", body_params: [chat_id, message_thread_id, photo, caption, parse_mode, caption_entities, show_caption_above_media, has_spoiler, disable_notification, protect_content, reply_parameters, reply_markup], action: send, risk: high, requires_approval: true, description: "Send a photo to a chat from a public URL or an existing file_id" }
    - { id: messages.send_document, method: POST, path: "/sendDocument", body_params: [chat_id, message_thread_id, document, caption, parse_mode, caption_entities, disable_content_type_detection, disable_notification, protect_content, reply_parameters, reply_markup], action: send, risk: high, requires_approval: true, description: "Send a file to a chat from a public URL or an existing file_id" }
    - { id: messages.forward, method: POST, path: "/forwardMessage", body_params: [chat_id, message_thread_id, from_chat_id, message_id, disable_notification, protect_content], action: send, risk: high, requires_approval: true, description: "Forward a message from one chat to another" }
    - { id: messages.copy, method: POST, path: "/copyMessage", body_params: [chat_id, message_thread_id, from_chat_id, message_id, caption, parse_mode, caption_entities, disable_notification, protect_content, reply_parameters, reply_markup], action: send, risk: high, requires_approval: true, description: "Copy a message to another chat without the forwarded-from link" }
    - { id: messages.edit, method: POST, path: "/editMessageText", body_params: [chat_id, message_id, inline_message_id, text, parse_mode, entities, link_preview_options, reply_markup], action: update, risk: high, requires_approval: true, description: "Edit the text of a message the bot sent" }
    - { id: messages.pin, method: POST, path: "/pinChatMessage", body_params: [chat_id, message_id, disable_notification], action: update, risk: high, requires_approval: true, description: "Pin a message in a chat, which notifies members unless silenced" }
    - { id: messages.delete, method: POST, path: "/deleteMessage", body_params: [chat_id, message_id], action: delete, risk: critical, requires_approval: true, description: "Delete a message from a chat" }
    - { id: members.ban, method: POST, path: "/banChatMember", body_params: [chat_id, user_id, until_date, revoke_messages], action: update, risk: critical, requires_approval: true, description: "Ban a user from a group or channel, optionally deleting their messages" }
    - { id: members.unban, method: POST, path: "/unbanChatMember", body_params: [chat_id, user_id, only_if_banned], action: update, risk: high, requires_approval: true, description: "Lift a ban; set only_if_banned, or a current member is removed from the chat" }

- id: whatsapp
  name: "WhatsApp Business"
  vertical: comms
  description: "Read business account, phone number, profile and template details, and send messages or change templates and the profile with an approval."
  base_url: "https://graph.facebook.com/v26.0"
  logo: whatsapp
  brand_color: "#25D366"
  auth: { scheme: bearer }
  redact_fields: [access_token, certificate, new_certificate]
  credential:
    label: "System user access token"
    url: "https://business.facebook.com/settings"
    hint: "In Business settings open System users, add one, assign your app, WhatsApp account and Messaging account, then Generate token with business_management and both whatsapp_business_ permissions."
  capabilities:
    - { id: account.read, method: GET, path: "/{waba_id}", path_params: [waba_id], query_params: [fields], description: "Read a WhatsApp Business Account; fields can request analytics or pricing_analytics for a date range" }
    - { id: phone_numbers.list, method: GET, path: "/{waba_id}/phone_numbers", path_params: [waba_id], query_params: [fields, filtering, sort, limit, after, before], description: "List the account's business phone numbers, with quality rating and verified name" }
    - { id: phone_numbers.read, method: GET, path: "/{phone_number_id}", path_params: [phone_number_id], query_params: [fields], description: "Read one business phone number" }
    - { id: profile.read, method: GET, path: "/{phone_number_id}/whatsapp_business_profile", path_params: [phone_number_id], query_params: [fields], description: "Read the public business profile for a phone number" }
    - { id: templates.list, method: GET, path: "/{waba_id}/message_templates", path_params: [waba_id], query_params: [name, name_or_content, content, category, language, quality_score, status, since, until, fields, limit, after, before], description: "List or filter message templates with their review status" }
    - { id: messages.send, method: POST, path: "/{phone_number_id}/messages", path_params: [phone_number_id], body_params: [messaging_product, recipient_type, to, type, text, template, image, audio, video, document, sticker, location, contacts, interactive, reaction, context, biz_opaque_callback_data], action: send, risk: high, requires_approval: true, description: "Send a message; set messaging_product to whatsapp. Outside the 24 hour window only a template sends, and delivery may bill" }
    - { id: messages.mark_read, method: POST, path: "/{phone_number_id}/messages", path_params: [phone_number_id], body_params: [messaging_product, status, message_id, typing_indicator], action: update, risk: high, requires_approval: true, description: "Mark a received message as read, which the sender sees; set messaging_product to whatsapp and status to read" }
    - { id: templates.create, method: POST, path: "/{waba_id}/message_templates", path_params: [waba_id], body_params: [name, language, category, components, allow_category_change, sub_category, parameter_format, message_send_ttl_seconds, library_template_name], description: "Submit a new message template for Meta's review" }
    - { id: profile.update, method: POST, path: "/{phone_number_id}/whatsapp_business_profile", path_params: [phone_number_id], body_params: [messaging_product, about, address, description, email, profile_picture_handle, websites, vertical], action: update, risk: high, requires_approval: true, description: "Change the public business profile; set messaging_product to whatsapp" }
    - { id: templates.delete, method: DELETE, path: "/{waba_id}/message_templates", path_params: [waba_id], query_params: [name, hsm_id], description: "Delete a template; name alone removes it in all languages, name with hsm_id removes one" }

- id: docusign
  name: Docusign eSignature
  vertical: comms
  logo: docusign
  description: "Read envelope status, recipients, documents and templates, and send envelopes for signature."
  base_url: "https://demo.docusign.net/restapi"
  brand_color: "#4C00FF"
