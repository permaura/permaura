    - { id: boards.cards, method: GET, path: "/boards/{id}/cards", path_params: [id], description: "List the open cards on a board" }
    - { id: boards.members, method: GET, path: "/boards/{id}/members", path_params: [id], description: "List the members of a board" }
    - { id: lists.cards, method: GET, path: "/lists/{id}/cards", path_params: [id], description: "List the cards in a list" }
    - { id: cards.read, method: GET, path: "/cards/{id}", path_params: [id], query_params: [fields, actions, attachments, attachment_fields, members, member_fields, checkItemStates, checklists, checklist_fields, board, board_fields, list, customFieldItems], description: "Read a card" }
    - { id: cards.actions, method: GET, path: "/cards/{id}/actions", path_params: [id], query_params: [filter, page], description: "List the activity on a card; set filter to commentCard for comments" }
    - { id: cards.create, method: POST, path: "/cards", query_params: [idList, name, desc, pos, due, start, dueComplete, idMembers, idLabels, urlSource, idCardSource, keepFromSource], description: "Create a card in a list" }
    - { id: cards.update, method: PUT, path: "/cards/{id}", path_params: [id], query_params: [name, desc, closed, idMembers, idList, idLabels, idBoard, pos, due, start, dueComplete, subscribed], description: "Edit a card, move it to another list, or archive it with closed" }
    - { id: cards.comment, method: POST, path: "/cards/{id}/actions/comments", path_params: [id], query_params: [text], action: send, risk: high, requires_approval: true, description: "Add a comment to a card" }
    - { id: cards.add_member, method: POST, path: "/cards/{id}/idMembers", path_params: [id], query_params: [value], description: "Add a member to a card; value is the member id" }
    - { id: cards.add_checklist, method: POST, path: "/cards/{id}/checklists", path_params: [id], query_params: [name, idChecklistSource, pos], description: "Create a checklist on a card" }
    - { id: lists.create, method: POST, path: "/boards/{id}/lists", path_params: [id], query_params: [name, pos], description: "Create a list on a board" }
    - { id: cards.delete, method: DELETE, path: "/cards/{id}", path_params: [id], description: "Delete a card for good" }

- id: zoom
  name: "Zoom"
  vertical: comms
  description: "Read meetings, participants, recordings, transcripts and summaries, and create or change meetings with an approval."
