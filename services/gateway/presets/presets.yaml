    - { id: todos.list, method: GET, path: "/todolists/{todolist_id}/todos.json", path_params: [todolist_id], query_params: [status, completed, page], description: "List the to-dos in a to-do list" }
    - { id: todos.read, method: GET, path: "/todos/{todo_id}.json", path_params: [todo_id], description: "Read a to-do" }
