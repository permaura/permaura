    - { id: datasets.list, method: GET, path: "/projects/{projectId}/datasets", path_params: [projectId], query_params: [all, filter, maxResults, pageToken], description: "List datasets in a project" }
    - { id: datasets.read, method: GET, path: "/projects/{projectId}/datasets/{datasetId}", path_params: [projectId, datasetId], query_params: [datasetView], description: "Read a dataset's settings and location" }
    - { id: tables.list, method: GET, path: "/projects/{projectId}/datasets/{datasetId}/tables", path_params: [projectId, datasetId], query_params: [maxResults, pageToken], description: "List tables and views in a dataset" }
    - { id: tables.read, method: GET, path: "/projects/{projectId}/datasets/{datasetId}/tables/{tableId}", path_params: [projectId, datasetId, tableId], query_params: [selectedFields, view], description: "Read a table's schema and size, not its rows" }
    - { id: jobs.list, method: GET, path: "/projects/{projectId}/jobs", path_params: [projectId], query_params: [allUsers, stateFilter, projection, minCreationTime, maxCreationTime, parentJobId, maxResults, pageToken], description: "List jobs in a project" }
    - { id: jobs.read, method: GET, path: "/projects/{projectId}/jobs/{jobId}", path_params: [projectId, jobId], query_params: [location], description: "Read a job's status, statistics and SQL text" }
    - { id: tables.read_rows, method: GET, path: "/projects/{projectId}/datasets/{datasetId}/tables/{tableId}/data", path_params: [projectId, datasetId, tableId], query_params: [maxResults, pageToken, startIndex, selectedFields, formatOptions.useInt64Timestamp], action: read, risk: high, description: "Read rows from a table page by page; can page through the whole table" }
    - { id: jobs.results, method: GET, path: "/projects/{projectId}/queries/{jobId}", path_params: [projectId, jobId], query_params: [location, maxResults, pageToken, startIndex, timeoutMs, formatOptions.useInt64Timestamp], action: read, risk: high, description: "Read the result rows of a finished query job" }
    - { id: queries.run, method: POST, path: "/projects/{projectId}/queries", path_params: [projectId], body_params: [query, useLegacySql, defaultDataset, queryParameters, parameterMode, location, maxResults, timeoutMs, jobTimeoutMs, dryRun, useQueryCache, maximumBytesBilled, labels], action: execute, risk: high, requires_approval: true, description: "Run SQL, which can change data and bills bytes scanned; set useLegacySql to false and cap cost with maximumBytesBilled" }
    - { id: jobs.create, method: POST, path: "/projects/{projectId}/jobs", path_params: [projectId], body_params: [configuration, jobReference], action: execute, risk: high, requires_approval: true, description: "Start a query, load, copy or extract job; it can bill the project and move data to or from Cloud Storage" }
    - { id: jobs.cancel, method: POST, path: "/projects/{projectId}/jobs/{jobId}/cancel", path_params: [projectId, jobId], query_params: [location], action: update, description: "Ask BigQuery to stop a running job" }
    - { id: tables.create, method: POST, path: "/projects/{projectId}/datasets/{datasetId}/tables", path_params: [projectId, datasetId], body_params: [tableReference, schema, description, friendlyName, expirationTime, timePartitioning, clustering, labels, view], description: "Create an empty table or a view in a dataset" }
    - { id: rows.insert, method: POST, path: "/projects/{projectId}/datasets/{datasetId}/tables/{tableId}/insertAll", path_params: [projectId, datasetId, tableId], body_params: [rows, skipInvalidRows, ignoreUnknownValues, templateSuffix], requires_approval: true, description: "Stream rows into a table; streaming inserts are billed by volume" }
    - { id: tables.delete, method: DELETE, path: "/projects/{projectId}/datasets/{datasetId}/tables/{tableId}", path_params: [projectId, datasetId, tableId], description: "Delete a table and all its data" }
    - { id: datasets.delete, method: DELETE, path: "/projects/{projectId}/datasets/{datasetId}", path_params: [projectId, datasetId], query_params: [deleteContents], description: "Delete a dataset; set deleteContents to true to also delete its tables" }

- id: intercom
  name: "Intercom"
  vertical: support
  description: "Read and search conversations, contacts, tickets and articles, and reply to customers or manage conversations with an approval."
  base_url: "https://api.intercom.io"
  logo: intercom
  brand_color: "#6AFDEF"
  auth: { scheme: bearer }
  static_headers: { Intercom-Version: "2.17", Accept: "application/json" }
  redact_fields: [phone, location]
  credential:
    label: "Access token"
    url: "https://app.intercom.com/a/apps/_/developer-hub"
    hint: "In the Developer Hub create an app on your workspace, then copy the access token from Configure, Authentication."
  capabilities:
    - { id: me.read, method: GET, path: "/me", description: "Identify the admin and workspace behind the token" }
    - { id: admins.list, method: GET, path: "/admins", description: "List the admins in the workspace" }
    - { id: conversations.list, method: GET, path: "/conversations", query_params: [per_page, starting_after], description: "List conversations" }
    - { id: conversations.read, method: GET, path: "/conversations/{conversation_id}", path_params: [conversation_id], query_params: [display_as, include_translations], description: "Read a conversation and its parts" }
    - { id: conversations.search, method: POST, path: "/conversations/search", body_params: [query, pagination], action: search, risk: medium, description: "Search conversations by attribute filters" }
    - { id: contacts.read, method: GET, path: "/contacts/{contact_id}", path_params: [contact_id], description: "Read a contact" }
    - { id: contacts.search, method: POST, path: "/contacts/search", body_params: [query, pagination, sort], action: search, risk: medium, description: "Search contacts by attribute filters" }
    - { id: tickets.read, method: GET, path: "/tickets/{ticket_id}", path_params: [ticket_id], description: "Read a ticket" }
    - { id: tickets.search, method: POST, path: "/tickets/search", body_params: [query, pagination], action: search, risk: medium, description: "Search tickets by attribute filters" }
    - { id: articles.search, method: GET, path: "/articles/search", query_params: [phrase, state, help_center_id, highlight, page, per_page], description: "Search help center articles" }
    - { id: conversations.reply, method: POST, path: "/conversations/{conversation_id}/reply", path_params: [conversation_id], body_params: [message_type, type, admin_id, body, attachment_urls, reply_options], action: send, requires_approval: true, description: "Reply to a conversation as an admin, or add a note with message_type note" }
    - { id: conversations.manage, method: POST, path: "/conversations/{conversation_id}/parts", path_params: [conversation_id], body_params: [message_type, type, admin_id, assignee_id, body, snoozed_until, skip_reopen], action: send, requires_approval: true, description: "Close, open, snooze or assign a conversation; a body on close or assign reaches the customer" }
    - { id: tickets.reply, method: POST, path: "/tickets/{ticket_id}/reply", path_params: [ticket_id], body_params: [message_type, type, admin_id, body, attachment_urls, reply_options], action: send, requires_approval: true, description: "Reply to a ticket as an admin, or add a note with message_type note" }
    - { id: messages.send, method: POST, path: "/messages", body_params: [message_type, subject, body, template, from, to, cc, bcc, create_conversation_without_contact_reply], action: send, requires_approval: true, description: "Send an outbound email, in-app or WhatsApp message from an admin to a contact" }
    - { id: contacts.create, method: POST, path: "/contacts", body_params: [role, external_id, email, phone, name, owner_id, custom_attributes], description: "Create a contact" }
    - { id: contacts.update, method: PUT, path: "/contacts/{contact_id}", path_params: [contact_id], body_params: [role, external_id, email, phone, name, owner_id, custom_attributes], description: "Update a contact" }
    - { id: contacts.delete, method: DELETE, path: "/contacts/{contact_id}", path_params: [contact_id], description: "Delete a contact" }

- id: freshdesk
  name: "Freshdesk"
  vertical: support
  description: "Read and search tickets, conversations, contacts and groups, and reply to, create or update tickets with an approval."
  base_url: "https://{subdomain}.freshdesk.com/api/v2"
  logo: freshdesk
  auth: { scheme: basic }
  redact_fields: [phone, mobile, address]
