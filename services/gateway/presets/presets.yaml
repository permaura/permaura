  credential:
    label: "Personal access token"
    url: "https://gitlab.com/-/user_settings/personal_access_tokens"
    hint: "Under Generate token choose Legacy token, then the read_api scope for reads or api to allow writes. Tokens last at most 365 days."
  capabilities:
    - { id: projects.list, method: GET, path: "/projects", query_params: [search, membership, owned, starred, archived, visibility, order_by, sort, simple, min_access_level, last_activity_after, last_activity_before, page, per_page], description: "List and search projects; set membership to true for your own" }
    - { id: issues.list, method: GET, path: "/projects/{id}/issues", path_params: [id], segment_params: [id], query_params: [state, labels, milestone, iids, search, in, author_username, assignee_username, assignee_id, created_after, created_before, updated_after, updated_before, scope, confidential, issue_type, order_by, sort, page, per_page], description: "List the issues in a project; id is numeric or a URL-encoded path" }
    - { id: issues.read, method: GET, path: "/projects/{id}/issues/{issue_iid}", path_params: [id, issue_iid], segment_params: [id], description: "Read an issue by its project-level iid" }
    - { id: issue_notes.list, method: GET, path: "/projects/{id}/issues/{issue_iid}/notes", path_params: [id, issue_iid], segment_params: [id], query_params: [activity_filter, sort, order_by, page, per_page], description: "List the comments on an issue" }
    - { id: merge_requests.list, method: GET, path: "/projects/{id}/merge_requests", path_params: [id], segment_params: [id], query_params: [state, labels, milestone, author_username, assignee_username, reviewer_username, source_branch, target_branch, search, in, draft, scope, created_after, created_before, updated_after, updated_before, order_by, sort, page, per_page], description: "List the merge requests in a project" }
    - { id: merge_requests.read, method: GET, path: "/projects/{id}/merge_requests/{merge_request_iid}", path_params: [id, merge_request_iid], segment_params: [id], query_params: [include_diverged_commits_count, include_rebase_in_progress], description: "Read a merge request by its project-level iid" }
    - { id: merge_requests.diffs, method: GET, path: "/projects/{id}/merge_requests/{merge_request_iid}/diffs", path_params: [id, merge_request_iid], segment_params: [id], query_params: [page, per_page, unidiff], description: "List the file changes in a merge request" }
    - { id: merge_request_notes.list, method: GET, path: "/projects/{id}/merge_requests/{merge_request_iid}/notes", path_params: [id, merge_request_iid], segment_params: [id], query_params: [sort, order_by, page, per_page], description: "List the comments on a merge request" }
    - { id: pipelines.list, method: GET, path: "/projects/{id}/pipelines", path_params: [id], segment_params: [id], query_params: [scope, status, ref, sha, source, username, updated_after, updated_before, created_after, created_before, order_by, sort, page, per_page], description: "List the pipelines in a project" }
    - { id: pipelines.read, method: GET, path: "/projects/{id}/pipelines/{pipeline_id}", path_params: [id, pipeline_id], segment_params: [id], description: "Read a pipeline" }
    - { id: pipelines.jobs, method: GET, path: "/projects/{id}/pipelines/{pipeline_id}/jobs", path_params: [id, pipeline_id], segment_params: [id], query_params: [include_retried, scope, page, per_page], description: "List the jobs in a pipeline" }
    - { id: repository.tree, method: GET, path: "/projects/{id}/repository/tree", path_params: [id], segment_params: [id], query_params: [ref, path, recursive, page, per_page, pagination, page_token], description: "List the files and directories in a repository" }
    - { id: repository.file, method: GET, path: "/projects/{id}/repository/files/{file_path}", path_params: [id, file_path], segment_params: [id, file_path], query_params: [ref], description: "Read a file at a ref; the content comes back base64 encoded" }
    - { id: repository.commits, method: GET, path: "/projects/{id}/repository/commits", path_params: [id], segment_params: [id], query_params: [ref_name, since, until, path, author, all, first_parent, order, page, per_page], description: "List the commits in a repository" }
    - { id: issues.create, method: POST, path: "/projects/{id}/issues", path_params: [id], segment_params: [id], body_params: [title, description, assignee_ids, labels, milestone_id, due_date, confidential, issue_type, weight], description: "Create an issue in a project" }
    - { id: issues.update, method: PUT, path: "/projects/{id}/issues/{issue_iid}", path_params: [id, issue_iid], segment_params: [id], body_params: [title, description, state_event, assignee_ids, labels, add_labels, remove_labels, milestone_id, due_date, confidential, discussion_locked, issue_type, weight], description: "Edit an issue, or close and reopen it with state_event" }
    - { id: issue_notes.create, method: POST, path: "/projects/{id}/issues/{issue_iid}/notes", path_params: [id, issue_iid], segment_params: [id], body_params: [body, internal], action: send, risk: high, requires_approval: true, description: "Add a comment to an issue" }
    - { id: merge_requests.create, method: POST, path: "/projects/{id}/merge_requests", path_params: [id], segment_params: [id], body_params: [title, source_branch, target_branch, target_project_id, description, assignee_ids, reviewer_ids, labels, milestone_id, remove_source_branch, squash, allow_collaboration], description: "Create a merge request from a source branch" }
    - { id: merge_requests.update, method: PUT, path: "/projects/{id}/merge_requests/{merge_request_iid}", path_params: [id, merge_request_iid], segment_params: [id], body_params: [title, target_branch, state_event, description, assignee_ids, reviewer_ids, labels, add_labels, remove_labels, milestone_id, remove_source_branch, squash, discussion_locked], description: "Edit a merge request, or close and reopen it with state_event" }
    - { id: merge_requests.merge, method: PUT, path: "/projects/{id}/merge_requests/{merge_request_iid}/merge", path_params: [id, merge_request_iid], segment_params: [id], body_params: [merge_commit_message, squash_commit_message, should_remove_source_branch, auto_merge, sha, squash], description: "Merge a merge request, or set it to merge automatically" }
    - { id: merge_request_notes.create, method: POST, path: "/projects/{id}/merge_requests/{merge_request_iid}/notes", path_params: [id, merge_request_iid], segment_params: [id], body_params: [body, internal], action: send, risk: high, requires_approval: true, description: "Add a comment to a merge request" }
    - { id: issues.delete, method: DELETE, path: "/projects/{id}/issues/{issue_iid}", path_params: [id, issue_iid], segment_params: [id], description: "Delete an issue" }

- id: bitbucket
  name: "Bitbucket"
  vertical: devtools
  description: "Read repositories, branches, commits, pull requests and pipelines, and create, comment on or merge pull requests with an approval."
  base_url: "https://api.bitbucket.org/2.0"
  logo: bitbucket
  brand_color: "#0052CC"
  auth: { scheme: bearer }
  redact_fields: [author.raw]
  credential:
    label: "Atlassian API token with scopes"
    url: "https://id.atlassian.com/manage-profile/security/api-tokens"
    hint: "Choose Create API token with scopes, then Bitbucket. Pick the read scopes for repository, pull request, pipeline and workspace, plus write scopes if needed. Paste the token alone, with no email."
  capabilities:
    - { id: workspaces.list, method: GET, path: "/user/workspaces", query_params: [sort, administrator, page, pagelen], description: "List the workspaces the account belongs to" }
    - { id: repos.list, method: GET, path: "/repositories/{workspace}", path_params: [workspace], query_params: [role, q, sort, page, pagelen], description: "List the repositories in a workspace" }
    - { id: repos.read, method: GET, path: "/repositories/{workspace}/{repo_slug}", path_params: [workspace, repo_slug], description: "Read a repository" }
    - { id: branches.list, method: GET, path: "/repositories/{workspace}/{repo_slug}/refs/branches", path_params: [workspace, repo_slug], query_params: [q, sort, page, pagelen], description: "List the open branches in a repository" }
    - { id: commits.list, method: GET, path: "/repositories/{workspace}/{repo_slug}/commits", path_params: [workspace, repo_slug], query_params: [include, exclude, page, pagelen], description: "List commits, newest first, filtered with include and exclude refs" }
    - { id: files.read, method: GET, path: "/repositories/{workspace}/{repo_slug}/src/{commit}/{path}", path_params: [workspace, repo_slug, commit, path], segment_params: [path], query_params: [format, q, sort, max_depth, page, pagelen], description: "Read a file or list a directory at a commit or branch; use / as path for the root" }
    - { id: diffs.read, method: GET, path: "/repositories/{workspace}/{repo_slug}/diff/{spec}", path_params: [workspace, repo_slug, spec], query_params: [context, path, ignore_whitespace, binary, renames, topic], description: "Read a raw diff for a commit, or for two commits joined by .." }
    - { id: pullrequests.list, method: GET, path: "/repositories/{workspace}/{repo_slug}/pullrequests", path_params: [workspace, repo_slug], query_params: [state, q, sort, page, pagelen], description: "List pull requests; only open ones unless state says otherwise" }
    - { id: pullrequests.read, method: GET, path: "/repositories/{workspace}/{repo_slug}/pullrequests/{pull_request_id}", path_params: [workspace, repo_slug, pull_request_id], description: "Read a pull request" }
    - { id: pullrequests.comments, method: GET, path: "/repositories/{workspace}/{repo_slug}/pullrequests/{pull_request_id}/comments", path_params: [workspace, repo_slug, pull_request_id], query_params: [q, sort, page, pagelen], description: "List the comments on a pull request" }
    - { id: pipelines.list, method: GET, path: "/repositories/{workspace}/{repo_slug}/pipelines", path_params: [workspace, repo_slug], query_params: [creator.uuid, target.ref_type, target.ref_name, target.branch, target.commit.hash, target.selector.pattern, target.selector.type, created_on, trigger_type, status, sort, page, pagelen], description: "List the pipeline runs in a repository" }
    - { id: pipelines.read, method: GET, path: "/repositories/{workspace}/{repo_slug}/pipelines/{pipeline_uuid}", path_params: [workspace, repo_slug, pipeline_uuid], description: "Read a pipeline run" }
    - { id: branches.create, method: POST, path: "/repositories/{workspace}/{repo_slug}/refs/branches", path_params: [workspace, repo_slug], body_params: [name, target], description: "Create a branch; target is an object holding the commit hash" }
    - { id: pullrequests.create, method: POST, path: "/repositories/{workspace}/{repo_slug}/pullrequests", path_params: [workspace, repo_slug], body_params: [title, summary, source, destination, reviewers, close_source_branch, draft], description: "Create a pull request from a source branch" }
    - { id: pullrequests.update, method: PUT, path: "/repositories/{workspace}/{repo_slug}/pullrequests/{pull_request_id}", path_params: [workspace, repo_slug, pull_request_id], body_params: [title, summary, destination, reviewers, close_source_branch, draft], description: "Edit the title, description, reviewers or target of a pull request" }
    - { id: pullrequests.comment, method: POST, path: "/repositories/{workspace}/{repo_slug}/pullrequests/{pull_request_id}/comments", path_params: [workspace, repo_slug, pull_request_id], body_params: [content, inline, parent, pending], action: send, risk: high, requires_approval: true, description: "Add a comment to a pull request; content holds the raw text" }
    - { id: pullrequests.approve, method: POST, path: "/repositories/{workspace}/{repo_slug}/pullrequests/{pull_request_id}/approve", path_params: [workspace, repo_slug, pull_request_id], description: "Approve a pull request as the token owner" }
    - { id: pullrequests.merge, method: POST, path: "/repositories/{workspace}/{repo_slug}/pullrequests/{pull_request_id}/merge", path_params: [workspace, repo_slug, pull_request_id], query_params: [async], body_params: [type, message, close_source_branch, merge_strategy], description: "Merge a pull request into its target branch" }
    - { id: pipelines.run, method: POST, path: "/repositories/{workspace}/{repo_slug}/pipelines", path_params: [workspace, repo_slug], body_params: [target, variables], description: "Start a pipeline for a branch, tag or commit; uses build minutes" }
    - { id: branches.delete, method: DELETE, path: "/repositories/{workspace}/{repo_slug}/refs/branches/{name}", path_params: [workspace, repo_slug, name], segment_params: [name], description: "Delete a branch" }

- id: sentry
  name: "Sentry"
  vertical: devtools
  description: "Read organizations, projects, issues, events and releases, and update or delete issues and create releases with an approval."
  base_url: "https://sentry.io/api/0"
  logo: sentry
  brand_color: "#362D59"
  auth: { scheme: bearer }
  redact_fields: [email, ip_address, ipAddress, securityToken, cookies, headers]
  credential:
    label: "Personal token"
    url: "https://sentry.io/settings/account/api/auth-tokens/"
    hint: "Create a personal token with org:read, project:read and event:read. Add event:write to update issues, event:admin to delete them, and project:releases to create releases."
  capabilities:
    - { id: organizations.list, method: GET, path: "/organizations/", query_params: [owner, cursor, query, sortBy, per_page], description: "List the organizations the token can see" }
    - { id: projects.list, method: GET, path: "/organizations/{organization_id_or_slug}/projects/", path_params: [organization_id_or_slug], query_params: [cursor, per_page, query], description: "List the projects in an organization" }
    - { id: projects.read, method: GET, path: "/projects/{organization_id_or_slug}/{project_id_or_slug}/", path_params: [organization_id_or_slug, project_id_or_slug], description: "Read a project" }
    - { id: teams.list, method: GET, path: "/organizations/{organization_id_or_slug}/teams/", path_params: [organization_id_or_slug], query_params: [detailed, cursor, per_page, query], description: "List the teams in an organization" }
    - { id: issues.list, method: GET, path: "/organizations/{organization_id_or_slug}/issues/", path_params: [organization_id_or_slug], query_params: [environment, project, statsPeriod, start, end, groupStatsPeriod, shortIdLookup, query, viewId, sort, limit, expand, collapse, cursor], description: "List and search the issues in an organization" }
    - { id: issues.read, method: GET, path: "/organizations/{organization_id_or_slug}/issues/{issue_id}/", path_params: [organization_id_or_slug, issue_id], query_params: [environment, expand, collapse], description: "Read an issue" }
    - { id: issues.resolve_short_id, method: GET, path: "/organizations/{organization_id_or_slug}/shortids/{issue_id}/", path_params: [organization_id_or_slug, issue_id], query_params: [collapse], description: "Look up an issue by its short id, such as PROJECT-1A" }
    - { id: issues.events, method: GET, path: "/organizations/{organization_id_or_slug}/issues/{issue_id}/events/", path_params: [organization_id_or_slug, issue_id], query_params: [start, end, statsPeriod, environment, full, sample, query, per_page, cursor], description: "List the events for an issue" }
    - { id: issues.event, method: GET, path: "/organizations/{organization_id_or_slug}/issues/{issue_id}/events/{event_id}/", path_params: [organization_id_or_slug, issue_id, event_id], query_params: [environment, collapse], description: "Read an issue event; event_id can also be latest, oldest or recommended" }
    - { id: events.list, method: GET, path: "/projects/{organization_id_or_slug}/{project_id_or_slug}/events/", path_params: [organization_id_or_slug, project_id_or_slug], query_params: [statsPeriod, start, end, cursor, full, sample], description: "List the error events in a project" }
    - { id: events.read, method: GET, path: "/projects/{organization_id_or_slug}/{project_id_or_slug}/events/{event_id}/", path_params: [organization_id_or_slug, project_id_or_slug, event_id], query_params: [environment, collapse], description: "Read an event in a project" }
    - { id: releases.list, method: GET, path: "/organizations/{organization_id_or_slug}/releases/", path_params: [organization_id_or_slug], query_params: [project, environment, query, per_page, cursor], description: "List the releases in an organization" }
    - { id: releases.read, method: GET, path: "/organizations/{organization_id_or_slug}/releases/{version}/", path_params: [organization_id_or_slug, version], query_params: [project, health, adoptionStages, summaryStatsPeriod, healthStatsPeriod, sort, status, query], description: "Read a release by version" }
    - { id: issues.update, method: PUT, path: "/organizations/{organization_id_or_slug}/issues/{issue_id}/", path_params: [organization_id_or_slug, issue_id], body_params: [status, statusDetails, substatus, assignedTo, priority, hasSeen, isBookmarked, isSubscribed, ignoreDuration, ignoreCount, ignoreWindow, ignoreUserCount, ignoreUserWindow, snoozeDuration], description: "Resolve, ignore, assign or reprioritize an issue" }
    - { id: releases.create, method: POST, path: "/organizations/{organization_id_or_slug}/releases/", path_params: [organization_id_or_slug], body_params: [version, projects, ref, url, dateReleased, commits, refs], description: "Create a release for one or more projects" }
    - { id: issues.delete, method: DELETE, path: "/organizations/{organization_id_or_slug}/issues/{issue_id}/", path_params: [organization_id_or_slug, issue_id], description: "Remove an issue and all its events" }

- id: pagerduty
  name: "PagerDuty"
  vertical: devtools
  description: "Read incidents, services, on-calls and schedules, and acknowledge, resolve or note incidents with an approval; opening an incident pages people."
  base_url: "https://api.pagerduty.com"
  logo: pagerduty
  brand_color: "#06AC38"
  auth: { scheme: raw, header: Authorization, prefix: "Token token=" }
  static_headers: { Accept: "application/vnd.pagerduty+json;version=2" }
  connection_headers:
    - { name: From, label: "Requester email", required: true, description: "The email of a user on this PagerDuty account. PagerDuty requires it on incident changes and records it as the actor." }
  redact_fields: [email, contact_methods, notification_rules, notification.address, integration_key, integration_email, service_key]
  credential:
    label: "REST API key"
    url: "https://docs.pagerduty.com/account-admin/api-access-keys"
    hint: "In PagerDuty open Integrations, Developer Tools, API Access Keys and choose Create New API Key. Tick Read-only API Key if the agent should never write. Admins and the account owner can do this."
  capabilities:
    - { id: incidents.list, method: GET, path: "/incidents", query_params: [limit, offset, total, date_range, incident_key, "service_ids[]", "team_ids[]", "user_ids[]", "urgencies[]", time_zone, "statuses[]", sort_by, "include[]", since, until], description: "List incidents, filtered by status, service, team, urgency or date" }
    - { id: incidents.read, method: GET, path: "/incidents/{id}", path_params: [id], query_params: ["include[]"], description: "Read an incident" }
    - { id: incidents.alerts, method: GET, path: "/incidents/{id}/alerts", path_params: [id], query_params: [limit, offset, total, alert_key, "statuses[]", sort_by, "include[]"], description: "List the alerts on an incident" }
    - { id: incidents.log_entries, method: GET, path: "/incidents/{id}/log_entries", path_params: [id], query_params: [limit, offset, total, time_zone, since, until, is_overview, "include[]"], description: "List the timeline of an incident" }
    - { id: incidents.notes, method: GET, path: "/incidents/{id}/notes", path_params: [id], description: "List the notes on an incident" }
    - { id: services.list, method: GET, path: "/services", query_params: [query, limit, offset, total, "team_ids[]", time_zone, sort_by, name], description: "List and search services" }
    - { id: services.read, method: GET, path: "/services/{id}", path_params: [id], description: "Read a service" }
    - { id: oncalls.list, method: GET, path: "/oncalls", query_params: [time_zone, limit, offset, total, "user_ids[]", "escalation_policy_ids[]", "schedule_ids[]", since, until, earliest], description: "List who is on call, by schedule, policy or user" }
    - { id: schedules.list, method: GET, path: "/schedules", query_params: [limit, offset, total, query, time_zone, since, until, "team_ids[]"], description: "List and search on-call schedules" }
    - { id: schedules.read, method: GET, path: "/schedules/{id}", path_params: [id], query_params: [time_zone, since, until, overflow], description: "Read a schedule and its rendered shifts" }
    - { id: escalation_policies.list, method: GET, path: "/escalation_policies", query_params: [limit, offset, total, query, "user_ids[]", "team_ids[]", sort_by], description: "List and search escalation policies" }
    - { id: users.list, method: GET, path: "/users", query_params: [query, "team_ids[]", limit, offset, total], description: "List and search users" }
    - { id: priorities.list, method: GET, path: "/priorities", query_params: [limit, offset, total], description: "List the account's incident priorities" }
    - { id: maintenance_windows.list, method: GET, path: "/maintenance_windows", query_params: [query, limit, offset, total, "team_ids[]", "service_ids[]", filter], description: "List maintenance windows" }
    - { id: incidents.create, method: POST, path: "/incidents", body_params: [incident], action: send, risk: high, requires_approval: true, description: "Open an incident on a service; this pages the on-call responders" }
    - { id: incidents.update, method: PUT, path: "/incidents/{id}", path_params: [id], body_params: [incident], requires_approval: true, description: "Acknowledge, resolve, reassign or change an incident" }
    - { id: incidents.snooze, method: POST, path: "/incidents/{id}/snooze", path_params: [id], body_params: [duration], description: "Snooze an incident for a number of seconds" }
    - { id: incidents.add_note, method: POST, path: "/incidents/{id}/notes", path_params: [id], body_params: [note], description: "Add a note to an incident" }
    - { id: incidents.request_responders, method: POST, path: "/incidents/{id}/responder_requests", path_params: [id], body_params: [requester_id, message, responder_request_targets], action: send, risk: high, requires_approval: true, description: "Page more responders to help on an incident" }
    - { id: maintenance_windows.create, method: POST, path: "/maintenance_windows", body_params: [maintenance_window], description: "Create a maintenance window, which silences a service's alerts" }
    - { id: maintenance_windows.delete, method: DELETE, path: "/maintenance_windows/{id}", path_params: [id], description: "Delete a future maintenance window or end a current one" }

- id: datadog
  name: "Datadog"
  vertical: devtools
  description: "Read monitors, dashboards, metrics, logs, events, hosts and SLOs, and change monitors or schedule downtime with an approval."
  base_url: "https://api.datadoghq.com"
  logo: datadog
  brand_color: "#632CA6"
  auth: { scheme: pair, first: { in: header, name: DD-API-KEY }, second: { in: header, name: DD-APPLICATION-KEY } }
  redact_fields: [creator.email, creator.handle, author_handle, attributes.email, attributes.handle]
  credential:
    label: "API key and application key"
    url: "https://app.datadoghq.com/organization-settings/application-keys"
    hint: "Create an API key and an application key under Organization Settings, and paste them as apikey:appkey. Scope the application key to limit access. Accounts outside US1 need the operator to change the host."
  capabilities:
    - { id: monitors.list, method: GET, path: "/api/v1/monitor", query_params: [group_states, name, tags, monitor_tags, with_downtimes, id_offset, page, page_size], description: "List monitors, filtered by name or tags" }
    - { id: monitors.search, method: GET, path: "/api/v1/monitor/search", query_params: [query, page, per_page, sort], description: "Search monitors with a query, such as status:alert" }
    - { id: monitors.read, method: GET, path: "/api/v1/monitor/{monitor_id}", path_params: [monitor_id], query_params: [group_states, with_downtimes, with_assets], description: "Read a monitor" }
    - { id: dashboards.list, method: GET, path: "/api/v1/dashboard", query_params: ["filter[shared]", "filter[deleted]", count, start], description: "List dashboards" }
    - { id: dashboards.read, method: GET, path: "/api/v1/dashboard/{dashboard_id}", path_params: [dashboard_id], description: "Read a dashboard and its widgets" }
    - { id: metrics.query, method: GET, path: "/api/v1/query", query_params: [from, to, query], description: "Query metric timeseries between two Unix timestamps" }
    - { id: metrics.list, method: GET, path: "/api/v2/metrics", query_params: ["filter[configured]", "filter[tags_configured]", "filter[metric_type]", "filter[include_percentiles]", "filter[queried]", "filter[tags]", "window[seconds]", "page[size]", "page[cursor]"], description: "List the metrics in the account" }
    - { id: logs.search, method: POST, path: "/api/v2/logs/events/search", body_params: [filter, page, sort], action: search, risk: medium, description: "Search log events with a query and time range" }
    - { id: events.list, method: GET, path: "/api/v2/events", query_params: ["filter[query]", "filter[from]", "filter[to]", sort, "page[cursor]", "page[limit]"], description: "List events with a query and time range" }
    - { id: hosts.list, method: GET, path: "/api/v1/hosts", query_params: [filter, sort_field, sort_dir, start, count, from, include_muted_hosts_data], description: "List and filter hosts" }
    - { id: slos.list, method: GET, path: "/api/v1/slo", query_params: [ids, query, tags_query, metrics_query, limit, offset], description: "List and search service level objectives" }
    - { id: slos.read, method: GET, path: "/api/v1/slo/{slo_id}", path_params: [slo_id], query_params: [with_configured_alert_ids], description: "Read a service level objective" }
    - { id: slos.history, method: GET, path: "/api/v1/slo/{slo_id}/history", path_params: [slo_id], query_params: [from_ts, to_ts, target, apply_correction], description: "Read the history of a service level objective" }
    - { id: downtimes.list, method: GET, path: "/api/v2/downtime", query_params: [current_only, include, "page[offset]", "page[limit]"], description: "List scheduled downtimes" }
    - { id: monitors.create, method: POST, path: "/api/v1/monitor", body_params: [name, type, query, message, tags, priority, options, restricted_roles], requires_approval: true, description: "Create a monitor; mentions in its message notify people when it fires" }
    - { id: monitors.update, method: PUT, path: "/api/v1/monitor/{monitor_id}", path_params: [monitor_id], body_params: [name, type, query, message, tags, priority, options, restricted_roles], requires_approval: true, description: "Edit a monitor" }
    - { id: downtimes.create, method: POST, path: "/api/v2/downtime", body_params: [data], description: "Schedule a downtime, which silences matching monitors" }
    - { id: downtimes.cancel, method: DELETE, path: "/api/v2/downtime/{downtime_id}", path_params: [downtime_id], description: "Cancel a downtime" }
    - { id: monitors.delete, method: DELETE, path: "/api/v1/monitor/{monitor_id}", path_params: [monitor_id], description: "Delete a monitor" }

