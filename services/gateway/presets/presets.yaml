# Permaura marketplace presets: the catalog every gateway ships.
#
# Each entry is pre-verified import arguments, loaded by services/gateway/src/presets.rs into the
# same Capability/HttpSpec the OpenAPI importer produces. Only the HTTP shape is required per
# capability; action/risk/approval default from openapi::classify (refund/charge/delete/POST -> High
# or Critical + approval), and reads (GET -> Medium) stay enabled while writes start disabled. A
# line may override `action`, `risk`, `requires_approval`, or `disabled`.
#
# method: GET|POST|PUT|PATCH|DELETE   risk: low|medium|high|critical
# Entries are listed most used first, which is the order the marketplace shows them.
# auth.scheme: bearer | basic | api_key_header | api_key_query | raw | pair | path_token. pair seals two values as first:second and sends each where its slot says (a header or a query parameter). path_token puts the secret in the URL path after a literal prefix.
# body_style: json (default) | form. Preset-wide, and a capability line may override it. form sends
#   application/x-www-form-urlencoded with nested values in bracket syntax (metadata[order]=1042).
# logo: a Simple Icons slug (rendered in the console). brand_color: the brand hex.
# oauth: present when the connector also supports OAuth (PKCE / BYO app / Managed). Whether the
#   hosted *Managed* layer is offered is a separate web-side flag (managed_oauth_provider), so a
#   connector can advertise OAuth while we are still standing up its hosted app. pkce: true means the
#   zero-knowledge "Permaura app" layer is possible (public client, no secret). token_auth: body
#   (default) sends the client id and secret as form fields; basic sends them as an HTTP Basic header,
#   which Reddit requires. authorize_params: extra parameters on every authorization URL (Reddit's
#   duration=permanent, without which it issues no refresh token). token_scheme: how an access token is sent when that is not how a pasted key is. refresh_grant: none for a vendor that issues a non-expiring token and no refresh token. grant: client_credentials for a vendor with no consent screen, where the operator pastes client_id:client_secret and the gateway mints and renews tokens. client_id_param: a vendor's own name for client_id.
# credential: what to paste and where it is made, for the line under the console's credential box. oauth_only means there is nothing to paste, so a connection needs its own OAuth app.
# Paths are quoted because `{id}` braces are flow-mapping syntax in YAML.
# The secret is referenced by id and injected server-side, never present here.

- id: gmail
  name: Gmail
  vertical: comms
  description: List and read messages, threads and labels.
  base_url: https://gmail.googleapis.com/gmail/v1
  logo: gmail
  brand_color: "#EA4335"
  auth: { scheme: bearer }
  oauth:
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes: ["https://www.googleapis.com/auth/gmail.readonly", "https://www.googleapis.com/auth/gmail.send"]
    pkce: true
  capabilities:
    - { id: messages.list, method: GET, path: "/users/me/messages", query_params: [q, maxResults], description: List messages }
    - { id: messages.read, method: GET, path: "/users/me/messages/{id}", path_params: [id], description: Read a message }
    - { id: threads.list, method: GET, path: "/users/me/threads", query_params: [q], description: List threads }
    - { id: labels.list, method: GET, path: "/users/me/labels", description: List labels }
    - { id: profile.read, method: GET, path: "/users/me/profile", description: Read the mailbox profile }
    - { id: messages.send, method: POST, path: "/users/me/messages/send", body_params: [raw], action: send, description: Send a message }
    - { id: messages.trash, method: POST, path: "/users/me/messages/{id}/trash", path_params: [id], action: delete, description: Move a message to trash }
    - { id: messages.delete, method: DELETE, path: "/users/me/messages/{id}", path_params: [id], description: Permanently delete a message }

- id: google-calendar
  name: Google Calendar
  vertical: comms
  description: "List calendars and events, check free/busy, and create or amend meetings."
  base_url: "https://www.googleapis.com/calendar/v3"
  logo: googlecalendar
  brand_color: "#4285F4"
  auth: { scheme: bearer }
  redact_fields: [email]
  oauth:
    authorize_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/calendar.readonly", "https://www.googleapis.com/auth/calendar.events"]
    pkce: true
  capabilities:
    - { id: calendars.list, method: GET, path: "/users/me/calendarList", query_params: [maxResults, pageToken, minAccessRole, showHidden, showDeleted], description: List the calendars on the account }
    - { id: calendars.get, method: GET, path: "/calendars/{calendarId}", path_params: [calendarId], description: Read one calendar's metadata and time zone }
    - { id: events.list, method: GET, path: "/calendars/{calendarId}/events", path_params: [calendarId], query_params: [timeMin, timeMax, q, singleEvents, orderBy, maxResults, pageToken, showDeleted, eventTypes], description: List or search events in a time window }
    - { id: events.get, method: GET, path: "/calendars/{calendarId}/events/{eventId}", path_params: [calendarId, eventId], query_params: [maxAttendees, timeZone], description: Read a single event }
    - { id: events.instances, method: GET, path: "/calendars/{calendarId}/events/{eventId}/instances", path_params: [calendarId, eventId], query_params: [timeMin, timeMax, maxResults, pageToken, showDeleted], description: List the occurrences of a recurring event }
    - { id: freebusy.query, method: POST, path: "/freeBusy", body_params: [timeMin, timeMax, timeZone, items, calendarExpansionMax, groupExpansionMax], action: read, risk: medium, description: Look up busy blocks across calendars (read-only despite the POST) }
    - { id: events.create, method: POST, path: "/calendars/{calendarId}/events", path_params: [calendarId], query_params: [conferenceDataVersion, sendUpdates, maxAttendees, supportsAttachments], body_params: [summary, description, location, start, end, attendees, conferenceData, recurrence, reminders, visibility], requires_approval: true, description: "Create an event, optionally with a Meet link via conferenceData" }
    - { id: events.update, method: PUT, path: "/calendars/{calendarId}/events/{eventId}", path_params: [calendarId, eventId], query_params: [conferenceDataVersion, sendUpdates, maxAttendees, supportsAttachments], body_params: [summary, description, location, start, end, attendees, conferenceData, recurrence, reminders, status], requires_approval: true, description: "Replace an event (send the whole resource, not a partial)" }
    - { id: events.delete, method: DELETE, path: "/calendars/{calendarId}/events/{eventId}", path_params: [calendarId, eventId], query_params: [sendUpdates], description: Cancel and remove an event }

- id: google-drive
  name: Google Drive
  vertical: data
  description: "Search Drive, read file metadata, download or export documents, and manage folders."
  base_url: "https://www.googleapis.com/drive/v3"
  logo: googledrive
  brand_color: "#4285F4"
  auth: { scheme: bearer }
  redact_fields: [emailAddress, photoLink]
  oauth:
    authorize_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/drive.readonly", "https://www.googleapis.com/auth/drive.file"]
    pkce: true
  capabilities:
    - { id: files.list, method: GET, path: "/files", query_params: [q, pageSize, pageToken, orderBy, fields, spaces, corpora, driveId, includeItemsFromAllDrives, supportsAllDrives], description: List or search files with a Drive query }
    - { id: files.get, method: GET, path: "/files/{fileId}", path_params: [fileId], query_params: [fields, supportsAllDrives, includeLabels], description: Read a file's metadata }
    - { id: files.download, method: GET, path: "/files/{fileId}", path_params: [fileId], query_params: [alt, acknowledgeAbuse, supportsAllDrives], description: "Download a binary file's content (send alt=media)" }
    - { id: files.export, method: GET, path: "/files/{fileId}/export", path_params: [fileId], query_params: [mimeType], description: "Export a Google Docs, Sheets or Slides file to another format" }
    - { id: permissions.list, method: GET, path: "/files/{fileId}/permissions", path_params: [fileId], query_params: [pageSize, pageToken, fields, supportsAllDrives], description: List who a file is shared with }
    - { id: folders.create, method: POST, path: "/files", query_params: [supportsAllDrives, fields], body_params: [name, mimeType, parents, description], description: Create a folder (mimeType application/vnd.google-apps.folder) }
    - { id: files.copy, method: POST, path: "/files/{fileId}/copy", path_params: [fileId], query_params: [supportsAllDrives, fields], body_params: [name, parents], description: Copy a file }
    - { id: files.update, method: PATCH, path: "/files/{fileId}", path_params: [fileId], query_params: [addParents, removeParents, supportsAllDrives, fields], body_params: [name, description, starred, trashed], description: "Update a file's metadata, or move it between folders" }
    - { id: files.delete, method: DELETE, path: "/files/{fileId}", path_params: [fileId], query_params: [supportsAllDrives], description: "Permanently delete a file, bypassing the trash" }

- id: outlook
  name: "Outlook"
  vertical: comms
  description: "Read and search mail and calendar events, and draft, send, reply, schedule or delete with an approval."
  base_url: "https://graph.microsoft.com/v1.0"
  logo: outlook
  brand_color: "#0078D4"
  auth: { scheme: bearer }
  redact_fields: [phones, tollNumber, tollFreeNumbers, quickDial, conferenceId]
  credential:
    label: "Your own OAuth app"
    url: "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade"
    hint: "In Entra ID, App registrations, register a multitenant web app, add the delegated Graph permissions Mail.ReadWrite, Mail.Send and Calendars.ReadWrite, and create a client secret."
    oauth_only: true
  oauth:
    authorize_url: "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
    token_url: "https://login.microsoftonline.com/common/oauth2/v2.0/token"
    scopes: ["Mail.ReadWrite", "Mail.Send", "Calendars.ReadWrite", "offline_access"]
    pkce: true
    authorize_params: { prompt: select_account }
  capabilities:
    - { id: messages.list, method: GET, path: "/me/messages", query_params: ["$top", "$skip", "$filter", "$orderby", "$select", "$search"], description: "List or search messages; put $search terms in double quotes, such as \"from:ann\". Search returns up to 1,000 results by date sent" }
    - { id: messages.read, method: GET, path: "/me/messages/{message_id}", path_params: [message_id], query_params: ["$select"], description: "Read a message" }
    - { id: folders.list, method: GET, path: "/me/mailFolders", query_params: ["$top", "$skip", "$filter", "$select", includeHiddenFolders], description: "List mail folders" }
    - { id: folders.messages, method: GET, path: "/me/mailFolders/{folder_id}/messages", path_params: [folder_id], query_params: ["$top", "$skip", "$filter", "$orderby", "$select"], description: "List messages in a folder; folder_id may be a folder id or a well-known name such as inbox, sentitems or drafts" }
    - { id: attachments.list, method: GET, path: "/me/messages/{message_id}/attachments", path_params: [message_id], query_params: ["$top", "$select"], description: "List a message's attachments, which include base64 content unless $select leaves contentBytes out" }
    - { id: drafts.create, method: POST, path: "/me/messages", body_params: [subject, body, toRecipients, ccRecipients, bccRecipients, replyTo, importance, attachments], description: "Create a draft message without sending it" }
    - { id: drafts.send, method: POST, path: "/me/messages/{message_id}/send", path_params: [message_id], action: send, risk: high, requires_approval: true, description: "Send an existing draft message" }
    - { id: mail.send, method: POST, path: "/me/sendMail", body_params: [message, saveToSentItems], action: send, risk: high, requires_approval: true, description: "Send a new message from the signed-in mailbox" }
    - { id: messages.reply, method: POST, path: "/me/messages/{message_id}/reply", path_params: [message_id], body_params: [comment, message], action: send, risk: high, requires_approval: true, description: "Reply to the sender of a message" }
    - { id: messages.reply_all, method: POST, path: "/me/messages/{message_id}/replyAll", path_params: [message_id], body_params: [comment, message], action: send, risk: high, requires_approval: true, description: "Reply to everyone on a message" }
    - { id: messages.forward, method: POST, path: "/me/messages/{message_id}/forward", path_params: [message_id], body_params: [comment, toRecipients, message], action: send, risk: high, requires_approval: true, description: "Forward a message to new recipients" }
    - { id: messages.update, method: PATCH, path: "/me/messages/{message_id}", path_params: [message_id], body_params: [isRead, categories, flag, importance, inferenceClassification, subject, body, toRecipients, ccRecipients, bccRecipients], description: "Mark, flag or categorize a message, or edit a draft" }
    - { id: messages.move, method: POST, path: "/me/messages/{message_id}/move", path_params: [message_id], body_params: [destinationId], action: update, risk: high, description: "Move a message to another folder; destinationId may be a folder id or a well-known name such as archive" }
    - { id: messages.delete, method: DELETE, path: "/me/messages/{message_id}", path_params: [message_id], description: "Delete a message" }
    - { id: calendar.view, method: GET, path: "/me/calendarView", query_params: [startDateTime, endDateTime, "$top", "$skip", "$filter", "$orderby", "$select"], description: "List events in a time window with recurring events expanded; startDateTime and endDateTime are required" }
    - { id: events.create, method: POST, path: "/me/events", body_params: [subject, body, start, end, location, locations, attendees, isAllDay, isOnlineMeeting, onlineMeetingProvider, recurrence, reminderMinutesBeforeStart, isReminderOn, responseRequested, sensitivity, showAs, importance, categories, allowNewTimeProposals, hideAttendees], action: send, risk: high, requires_approval: true, description: "Create a calendar event; Outlook sends an invitation to anyone listed in attendees" }
    - { id: events.update, method: PATCH, path: "/me/events/{event_id}", path_params: [event_id], body_params: [subject, body, start, end, location, locations, attendees, isAllDay, isOnlineMeeting, onlineMeetingProvider, recurrence, reminderMinutesBeforeStart, isReminderOn, responseRequested, sensitivity, showAs, importance, categories, allowNewTimeProposals, hideAttendees], action: send, risk: high, requires_approval: true, description: "Update a calendar event; Outlook notifies attendees when the organizer changes a meeting" }
    - { id: events.accept, method: POST, path: "/me/events/{event_id}/accept", path_params: [event_id], body_params: [comment, sendResponse], action: send, risk: high, requires_approval: true, description: "Accept a meeting invitation and tell the organizer" }
    - { id: events.decline, method: POST, path: "/me/events/{event_id}/decline", path_params: [event_id], body_params: [comment, proposedNewTime, sendResponse], action: send, risk: high, requires_approval: true, description: "Decline a meeting invitation and tell the organizer" }
    - { id: events.delete, method: DELETE, path: "/me/events/{event_id}", path_params: [event_id], description: "Delete a calendar event; if you organized the meeting, Outlook emails attendees a cancellation" }

- id: x
  name: "X"
  vertical: social
  description: "Read posts, mentions, timelines, users and direct messages, and publish posts, reposts and direct messages with an approval."
  base_url: "https://api.x.com/2"
  logo: x
  brand_color: "#000000"
  auth: { scheme: bearer }
  redact_fields: [confirmed_email]
  credential:
    label: "Your own OAuth app"
    url: "https://console.x.com"
    hint: "In the Developer Console create an app, set OAuth 2.0 to Web App, add the redirect URL and buy credits. A pasted Bearer Token reaches public reads only and cannot post."
    oauth_only: true
  oauth:
    authorize_url: "https://x.com/i/oauth2/authorize"
    token_url: "https://api.x.com/2/oauth2/token"
    scopes: ["tweet.read", "tweet.write", "users.read", "follows.read", "dm.read", "dm.write", "offline.access"]
    pkce: true
    token_auth: basic
  capabilities:
    - { id: me.read, method: GET, path: "/users/me", query_params: [user.fields, expansions, tweet.fields, post.fields], description: "Read the account the connection acts as, including the id other calls need" }
    - { id: users.by_username, method: GET, path: "/users/by/username/{username}", path_params: [username], query_params: [user.fields, expansions, tweet.fields, post.fields], description: "Look up a user by username; billed per user returned" }
    - { id: users.read, method: GET, path: "/users/{id}", path_params: [id], query_params: [user.fields, expansions, tweet.fields, post.fields], description: "Read a user by id; billed per user returned" }
    - { id: posts.read, method: GET, path: "/tweets/{id}", path_params: [id], query_params: [tweet.fields, post.fields, expansions, user.fields, media.fields, poll.fields, place.fields], description: "Read a post by id; billed per post returned" }
    - { id: posts.search, method: GET, path: "/tweets/search/recent", query_params: [query, max_results, next_token, pagination_token, start_time, end_time, since_id, until_id, sort_order, tweet.fields, post.fields, expansions, user.fields, media.fields, poll.fields, place.fields], action: search, risk: medium, description: "Search posts from the last 7 days; billed per post returned, so keep max_results small" }
    - { id: users.posts, method: GET, path: "/users/{id}/tweets", path_params: [id], query_params: [max_results, pagination_token, start_time, end_time, since_id, until_id, exclude, tweet.fields, post.fields, expansions, user.fields, media.fields, poll.fields, place.fields], description: "List a user's posts; billed per post returned" }
    - { id: users.mentions, method: GET, path: "/users/{id}/mentions", path_params: [id], query_params: [max_results, pagination_token, start_time, end_time, since_id, until_id, tweet.fields, post.fields, expansions, user.fields, media.fields, poll.fields, place.fields], description: "List posts that mention a user; billed per post returned" }
    - { id: timeline.home, method: GET, path: "/users/{id}/timelines/reverse_chronological", path_params: [id], query_params: [max_results, pagination_token, start_time, end_time, since_id, until_id, exclude, tweet.fields, post.fields, expansions, user.fields, media.fields, poll.fields, place.fields], description: "Read the connected account's home timeline; billed per post returned" }
    - { id: followers.list, method: GET, path: "/users/{id}/followers", path_params: [id], query_params: [max_results, pagination_token, user.fields, expansions, tweet.fields, post.fields], description: "List a user's followers; billed per user returned" }
    - { id: following.list, method: GET, path: "/users/{id}/following", path_params: [id], query_params: [max_results, pagination_token, user.fields, expansions, tweet.fields, post.fields], description: "List the accounts a user follows; billed per user returned" }
    - { id: dm.list, method: GET, path: "/dm_events", query_params: [max_results, pagination_token, event_types, dm_event.fields, expansions, user.fields, tweet.fields, post.fields, media.fields], description: "List recent direct message events across all conversations; billed per event returned" }
    - { id: posts.create, method: POST, path: "/tweets", body_params: [text, reply, poll, media, reply_settings, for_super_followers_only, community_id, made_with_ai, paid_partnership], action: send, risk: high, requires_approval: true, description: "Publish a post; a URL costs far more, and a reply needs the author to have mentioned or quoted this account" }
    - { id: posts.repost, method: POST, path: "/users/{id}/retweets", path_params: [id], body_params: [tweet_id], action: send, risk: high, requires_approval: true, description: "Repost a post from the connected account" }
    - { id: dm.send, method: POST, path: "/dm_conversations/with/{participant_id}/messages", path_params: [participant_id], body_params: [text, attachments], action: send, risk: high, requires_approval: true, description: "Send a direct message to a user" }
    - { id: posts.delete, method: DELETE, path: "/tweets/{id}", path_params: [id], description: "Delete a post the connected account published" }

- id: google-sheets
  name: "Google Sheets"
  vertical: productivity
  description: "Read spreadsheets and cell ranges, and write, append or clear values and change tabs with an approval."
  base_url: "https://sheets.googleapis.com/v4"
  logo: googlesheets
  brand_color: "#34A853"
  auth: { scheme: bearer }
  credential:
    label: "Your own OAuth app"
    url: "https://console.cloud.google.com/auth/clients"
    hint: "In Google Cloud, enable the Google Sheets API, then create a Web application client under Google Auth platform, Clients, using the redirect URL the console shows."
    oauth_only: true
  oauth:
    authorize_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/spreadsheets"]
    pkce: true
  capabilities:
    - { id: spreadsheets.read, method: GET, path: "/spreadsheets/{spreadsheetId}", path_params: [spreadsheetId], query_params: [fields], description: "Read a spreadsheet's title and tab list; use fields to narrow the response" }
    - { id: values.read, method: GET, path: "/spreadsheets/{spreadsheetId}/values/{range}", path_params: [spreadsheetId, range], segment_params: [range], query_params: [majorDimension, valueRenderOption, dateTimeRenderOption], description: "Read cell values from one range in A1 notation, such as Sheet1!A1:C5" }
    - { id: values.batch_read, method: POST, path: "/spreadsheets/{spreadsheetId}/values:batchGetByDataFilter", path_params: [spreadsheetId], body_params: [dataFilters, majorDimension, valueRenderOption, dateTimeRenderOption], action: read, risk: medium, description: "Read several ranges at once; pass dataFilters as a list of objects with a1Range" }
    - { id: spreadsheets.create, method: POST, path: "/spreadsheets", body_params: [properties, sheets], description: "Create a new spreadsheet, optionally with named tabs" }
    - { id: values.update, method: PUT, path: "/spreadsheets/{spreadsheetId}/values/{range}", path_params: [spreadsheetId, range], segment_params: [range], query_params: [valueInputOption, includeValuesInResponse, responseValueRenderOption, responseDateTimeRenderOption], body_params: [values, majorDimension], description: "Overwrite cell values in a range; set valueInputOption to RAW or USER_ENTERED" }
    - { id: values.append, method: POST, path: "/spreadsheets/{spreadsheetId}/values/{range}:append", path_params: [spreadsheetId, range], segment_params: [range], query_params: [valueInputOption, insertDataOption, includeValuesInResponse, responseValueRenderOption, responseDateTimeRenderOption], body_params: [values, majorDimension], description: "Append rows after the end of a table; set valueInputOption to RAW or USER_ENTERED" }
    - { id: values.batch_update, method: POST, path: "/spreadsheets/{spreadsheetId}/values:batchUpdate", path_params: [spreadsheetId], body_params: [data, valueInputOption, includeValuesInResponse, responseValueRenderOption, responseDateTimeRenderOption], description: "Overwrite cell values in several ranges; set valueInputOption in the body" }
    - { id: spreadsheets.batch_update, method: POST, path: "/spreadsheets/{spreadsheetId}:batchUpdate", path_params: [spreadsheetId], body_params: [requests, includeSpreadsheetInResponse, responseRanges, responseIncludeGridData], requires_approval: true, description: "Change structure and formatting; requests can add or delete tabs and rows, sort, format, and protect ranges" }
    - { id: sheets.copy_to, method: POST, path: "/spreadsheets/{spreadsheetId}/sheets/{sheetId}:copyTo", path_params: [spreadsheetId, sheetId], body_params: [destinationSpreadsheetId], description: "Copy one tab to another spreadsheet" }
    - { id: values.clear, method: POST, path: "/spreadsheets/{spreadsheetId}/values/{range}:clear", path_params: [spreadsheetId, range], segment_params: [range], action: delete, risk: critical, requires_approval: true, description: "Clear the values in one range, keeping formatting" }
    - { id: values.batch_clear, method: POST, path: "/spreadsheets/{spreadsheetId}/values:batchClear", path_params: [spreadsheetId], body_params: [ranges], action: delete, risk: critical, requires_approval: true, description: "Clear the values in several ranges, keeping formatting" }

- id: supabase
  name: "Supabase"
  vertical: devtools
  description: "Read organizations, projects, functions, migrations, logs and backups, and apply migrations or manage projects and branches with an approval."
  base_url: "https://api.supabase.com"
  logo: supabase
  brand_color: "#3FCF8E"
  auth: { scheme: bearer }
  redact_fields: [db_pass, jwt_secret, email]
  credential:
    label: "Personal access token"
    url: "https://supabase.com/dashboard/account/tokens"
    hint: "Create a scoped token limited to the organizations, projects and permissions the agent needs. It starts with sbp_. A classic token, labeled Legacy, has all of your account's access."
  capabilities:
    - { id: organizations.list, method: GET, path: "/v1/organizations", description: "List the organizations the token can see" }
    - { id: organizations.members, method: GET, path: "/v1/organizations/{slug}/members", path_params: [slug], description: "List the members of an organization" }
    - { id: projects.list, method: GET, path: "/v1/projects", description: "List all projects" }
    - { id: projects.read, method: GET, path: "/v1/projects/{ref}", path_params: [ref], description: "Read a project by its ref" }
    - { id: projects.health, method: GET, path: "/v1/projects/{ref}/health", path_params: [ref], query_params: [services, timeout_ms], description: "Read the health of a project's services; services is required" }
    - { id: logs.query, method: GET, path: "/v1/projects/{ref}/analytics/endpoints/logs", path_params: [ref], query_params: [sql, iso_timestamp_start, iso_timestamp_end], description: "Query a project's unified log stream with SQL over a time range" }
    - { id: migrations.list, method: GET, path: "/v1/projects/{ref}/database/migrations", path_params: [ref], description: "List the migrations applied to a project's database" }
    - { id: backups.list, method: GET, path: "/v1/projects/{ref}/database/backups", path_params: [ref], description: "List a project's database backups" }
