# Permaura marketplace presets: the catalog every gateway ships.
#
# Each entry is pre-verified import arguments, loaded by services/gateway/src/presets.rs into the
# same Capability/HttpSpec the OpenAPI importer produces. Only the HTTP shape is required per
# capability; action/risk/approval default from openapi::classify (refund/charge/delete/POST -> High
# or Critical + approval), and reads (GET -> Medium) stay enabled while writes start disabled. A
# line may override `action`, `risk`, `requires_approval`, or `disabled`.
#
# method: GET|POST|PUT|PATCH|DELETE   risk: low|medium|high|critical
# auth.scheme: bearer | basic | api_key_header | api_key_query | raw
# body_style: json (default) | form. Preset-wide, and a capability line may override it. form sends
#   application/x-www-form-urlencoded with nested values in bracket syntax (metadata[order]=1042).
# logo: a Simple Icons slug (rendered in the console). brand_color: the brand hex.
# oauth: present when the connector also supports OAuth (PKCE / BYO app / Managed). Whether the
#   hosted *Managed* layer is offered is a separate web-side flag (managed_oauth_provider), so a
#   connector can advertise OAuth while we are still standing up its hosted app. pkce: true means the
#   zero-knowledge "Permaura app" layer is possible (public client, no secret).
# Paths are quoted because `{id}` braces are flow-mapping syntax in YAML.
# The secret is referenced by id and injected server-side, never present here.

- id: stripe
  name: Stripe
  vertical: payments
  description: Read charges, customers, invoices and subscriptions.
  base_url: https://api.stripe.com/v1
  logo: stripe
  brand_color: "#635BFF"
  auth: { scheme: basic, key_as_username: true }
  static_headers: { Stripe-Version: "2024-06-20" }
  body_style: form
  redact_fields: [card.number, cvc, exp_month, exp_year, address, email, phone, client_secret, customer_email, customer_phone, customer_address, customer_shipping, receipt_email]
  capabilities:
    - { id: charges.list, method: GET, path: "/charges", query_params: [limit, starting_after], description: List charges }
    - { id: charges.read, method: GET, path: "/charges/{id}", path_params: [id], description: Retrieve a charge }
    - { id: customers.list, method: GET, path: "/customers", query_params: [limit], description: List customers }
    - { id: customers.read, method: GET, path: "/customers/{id}", path_params: [id], description: Retrieve a customer }
    - { id: invoices.list, method: GET, path: "/invoices", query_params: [limit], description: List invoices }
    - { id: subscriptions.list, method: GET, path: "/subscriptions", query_params: [limit], description: List subscriptions }
    - { id: balance.read, method: GET, path: "/balance", description: Read account balance }
    - { id: refunds.create, method: POST, path: "/refunds", body_params: [charge, amount, reason], description: Refund a charge }
    - { id: payment_intents.capture, method: POST, path: "/payment_intents/{id}/capture", path_params: [id], description: Capture a payment intent }
    - { id: payouts.create, method: POST, path: "/payouts", body_params: [amount, currency], description: Create a payout }
    - { id: customers.delete, method: DELETE, path: "/customers/{id}", path_params: [id], description: Delete a customer }

- id: github
  name: GitHub
  vertical: devtools
  description: Read repos, issues, pull requests and commits.
  base_url: https://api.github.com
  logo: github
  brand_color: "#181717"
  auth: { scheme: bearer }
  static_headers: { Accept: "application/vnd.github+json", X-GitHub-Api-Version: "2022-11-28" }
  oauth:
    authorize_url: https://github.com/login/oauth/authorize
    token_url: https://github.com/login/oauth/access_token
    scopes: [repo, read:org]
    pkce: false
  capabilities:
    - { id: repos.read, method: GET, path: "/repos/{owner}/{repo}", path_params: [owner, repo], description: Read repository metadata }
    - { id: issues.list, method: GET, path: "/repos/{owner}/{repo}/issues", path_params: [owner, repo], query_params: [state, labels], description: List issues }
    - { id: pull_requests.list, method: GET, path: "/repos/{owner}/{repo}/pulls", path_params: [owner, repo], query_params: [state], description: List pull requests }
    - { id: commits.list, method: GET, path: "/repos/{owner}/{repo}/commits", path_params: [owner, repo], description: List commits }
    - { id: search.repos, method: GET, path: "/search/repositories", query_params: [q, sort], description: Search repositories }
    - { id: issues.create, method: POST, path: "/repos/{owner}/{repo}/issues", path_params: [owner, repo], body_params: [title, body, labels], description: Open an issue }
    - { id: pull_requests.create, method: POST, path: "/repos/{owner}/{repo}/pulls", path_params: [owner, repo], body_params: [title, head, base, body], description: Open a pull request }
    - { id: pull_requests.merge, method: PUT, path: "/repos/{owner}/{repo}/pulls/{pull_number}/merge", path_params: [owner, repo, pull_number], body_params: [merge_method], risk: critical, description: Merge a pull request }
    - { id: repos.delete, method: DELETE, path: "/repos/{owner}/{repo}", path_params: [owner, repo], description: Delete a repository }

- id: slack
  name: Slack
  vertical: comms
  description: List channels, read history and search messages.
  base_url: https://slack.com/api
  logo: slack
  brand_color: "#4A154B"
  auth: { scheme: bearer }
  # A bare name matches that key at any depth, so `email` covers users.list's members[].profile.email.
  redact_fields: [email, phone, skype]
  oauth:
    authorize_url: https://slack.com/oauth/v2/authorize
    token_url: https://slack.com/api/oauth.v2.access
    scopes: [channels:read, channels:history, chat:write, users:read]
    pkce: false
  capabilities:
    - { id: conversations.list, method: GET, path: "/conversations.list", query_params: [types, limit], description: List conversations }
    - { id: conversations.history, method: GET, path: "/conversations.history", query_params: [channel, limit], description: Read channel history }
    - { id: users.list, method: GET, path: "/users.list", query_params: [limit], description: List users }
    - { id: search.messages, method: GET, path: "/search.messages", query_params: [query, count], description: Search messages }
    - { id: chat.postMessage, method: POST, path: "/chat.postMessage", body_params: [channel, text, blocks], description: Post a message }
    - { id: chat.delete, method: POST, path: "/chat.delete", body_params: [channel, ts], action: delete, risk: critical, description: Delete a message }
    - { id: conversations.archive, method: POST, path: "/conversations.archive", body_params: [channel], description: Archive a channel }

