    - { id: search.google_shopping, method: GET, path: "/search.json", query_params: [engine, q, location, uule, google_domain, gl, hl, shoprs, min_price, max_price, sort_by, free_shipping, on_sale, small_business, safe, start, device, no_cache, json_restrictor], action: search, description: "Search Google Shopping. Set engine to google_shopping. Uses one plan search; cached repeats are free." }
    - { id: search.google_images, method: GET, path: "/search.json", query_params: [engine, q, location, uule, google_domain, gl, hl, cr, period_unit, period_value, start_date, end_date, chips, tbs, imgar, imgsz, image_color, image_type, licenses, safe, nfpr, filter, ijn, device, no_cache, json_restrictor], action: search, description: "Search Google Images. Set engine to google_images. Uses one plan search; cached repeats are free." }
    - { id: search.google_trends, method: GET, path: "/search.json", query_params: [engine, q, hl, geo, region, data_type, tz, cat, gprop, date, include_low_search_volume, no_cache, json_restrictor], action: search, description: "Read Google Trends data for a query. Set engine to google_trends. Uses one plan search; cached repeats are free." }
    - { id: search.bing, method: GET, path: "/search.json", query_params: [engine, q, location, lat, lon, mkt, cc, first, safeSearch, filters, device, no_cache, json_restrictor], action: search, description: "Search Bing. Set engine to bing. Uses one plan search; cached repeats are free." }
    - { id: search.duckduckgo, method: GET, path: "/search.json", query_params: [engine, q, kl, search_assist, safe, df, start, m, no_cache, json_restrictor], action: search, description: "Search DuckDuckGo. Set engine to duckduckgo. Uses one plan search; cached repeats are free." }
    - { id: search.youtube, method: GET, path: "/search.json", query_params: [engine, search_query, gl, hl, sp, no_cache, json_restrictor], action: search, description: "Search YouTube. Set engine to youtube and put the query in search_query. Uses one plan search." }
    - { id: search.amazon, method: GET, path: "/search.json", query_params: [engine, k, amazon_domain, language, delivery_zip, shipping_location, s, node, rh, dc, page, device, no_cache, json_restrictor], action: search, description: "Search Amazon products. Set engine to amazon and put the query in k. Uses one plan search." }
