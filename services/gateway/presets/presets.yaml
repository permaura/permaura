    - { id: folders.list_files, method: GET, path: "/v2/folders/{folder_id}/files", path_params: [folder_id], query_params: [branch_data], description: "List the files in a folder" }
    - { id: components.list_team, method: GET, path: "/v1/teams/{team_id}/components", path_params: [team_id], query_params: [page_size, after, before], description: "List the published components in a team library" }
