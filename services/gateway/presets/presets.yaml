    pkce: false
  capabilities:
    - { id: boards.list, method: GET, path: "/boards", query_params: [team_id, project_id, query, owner, limit, offset, sort], description: "List and search the boards the user can reach" }
    - { id: boards.read, method: GET, path: "/boards/{board_id}", path_params: [board_id], description: "Read a board" }
    - { id: boards.create, method: POST, path: "/boards", body_params: [name, description, teamId, projectId], description: "Create a board" }
    - { id: boards.delete, method: DELETE, path: "/boards/{board_id}", path_params: [board_id], description: "Delete a board" }
    - { id: items.list, method: GET, path: "/boards/{board_id}/items", path_params: [board_id], query_params: [limit, type, cursor], description: "List the items on a board, optionally of one type" }
    - { id: items.read, method: GET, path: "/boards/{board_id}/items/{item_id}", path_params: [board_id, item_id], description: "Read an item on a board" }
    - { id: items.update, method: PATCH, path: "/boards/{board_id}/items/{item_id}", path_params: [board_id, item_id], body_params: [parent, position], description: "Move an item on a board or change its parent frame" }
    - { id: items.delete, method: DELETE, path: "/boards/{board_id}/items/{item_id}", path_params: [board_id, item_id], description: "Delete an item from a board" }
    - { id: sticky_notes.create, method: POST, path: "/boards/{board_id}/sticky_notes", path_params: [board_id], body_params: [data, style, position, geometry, parent], description: "Add a sticky note to a board" }
    - { id: sticky_notes.update, method: PATCH, path: "/boards/{board_id}/sticky_notes/{item_id}", path_params: [board_id, item_id], body_params: [data, style, position, geometry, parent], description: "Edit a sticky note" }
    - { id: shapes.create, method: POST, path: "/boards/{board_id}/shapes", path_params: [board_id], body_params: [data, style, position, geometry, parent], description: "Add a shape to a board" }
    - { id: cards.create, method: POST, path: "/boards/{board_id}/cards", path_params: [board_id], body_params: [data, style, position, geometry, parent], description: "Add a card to a board" }
    - { id: frames.create, method: POST, path: "/boards/{board_id}/frames", path_params: [board_id], body_params: [data, style, position, geometry], description: "Add a frame to a board" }
    - { id: connectors.create, method: POST, path: "/boards/{board_id}/connectors", path_params: [board_id], body_params: [startItem, endItem, shape, captions, style], description: "Connect two items on a board with a line" }
    - { id: members.list, method: GET, path: "/boards/{board_id}/members", path_params: [board_id], query_params: [limit, offset], description: "List a board's members" }
    - { id: members.share, method: POST, path: "/boards/{board_id}/members", path_params: [board_id], body_params: [emails, role, message], action: send, risk: high, requires_approval: true, description: "Share a board by emailing an invitation to people" }

- id: todoist
  name: "Todoist"
  vertical: productivity
  description: "Read and filter tasks, projects, sections, comments and labels, and create, edit, complete or delete tasks with an approval."
