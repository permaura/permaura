    - { id: fields.list, method: GET, path: "/meta/fields", description: "List the employee fields available in this account" }
    - { id: time_off.requests_list, method: GET, path: "/time-off/requests", query_params: [filter, orderBy, page, pageSize, returnActions], description: "List time off requests, with an OData filter" }
    - { id: time_off.requests_read, method: GET, path: "/time-off/requests/{id}", path_params: [id], query_params: [returnActions], description: "Read one time off request" }
    - { id: time_off.whos_out, method: GET, path: "/whos-out", query_params: [start, end, filter, directReportsOnly, includePersons, page, pageSize], description: "List approved time off in a date range; start and end are required" }
