- id: google-tasks
  name: "Google Tasks"
  vertical: productivity
  description: "Read task lists and tasks, and create, edit, move or delete them with an approval."
  base_url: "https://tasks.googleapis.com/tasks/v1"
  logo: googletasks
  brand_color: "#2684FC"
  auth: { scheme: bearer }
  credential:
    label: "Your own OAuth app"
    url: "https://console.cloud.google.com/auth/clients"
    hint: "In Google Cloud, enable the Google Tasks API, then create a Web application client under Google Auth platform, Clients, using the redirect URL the console shows."
    oauth_only: true
  oauth:
    authorize_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/tasks"]
    pkce: true
  capabilities:
    - { id: tasklists.list, method: GET, path: "/users/@me/lists", query_params: [maxResults, pageToken], description: "List the account's task lists" }
    - { id: tasklists.read, method: GET, path: "/users/@me/lists/{tasklist}", path_params: [tasklist], description: "Read one task list; @default names the account's default list" }
    - { id: tasks.list, method: GET, path: "/lists/{tasklist}/tasks", path_params: [tasklist], query_params: [maxResults, pageToken, dueMin, dueMax, completedMin, completedMax, updatedMin, showCompleted, showDeleted, showHidden, showAssigned], description: "List tasks in a list, filtered by due, completed or updated dates" }
    - { id: tasks.read, method: GET, path: "/lists/{tasklist}/tasks/{task}", path_params: [tasklist, task], description: "Read one task" }
    - { id: tasklists.create, method: POST, path: "/users/@me/lists", body_params: [title], description: "Create a task list" }
    - { id: tasklists.update, method: PATCH, path: "/users/@me/lists/{tasklist}", path_params: [tasklist], body_params: [title], description: "Rename a task list" }
    - { id: tasks.create, method: POST, path: "/lists/{tasklist}/tasks", path_params: [tasklist], query_params: [parent, previous], body_params: [title, notes, due, status], description: "Create a task, optionally under a parent task or after a sibling" }
    - { id: tasks.update, method: PATCH, path: "/lists/{tasklist}/tasks/{task}", path_params: [tasklist, task], body_params: [title, notes, due, status, completed], description: "Edit a task or mark it completed by setting status" }
    - { id: tasks.move, method: POST, path: "/lists/{tasklist}/tasks/{task}/move", path_params: [tasklist, task], query_params: [parent, previous, destinationTasklist], action: update, description: "Move a task under another parent, after a sibling, or to another list" }
    - { id: tasks.clear, method: POST, path: "/lists/{tasklist}/clear", path_params: [tasklist], action: update, description: "Hide every completed task in a list" }
    - { id: tasks.delete, method: DELETE, path: "/lists/{tasklist}/tasks/{task}", path_params: [tasklist, task], description: "Delete a task; an assigned task is also deleted from its Docs or Chat source" }
    - { id: tasklists.delete, method: DELETE, path: "/users/@me/lists/{tasklist}", path_params: [tasklist], description: "Delete a task list, also deleting assigned tasks from their Docs or Chat source; the default list cannot be deleted" }

