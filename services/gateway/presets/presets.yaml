    - { id: employees.list, method: GET, path: "/employees", query_params: ["filter[ids]", "filter[status]", "filter[firstName]", "filter[lastName]", "filter[workEmail]", "filter[departmentName]", "filter[locationName]", "filter[jobTitleName]", "filter[reportsToId]", sort, fields, "page[limit]", "page[after]", "page[before]"], description: "List employees, filtered by id, status, name, department, location or manager" }
