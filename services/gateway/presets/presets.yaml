    - { id: lists.list, method: GET, path: "/contacts/lists", query_params: [limit, offset, sort], description: "List contact lists" }
    - { id: lists.contacts, method: GET, path: "/contacts/lists/{listId}/contacts", path_params: [listId], query_params: [modifiedSince, limit, offset, sort], description: "List the contacts in a list" }
