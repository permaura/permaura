- id: microsoft-ads
  name: Microsoft Advertising
  vertical: marketing
  description: "Read the campaigns, ad groups, ads, keywords, budgets and conversion goals of one Microsoft Advertising account, with every change that can start or alter spend held behind an approval."
  base_url: "https://campaign.api.bingads.microsoft.com/CampaignManagement/v13"
  logo: microsoft
  brand_color: "#0078D4"
  auth: { scheme: bearer }
  # The REST API names the developer token, the manager account and the ad account in headers on every call; all three are per connection.
  connection_headers:
    - { name: DeveloperToken, label: Developer token, required: true, description: "From Microsoft Advertising's developer settings. It identifies your API access; the accounts themselves are authorized by the Microsoft sign-in." }
    - { name: CustomerId, label: Customer id, required: true, description: "The manager account (customer) id: the cid value in the Microsoft Advertising URL." }
    - { name: CustomerAccountId, label: Account id, required: true, description: "The ad account id: the aid value in the Microsoft Advertising URL. Not the eight-character account number." }
  oauth:
    authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    scopes: ["https://ads.microsoft.com/msads.manage", "offline_access"]
    pkce: true
    authorize_params: { prompt: select_account }
  capabilities:
    - { id: campaigns.list, method: POST, path: "/Campaigns/QueryByAccountId", body_params: [AccountId, CampaignType, ReturnAdditionalFields], action: read, risk: medium, description: "List an account's campaigns; CampaignType widens it beyond Search (a read sent as a POST)" }
    - { id: campaigns.read, method: POST, path: "/Campaigns/QueryByIds", body_params: [AccountId, CampaignIds, CampaignType, ReturnAdditionalFields], action: read, risk: medium, description: "Read campaigns by id (a read sent as a POST)" }
    - { id: ad_groups.list, method: POST, path: "/AdGroups/QueryByCampaignId", body_params: [CampaignId, ReturnAdditionalFields], action: read, risk: medium, description: "List a campaign's ad groups (a read sent as a POST)" }
    - { id: ad_groups.read, method: POST, path: "/AdGroups/QueryByIds", body_params: [CampaignId, AdGroupIds, ReturnAdditionalFields], action: read, risk: medium, description: "Read ad groups by id (a read sent as a POST)" }
    - { id: ads.list, method: POST, path: "/Ads/QueryByAdGroupId", body_params: [AdGroupId, AdTypes, ReturnAdditionalFields], action: read, risk: medium, description: "List an ad group's ads of the given types (a read sent as a POST)" }
    - { id: ads.read, method: POST, path: "/Ads/QueryByIds", body_params: [AdGroupId, AdIds, AdTypes, ReturnAdditionalFields], action: read, risk: medium, description: "Read ads by id (a read sent as a POST)" }
    - { id: keywords.list, method: POST, path: "/Keywords/QueryByAdGroupId", body_params: [AdGroupId, ReturnAdditionalFields], action: read, risk: medium, description: "List an ad group's keywords with their bids and match types (a read sent as a POST)" }
    - { id: budgets.list, method: POST, path: "/Budgets/QueryByAccountId", body_params: [AccountId], action: read, risk: medium, description: "List an account's shared budgets (a read sent as a POST)" }
    - { id: campaign_criteria.list, method: POST, path: "/CampaignCriterions/QueryByIds", body_params: [CampaignId, CampaignCriterionIds, CriterionType, ReturnAdditionalFields], action: read, risk: medium, description: "List a campaign's targeting criteria such as locations, ages and devices (a read sent as a POST)" }
    - { id: ad_group_criteria.list, method: POST, path: "/AdGroupCriterions/QueryByIds", body_params: [AdGroupId, AdGroupCriterionIds, CriterionType, ReturnAdditionalFields], action: read, risk: medium, description: "List an ad group's targeting criteria (a read sent as a POST)" }
    - { id: conversion_goals.list, method: POST, path: "/ConversionGoals/QueryByIds", body_params: [ConversionGoalIds, ConversionGoalTypes, ReturnAdditionalFields], action: read, risk: medium, description: "List the account's conversion goals (a read sent as a POST)" }
    - { id: campaigns.create, method: POST, path: "/Campaigns", body_params: [AccountId, Campaigns], action: create, risk: high, requires_approval: true, description: "Create campaigns with their budgets and bid strategies" }
    - { id: campaigns.update, method: PUT, path: "/Campaigns", body_params: [AccountId, Campaigns], action: update, risk: high, requires_approval: true, description: "Update campaigns, including pausing or activating them and changing budgets" }
    - { id: ad_groups.create, method: POST, path: "/AdGroups", body_params: [CampaignId, AdGroups], action: create, risk: high, requires_approval: true, description: "Create ad groups with their bids" }
    - { id: ad_groups.update, method: PUT, path: "/AdGroups", body_params: [CampaignId, AdGroups], action: update, risk: high, requires_approval: true, description: "Update ad groups, including pausing or activating them and changing bids" }
    - { id: ads.create, method: POST, path: "/Ads", body_params: [AdGroupId, Ads], action: create, risk: high, requires_approval: true, description: "Create ads in an ad group" }
    - { id: ads.update, method: PUT, path: "/Ads", body_params: [AdGroupId, Ads], action: update, risk: high, requires_approval: true, description: "Update ads, including pausing or activating them" }
    - { id: keywords.create, method: POST, path: "/Keywords", body_params: [AdGroupId, Keywords], action: create, risk: high, requires_approval: true, description: "Add keywords with their bids and match types" }
    - { id: keywords.update, method: PUT, path: "/Keywords", body_params: [AdGroupId, Keywords], action: update, risk: high, requires_approval: true, description: "Update keywords, including their bids and status" }
    - { id: budgets.create, method: POST, path: "/Budgets", body_params: [Budgets], action: create, risk: high, requires_approval: true, description: "Create shared budgets" }
    - { id: budgets.update, method: PUT, path: "/Budgets", body_params: [Budgets], action: update, risk: high, requires_approval: true, description: "Change shared budgets" }

- id: microsoft-ads-reporting
  name: Microsoft Advertising Reporting
  vertical: marketing
  description: "Request and poll performance reports for a Microsoft Advertising account. The Reporting API lives on its own host, so it is a second connection beside Microsoft Advertising."
  base_url: "https://reporting.api.bingads.microsoft.com/Reporting/v13"
  logo: microsoft
  brand_color: "#0078D4"
  auth: { scheme: bearer }
  connection_headers:
    - { name: DeveloperToken, label: Developer token, required: true, description: "From Microsoft Advertising's developer settings. It identifies your API access; the accounts themselves are authorized by the Microsoft sign-in." }
    - { name: CustomerId, label: Customer id, required: true, description: "The manager account (customer) id: the cid value in the Microsoft Advertising URL." }
    - { name: CustomerAccountId, label: Account id, required: true, description: "The ad account id: the aid value in the Microsoft Advertising URL. Not the eight-character account number." }
  oauth:
    authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    scopes: ["https://ads.microsoft.com/msads.manage", "offline_access"]
    pkce: true
    authorize_params: { prompt: select_account }
  capabilities:
    - { id: reports.submit, method: POST, path: "/GenerateReport/Submit", body_params: [ReportRequest], action: read, risk: medium, description: "Request a performance report such as CampaignPerformanceReportRequest; the answer is a report request id (a read sent as a POST)" }
    - { id: reports.poll, method: POST, path: "/GenerateReport/Poll", body_params: [ReportRequestId], action: read, risk: medium, description: "Poll a requested report; when its status is Success the answer carries the download URL (a read sent as a POST)" }
