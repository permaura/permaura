    - { id: applications.statuses, method: GET, path: "/applicant_tracking/statuses", description: "List the applicant statuses configured for the company" }
    - { id: employees.create, method: POST, path: "/employees", body_params: [firstName, lastName, workEmail, jobTitle, department, hireDate], description: "Create an employee" }
    - { id: employees.update, method: POST, path: "/employees/{id}", path_params: [id], body_params: [firstName, lastName, workEmail, workPhone, jobTitle, department, division, location, hireDate], action: update, description: "Update an employee's name, work contact or job fields; pay and personal fields cannot be set" }
    - { id: time_off.requests_create, method: POST, path: "/time-off/requests", query_params: [returnActions], body_params: [employeeId, categoryId, startDate, endDate, employeeNote, amount, dailyAmounts], description: "Create a time off request for an employee" }
    - { id: time_off.requests_approve, method: POST, path: "/time-off/requests/{id}/approvals", path_params: [id], query_params: [returnActions], body_params: [managerNote], description: "Approve a time off request, completing the caller's step in the approval chain" }
    - { id: time_off.requests_deny, method: POST, path: "/time-off/requests/{id}/denials", path_params: [id], query_params: [returnActions], body_params: [managerNote], description: "Deny a time off request" }
    - { id: applications.set_status, method: POST, path: "/applicant_tracking/applications/{applicationId}/status", path_params: [applicationId], body_params: [status], action: update, description: "Change an application's status" }
    - { id: applications.comment, method: POST, path: "/applicant_tracking/applications/{applicationId}/comments", path_params: [applicationId], body_params: [type, comment], action: send, risk: high, requires_approval: true, description: "Add a comment to an application" }

