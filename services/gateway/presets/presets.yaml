  redact_fields: [email, fullName, firstName, lastName, userName, signerName, signerEmail, phoneNumber, faxNumber, ipAddress, accessCode, clientUserId]
  oauth:
    authorize_url: "https://account-d.docusign.com/oauth/auth"
    token_url: "https://account-d.docusign.com/oauth/token"
    scopes: [signature, extended]
    pkce: true
  capabilities:
    - { id: envelopes.list, method: GET, path: "/v2.1/accounts/{accountId}/envelopes", path_params: [accountId], query_params: [from_date, to_date, status, search_text, count, start_position], description: List envelopes changed in a date range }
    - { id: envelopes.read, method: GET, path: "/v2.1/accounts/{accountId}/envelopes/{envelopeId}", path_params: [accountId, envelopeId], query_params: [include], description: Read the status of one envelope }
    - { id: recipients.list, method: GET, path: "/v2.1/accounts/{accountId}/envelopes/{envelopeId}/recipients", path_params: [accountId, envelopeId], query_params: [include_tabs, include_extended], description: List an envelope's recipients and their status }
    - { id: documents.list, method: GET, path: "/v2.1/accounts/{accountId}/envelopes/{envelopeId}/documents", path_params: [accountId, envelopeId], query_params: [include_metadata], description: List the documents in an envelope }
    - { id: documents.download, method: GET, path: "/v2.1/accounts/{accountId}/envelopes/{envelopeId}/documents/{documentId}", path_params: [accountId, envelopeId, documentId], query_params: [certificate, watermark, show_changes], description: Download one document as PDF }
    - { id: templates.list, method: GET, path: "/v2.1/accounts/{accountId}/templates", path_params: [accountId], query_params: [search_text, order_by, count, start_position], description: List templates }
    - { id: templates.read, method: GET, path: "/v2.1/accounts/{accountId}/templates/{templateId}", path_params: [accountId, templateId], query_params: [include], description: Read one template }
    - { id: audit_events.list, method: GET, path: "/v2.1/accounts/{accountId}/envelopes/{envelopeId}/audit_events", path_params: [accountId, envelopeId], query_params: [locale], description: Read an envelope's audit trail }
    - { id: envelopes.send, method: POST, path: "/v2.1/accounts/{accountId}/envelopes", path_params: [accountId], body_params: [status, emailSubject, emailBlurb, documents, recipients, templateId, templateRoles], action: send, risk: high, requires_approval: true, description: Create an envelope and email it to its recipients }

- id: google-analytics
  name: Google Analytics
  label: Data API (OAuth only)
  vertical: data
  description: "Run GA4 reports, realtime reports and metadata queries on a property."
  base_url: "https://analyticsdata.googleapis.com/v1beta"
  logo: googleanalytics
  brand_color: "#E37400"
  auth: { scheme: bearer }
  oauth:
    authorize_url: "https://accounts.google.com/o/oauth2/v2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    scopes: ["https://www.googleapis.com/auth/analytics.readonly"]
    pkce: true
  capabilities:
    - { id: reports.run, method: POST, path: "/properties/{property}:runReport", path_params: [property], body_params: [dimensions, metrics, dateRanges, dimensionFilter, metricFilter, orderBys, limit, offset, metricAggregations, returnPropertyQuota], action: read, risk: medium, description: Run a GA4 report }
    - { id: reports.batch_run, method: POST, path: "/properties/{property}:batchRunReports", path_params: [property], body_params: [requests], action: read, risk: medium, description: Run up to five reports in one call }
    - { id: reports.run_pivot, method: POST, path: "/properties/{property}:runPivotReport", path_params: [property], body_params: [dimensions, metrics, dateRanges, pivots, dimensionFilter, metricFilter, returnPropertyQuota], action: read, risk: medium, description: Run a pivot report }
    - { id: realtime.run, method: POST, path: "/properties/{property}:runRealtimeReport", path_params: [property], body_params: [dimensions, metrics, minuteRanges, dimensionFilter, metricAggregations, orderBys, limit, returnPropertyQuota], action: read, risk: medium, description: Run a realtime report (last 30 minutes) }
    - { id: compatibility.check, method: POST, path: "/properties/{property}:checkCompatibility", path_params: [property], body_params: [dimensions, metrics, dimensionFilter, metricFilter, compatibilityFilter], action: read, risk: medium, description: Check which dimensions and metrics can be combined }
    - { id: metadata.read, method: GET, path: "/properties/{property}/metadata", path_params: [property], description: List the dimensions and metrics the property supports }
    - { id: audience_exports.list, method: GET, path: "/properties/{property}/audienceExports", path_params: [property], query_params: [pageSize, pageToken], action: list, risk: medium, description: List audience export jobs (metadata only) }
    - { id: audience_exports.create, method: POST, path: "/properties/{property}/audienceExports", path_params: [property], body_params: [audience, dimensions], description: Start an audience export job (charges quota tokens) }
    - { id: audience_exports.query, method: POST, path: "/properties/{property}/audienceExports/{audience_export}:query", path_params: [property, audience_export], body_params: [offset, limit], action: export, risk: high, requires_approval: true, description: Read the user-level rows of a finished audience export }

- id: google-ads
  name: Google Ads
  vertical: marketing
  description: "Query campaigns, ad groups, ads, keywords, budgets and performance with GAQL, with every change that can start or alter spend held behind an approval."
  base_url: "https://googleads.googleapis.com/v26"
  logo: googleads
  brand_color: "#4285F4"
  auth: { scheme: bearer }
  redact_fields: [email_address, inviter_user_email_address]
  # Every call needs the developer token from the manager account's API Center, and a call made through a manager account names it in login-customer-id. Both are per connection, so each is asked for when the connection is made.
  connection_headers:
    - { name: developer-token, label: Developer token, required: true, description: "From the API Center of your Google Ads manager account. It identifies your API access; the account itself is authorized by the OAuth sign-in." }
    - { name: login-customer-id, label: Login customer id, required: false, description: "The manager account id, digits only, when the signed-in user reaches the ad account through a manager account. Leave empty when the user owns the ad account directly." }
  oauth:
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes: ["https://www.googleapis.com/auth/adwords"]
    pkce: true
  capabilities:
    - { id: customers.accessible, method: GET, path: "/customers:listAccessibleCustomers", description: List the customer ids the signed-in user can reach directly }
    - { id: search, method: POST, path: "/customers/{customer_id}/googleAds:search", path_params: [customer_id], body_params: [query, pageToken, validateOnly, searchSettings], action: read, risk: medium, description: "Run a GAQL query over campaigns, ad groups, ads, keywords, budgets, change history or metrics, one page at a time (a read sent as a POST)" }
    - { id: search_stream, method: POST, path: "/customers/{customer_id}/googleAds:searchStream", path_params: [customer_id], body_params: [query, summaryRowSetting], action: read, risk: medium, description: "Run a GAQL query and return every matching row in one response (a read sent as a POST)" }
    - { id: keyword_ideas.generate, method: POST, path: "/customers/{customer_id}:generateKeywordIdeas", path_params: [customer_id], body_params: [language, geoTargetConstants, keywordPlanNetwork, keywordSeed, urlSeed, keywordAndUrlSeed, siteSeed, includeAdultKeywords, keywordAnnotation, aggregateMetricOptions, historicalMetricsOptions, pageSize, pageToken], action: read, risk: medium, description: "Generate keyword ideas with search volume and competition from seed keywords or a URL (a read sent as a POST)" }
    - { id: campaign_budgets.mutate, method: POST, path: "/customers/{customer_id}/campaignBudgets:mutate", path_params: [customer_id], body_params: [operations, partialFailure, validateOnly, responseContentType], action: update, risk: high, requires_approval: true, description: "Create, change or remove campaign budgets" }
    - { id: campaigns.mutate, method: POST, path: "/customers/{customer_id}/campaigns:mutate", path_params: [customer_id], body_params: [operations, partialFailure, validateOnly, responseContentType], action: update, risk: high, requires_approval: true, description: "Create, change, pause, enable or remove campaigns" }
    - { id: ad_groups.mutate, method: POST, path: "/customers/{customer_id}/adGroups:mutate", path_params: [customer_id], body_params: [operations, partialFailure, validateOnly, responseContentType], action: update, risk: high, requires_approval: true, description: "Create, change, pause, enable or remove ad groups, including their bids" }
    - { id: ad_group_ads.mutate, method: POST, path: "/customers/{customer_id}/adGroupAds:mutate", path_params: [customer_id], body_params: [operations, partialFailure, validateOnly, responseContentType], action: update, risk: high, requires_approval: true, description: "Create, change, pause, enable or remove ads" }
    - { id: ad_group_criteria.mutate, method: POST, path: "/customers/{customer_id}/adGroupCriteria:mutate", path_params: [customer_id], body_params: [operations, partialFailure, validateOnly, responseContentType], action: update, risk: high, requires_approval: true, description: "Create, change or remove keywords and other ad group targeting" }
    - { id: campaign_criteria.mutate, method: POST, path: "/customers/{customer_id}/campaignCriteria:mutate", path_params: [customer_id], body_params: [operations, partialFailure, validateOnly, responseContentType], action: update, risk: high, requires_approval: true, description: "Create, change or remove campaign targeting such as locations, languages and negative keywords" }
    - { id: mutate, method: POST, path: "/customers/{customer_id}/googleAds:mutate", path_params: [customer_id], body_params: [mutateOperations, partialFailure, validateOnly, responseContentType], action: update, risk: critical, requires_approval: true, description: "Apply a batch of operations across any resource types in one call" }

