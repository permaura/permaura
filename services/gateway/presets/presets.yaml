    - { id: chat_messages.list, method: GET, path: "/chats/{chat_id}/messages", path_params: [chat_id], query_params: ["$top", "$orderby", "$filter", "$skiptoken"], description: "List messages in a chat, at most 50 a page" }
    - { id: chat_messages.read, method: GET, path: "/chats/{chat_id}/messages/{message_id}", path_params: [chat_id, message_id], description: "Read a chat message" }
    - { id: meetings.read, method: GET, path: "/me/onlineMeetings/{meeting_id}", path_params: [meeting_id], description: "Read an online meeting organized by the signed-in user" }
