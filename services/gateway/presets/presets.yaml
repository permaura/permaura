  logo: zoom
  brand_color: "#0B5CFF"
  auth: { scheme: bearer }
  redact_fields: [start_url, password, encrypted_password, h323_password, pstn_password, download_access_token, recording_play_passcode, personal_meeting_url, phone_number, phone_numbers, dynamic_host_key, phone, address]
