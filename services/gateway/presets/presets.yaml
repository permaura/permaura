- id: airtable
  name: "Airtable"
  vertical: data
  description: "Read and filter bases, tables, records and comments, and create, edit or delete records and add comments with an approval."
  base_url: "https://api.airtable.com/v0"
  logo: airtable
  brand_color: "#18BFFF"
