    - { id: campaigns.read, method: GET, path: "/emailCampaigns/{campaignId}", path_params: [campaignId], query_params: [statistics, excludeHtmlContent], description: "Read an email campaign and its report" }
    - { id: templates.list, method: GET, path: "/smtp/templates", query_params: [templateStatus, limit, offset, sort], description: "List email templates" }
    - { id: emails.events, method: GET, path: "/smtp/statistics/events", query_params: [limit, offset, startDate, endDate, days, email, event, tags, messageId, templateId, sort], description: "List transactional email events such as delivered, bounced or opened" }
    - { id: emails.send, method: POST, path: "/smtp/email", body_params: [sender, to, cc, bcc, replyTo, subject, htmlContent, textContent, templateId, params, tags, headers, attachment, messageVersions, scheduledAt, batchId], action: send, requires_approval: true, description: "Send a transactional email now or at a set time" }
    - { id: campaigns.create, method: POST, path: "/emailCampaigns", body_params: [name, subject, sender, htmlContent, htmlUrl, templateId, recipients, replyTo, previewText, tag, toField, params], description: "Create a draft email campaign; sending is a separate step" }
    - { id: campaigns.send_now, method: POST, path: "/emailCampaigns/{campaignId}/sendNow", path_params: [campaignId], action: send, requires_approval: true, description: "Send an email campaign to its recipients now" }
    - { id: contacts.create, method: POST, path: "/contacts", body_params: [email, ext_id, attributes, listIds, emailBlacklisted, smsBlacklisted, updateEnabled], description: "Create or update a contact" }
    - { id: contacts.update, method: PUT, path: "/contacts/{identifier}", path_params: [identifier], query_params: [identifierType], body_params: [ext_id, attributes, listIds, unlinkListIds, emailBlacklisted, smsBlacklisted], description: "Update a contact" }
    - { id: lists.add_contacts, method: POST, path: "/contacts/lists/{listId}/contacts/add", path_params: [listId], body_params: [emails, ids, extIds], description: "Add existing contacts to a list" }
    - { id: contacts.delete, method: DELETE, path: "/contacts/{identifier}", path_params: [identifier], query_params: [identifierType], description: "Delete a contact" }

- id: webflow
  name: "Webflow"
  vertical: design
  description: "Read sites, pages, CMS items, forms, submissions and orders, and edit content, publish or refund with an approval."
  base_url: "https://api.webflow.com/v2"
  logo: webflow
  brand_color: "#146EF5"
  auth: { scheme: bearer }
  redact_fields: [allAddresses, shippingAddress, billingAddress, stripeCard, stripeDetails, paypalDetails]
  credential:
    label: "Site API token"
    url: "https://developers.webflow.com/data/reference/authentication/site-token"
    hint: "In Site settings open Apps & integrations, then API access, and generate a token. A site administrator must do it. Pick read scopes, and add write scopes for anything you will switch on."
  capabilities:
    - { id: sites.list, method: GET, path: "/sites", description: "List the sites the token can reach" }
    - { id: pages.list, method: GET, path: "/sites/{site_id}/pages", path_params: [site_id], query_params: [localeId, limit, offset], description: "List a site's pages" }
    - { id: pages.update, method: PUT, path: "/pages/{page_id}", path_params: [page_id], query_params: [localeId], body_params: [title, slug, seo, openGraph], description: "Update a page's title, slug, SEO and Open Graph metadata" }
    - { id: collections.list, method: GET, path: "/sites/{site_id}/collections", path_params: [site_id], description: "List a site's CMS collections" }
    - { id: collections.read, method: GET, path: "/collections/{collection_id}", path_params: [collection_id], description: "Read a CMS collection and its fields" }
    - { id: items.list, method: GET, path: "/collections/{collection_id}/items", path_params: [collection_id], query_params: [cmsLocaleId, offset, limit, name, slug, createdOn, lastPublished, lastUpdated, filter, sortBy, sortOrder, sort], description: "List or filter a collection's staged items" }
    - { id: items.read, method: GET, path: "/collections/{collection_id}/items/{item_id}", path_params: [collection_id, item_id], query_params: [cmsLocaleId], description: "Read a staged CMS item" }
    - { id: items.create, method: POST, path: "/collections/{collection_id}/items", path_params: [collection_id], query_params: [skipInvalidFiles], body_params: [cmsLocaleId, isArchived, isDraft, fieldData, items], description: "Create one staged CMS item, or several through items" }
    - { id: items.update, method: PATCH, path: "/collections/{collection_id}/items/{item_id}", path_params: [collection_id, item_id], query_params: [skipInvalidFiles], body_params: [cmsLocaleId, isArchived, isDraft, fieldData], description: "Update a staged CMS item" }
    - { id: items.publish, method: POST, path: "/collections/{collection_id}/items/publish", path_params: [collection_id], body_params: [itemIds, items], action: send, risk: high, requires_approval: true, description: "Publish staged CMS items to the live site" }
    - { id: items.delete, method: DELETE, path: "/collections/{collection_id}/items/{item_id}", path_params: [collection_id, item_id], query_params: [cmsLocaleId], description: "Delete a CMS item" }
    - { id: sites.publish, method: POST, path: "/sites/{site_id}/publish", path_params: [site_id], body_params: [customDomains, publishToWebflowSubdomain], action: send, risk: high, requires_approval: true, description: "Publish a site to its domains; Webflow allows one publish per minute" }
    - { id: forms.list, method: GET, path: "/sites/{site_id}/forms", path_params: [site_id], query_params: [limit, offset], description: "List a site's forms" }
    - { id: form_submissions.list, method: GET, path: "/forms/{form_id}/submissions", path_params: [form_id], query_params: [offset, limit], description: "List the submissions to a form" }
    - { id: orders.list, method: GET, path: "/sites/{site_id}/orders", path_params: [site_id], query_params: [status, offset, limit], description: "List a store's orders" }
    - { id: orders.refund, method: POST, path: "/sites/{site_id}/orders/{order_id}/refund", path_params: [site_id, order_id], body_params: [reason], action: refund, risk: critical, requires_approval: true, description: "Refund an order by reversing its Stripe charge" }

- id: wix
  name: "Wix"
  vertical: commerce
  description: "Read products, orders, contacts, CMS items and blog posts, and edit content, publish, cancel or refund orders with an approval."
  base_url: "https://www.wixapis.com"
  logo: wix
  brand_color: "#0C6EFC"
  auth: { scheme: raw, header: Authorization, prefix: "" }
  connection_headers:
    - { name: wix-site-id, label: "Site ID", required: true, description: "The ID after /dashboard/ in the address of your site's dashboard." }
  redact_fields: [phone, phones, address, addresses, birthdate, vatId, primaryPhone]
  credential:
    label: "API key"
    url: "https://manage.wix.com/account/api-keys"
    hint: "In the API Keys Manager create a key for this site with Wix Stores, eCommerce, Contacts, CMS and Blog permissions. Account owners and co-owners can create keys."
  capabilities:
    - { id: catalog.version, method: GET, path: "/stores/v3/provision/version", description: "Read whether the store runs catalog V1 or V3; the product calls here need V3" }
    - { id: products.query, method: POST, path: "/stores/v3/products/query", body_params: [query, fields], action: list, risk: medium, description: "List up to 100 catalog V3 products with filters, sorting and cursor paging" }
    - { id: products.read, method: GET, path: "/stores/v3/products/{product_id}", path_params: [product_id], query_params: [fields], description: "Read a catalog V3 product" }
    - { id: products.update, method: PATCH, path: "/stores/v3/products/{product_id}", path_params: [product_id], body_params: [product, fields], description: "Update a catalog V3 product; product.revision is required" }
    - { id: orders.search, method: POST, path: "/ecom/v1/orders/search", body_params: [search], action: search, risk: medium, description: "Search orders with filters, sorting and paging" }
    - { id: orders.read, method: GET, path: "/ecom/v1/orders/{id}", path_params: [id], description: "Read an order" }
    - { id: orders.cancel, method: POST, path: "/ecom/v1/orders/{id}/cancel", path_params: [id], body_params: [customMessage, restockAllItems, sendOrderCanceledEmail], action: send, risk: high, requires_approval: true, description: "Cancel an order, optionally restocking items and emailing the buyer" }
    - { id: orders.refund, method: POST, path: "/ecom/v1/order-billing/refund-payments", body_params: [orderId, paymentRefunds, refundItems, customerReason, sideEffects], action: refund, risk: critical, requires_approval: true, description: "Refund an order's payments through the payment provider" }
    - { id: contacts.query, method: POST, path: "/contacts/v4/contacts/query", body_params: [query, search], action: search, risk: medium, description: "List or search the site's contacts" }
    - { id: contacts.create, method: POST, path: "/contacts/v4/contacts", body_params: [info, allowDuplicates], description: "Create a contact" }
    - { id: data_items.query, method: POST, path: "/wix-data/v2/items/query", body_params: [dataCollectionId, query, returnTotalCount, includeReferences, language], action: list, risk: medium, description: "Query the items in a CMS collection; dataCollectionId is required" }
    - { id: data_items.insert, method: POST, path: "/wix-data/v2/items", body_params: [dataCollectionId, dataItem], description: "Add an item to a CMS collection" }
    - { id: data_items.delete, method: DELETE, path: "/wix-data/v2/items/{data_item_id}", path_params: [data_item_id], query_params: [dataCollectionId], description: "Delete an item from a CMS collection" }
    - { id: posts.list, method: GET, path: "/v3/posts", query_params: [categoryIds, featured, fieldsets, hashtags, language, memberId, paging.cursor, paging.limit, paging.offset, sort, tagIds], description: "List up to 100 published blog posts" }
    - { id: draft_posts.create, method: POST, path: "/blog/v3/draft-posts", body_params: [draftPost, fieldsets], description: "Create a blog draft without publishing it" }
    - { id: draft_posts.publish, method: POST, path: "/blog/v3/draft-posts/{draft_post_id}/publish", path_params: [draft_post_id], action: send, risk: high, requires_approval: true, description: "Publish a blog draft to the live site" }

- id: canva
  name: "Canva"
  vertical: design
  description: "Read designs, folders and assets and check jobs, and create designs, start exports, upload assets or change folders with an approval."
  base_url: "https://api.canva.com/rest/v1"
  logo: canva
  brand_color: "#00C4CC"
  auth: { scheme: bearer }
  credential:
    label: "Your own OAuth app"
    url: "https://www.canva.com/developers/apps"
    hint: "In the Canva Developer Portal create an app, open Outside Canva, turn on the REST APIs, generate a client secret, select the scopes and add the console's redirect URL."
    oauth_only: true
  oauth:
    authorize_url: "https://www.canva.com/api/oauth/authorize"
    token_url: "https://api.canva.com/rest/v1/oauth/token"
    scopes: ["design:meta:read", "design:content:read", "design:content:write", "folder:read", "folder:write", "asset:read", "asset:write"]
    pkce: true
    token_auth: basic
  capabilities:
    - { id: users.me, method: GET, path: "/users/me", description: "Read the connected user's id and team id" }
    - { id: designs.list, method: GET, path: "/designs", query_params: [query, continuation, ownership, sort_by, limit], description: "List and search the user's designs" }
    - { id: designs.read, method: GET, path: "/designs/{designId}", path_params: [designId], description: "Read a design's metadata" }
    - { id: designs.list_formats, method: GET, path: "/designs/{designId}/export-formats", path_params: [designId], description: "List the file formats a design can be downloaded in" }
    - { id: designs.create, method: POST, path: "/designs", body_params: [type, design_type, asset_id, title], description: "Create a design from a preset type or custom size, optionally with an image asset" }
    - { id: exports.create, method: POST, path: "/exports", body_params: [design_id, format], description: "Start an export job for a design, which yields download links valid for 24 hours" }
    - { id: exports.read, method: GET, path: "/exports/{exportId}", path_params: [exportId], action: read, risk: medium, description: "Check an export job and get its download links" }
    - { id: folders.read, method: GET, path: "/folders/{folderId}", path_params: [folderId], description: "Read a folder's metadata" }
    - { id: folders.list_items, method: GET, path: "/folders/{folderId}/items", path_params: [folderId], query_params: [continuation, limit, item_types, sort_by, pin_status], description: "List the folders, designs and image assets in a folder" }
    - { id: folders.create, method: POST, path: "/folders", body_params: [name, parent_folder_id], description: "Create a folder; use the parent id root for the top level" }
    - { id: folders.move_item, method: POST, path: "/folders/move", body_params: [to_folder_id, item_id], action: update, description: "Move an item to another folder" }
    - { id: folders.delete, method: DELETE, path: "/folders/{folderId}", path_params: [folderId], description: "Delete a folder" }
    - { id: assets.read, method: GET, path: "/assets/{assetId}", path_params: [assetId], description: "Read an asset's metadata" }
    - { id: assets.upload_from_url, method: POST, path: "/url-asset-uploads", body_params: [name, url], description: "Start a job that uploads an asset to the user's library from a URL" }
    - { id: assets.upload_status, method: GET, path: "/url-asset-uploads/{jobId}", path_params: [jobId], description: "Check an asset upload job started from a URL" }
    - { id: assets.delete, method: DELETE, path: "/assets/{assetId}", path_params: [assetId], description: "Delete an asset" }

- id: miro
  name: "Miro"
  vertical: productivity
  description: "Read boards, items and members, and create or edit boards, sticky notes, shapes and other items with an approval."
