    - { id: jobs.list, method: GET, path: "/jobs", query_params: [cursor, per_page, ids, created_at, updated_at, fields, opened_at, closed_at, requisition_id, department_id, office_id, custom_field_option_id, confidential, status], description: "List jobs, filtered by status, department or office" }
    - { id: jobs.search, method: GET, path: "/jobs/search", query_params: [cursor, per_page, fields, search, status, department_id, office_id, external, user_id, user_role, job_custom_field_id, job_custom_field_answer_id, templates], action: search, description: "Search jobs by free text" }
    - { id: job_interview_stages.list, method: GET, path: "/job_interview_stages", query_params: [cursor, per_page, ids, created_at, updated_at, job_ids, fields, active], description: "List the interview stages of jobs" }
    - { id: interviews.list, method: GET, path: "/interviews", query_params: [cursor, per_page, ids, created_at, updated_at, job_ids, application_ids, job_interview_ids, organizer_ids, fields, starts_at, ends_at, all_day_start_on, all_day_end_on, external_event_id, status], description: "List scheduled interviews" }
    - { id: scorecards.list, method: GET, path: "/scorecards", query_params: [cursor, per_page, ids, created_at, updated_at, interview_kit_ids, submitter_ids, application_ids, interviewer_ids, fields, interviewed_at, submitted_at, status], description: "List interview scorecards" }
    - { id: notes.list, method: GET, path: "/notes", query_params: [cursor, per_page, ids, created_at, updated_at, candidate_ids, user_ids, application_ids, fields, type, visibility], description: "List notes and activity on candidates" }
    - { id: users.list, method: GET, path: "/users", query_params: [cursor, per_page, ids, created_at, updated_at, office_ids, department_ids, fields, deactivated, primary_email], description: "List Greenhouse users" }
    - { id: rejection_reasons.list, method: GET, path: "/rejection_reasons", query_params: [cursor, per_page, ids, created_at, updated_at, fields, include_defaults], description: "List rejection reasons, needed to reject an application" }
    - { id: offers.list, method: GET, path: "/offers", query_params: [cursor, per_page, ids, created_at, updated_at, application_ids, job_ids, candidate_ids, opening_ids, fields, current_only, custom_field_option_id, status, resolved_at, sent_on, starts_on], action: list, risk: high, description: "List offers, whose custom fields can hold compensation" }
    - { id: candidates.create, method: POST, path: "/candidates", body_params: [first_name, last_name, preferred_name, time_zone, company, title, can_email, phone_numbers, email_addresses, website_addresses, social_media_addresses, tags, custom_fields, application], description: "Create a candidate" }
    - { id: candidates.update, method: PATCH, path: "/candidates/{id}", path_params: [id], body_params: [first_name, last_name, preferred_name, time_zone, company, title, can_email, phone_numbers, email_addresses, website_addresses, social_media_addresses, tags, custom_fields], description: "Update a candidate" }
    - { id: notes.create, method: POST, path: "/notes", body_params: [candidate_id, body, subject, note_type, user_id, visibility, application_id], description: "Add a note or activity entry to a candidate; note_type is NOTE or ACTIVITY" }
    - { id: applications.create, method: POST, path: "/applications", body_params: [candidate_id, job_id, source_id, recruiter_id, coordinator_id, referrer_id, initial_stage_id, custom_fields], description: "Add a candidate to a job" }
