    - { id: captures.read, method: GET, path: "/v2/payments/captures/{capture_id}", path_params: [capture_id], description: "Read a captured payment" }
    - { id: refunds.read, method: GET, path: "/v2/payments/refunds/{refund_id}", path_params: [refund_id], description: "Read a refund" }
