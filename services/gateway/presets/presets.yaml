- id: firecrawl
  name: "Firecrawl"
  vertical: data
  description: "Scrape pages, search the web and map sites using plan credits, and start or cancel crawls, batch scrapes and agent runs with an approval."
  base_url: "https://api.firecrawl.dev/v2"
  logo: firecrawl
  auth: { scheme: bearer }
  credential:
    label: "API key"
    url: "https://www.firecrawl.dev/app/api-keys"
    hint: "Create a key under API Keys in the Firecrawl dashboard and paste it as is. It starts with fc-."
  capabilities:
    - { id: scrape.read, method: POST, path: "/scrape", body_params: [url, formats, onlyMainContent, includeTags, excludeTags, maxAge, waitFor, mobile, timeout, parsers, location, removeBase64Images, blockAds, proxy, storeInCache], action: search, risk: medium, description: "Scrape one URL into markdown or another format. Uses plan credits: 1 per page, more for JSON and other LLM formats." }
    - { id: search.web, method: POST, path: "/search", body_params: [query, limit, sources, categories, includeDomains, excludeDomains, tbs, location, country, safe, timeout, ignoreInvalidURLs, highlights], action: search, risk: medium, description: "Search the web and return links and snippets. Uses plan credits: 2 per 10 results." }
    - { id: map.site, method: POST, path: "/map", body_params: [url, search, sitemap, includeSubdomains, ignoreQueryParameters, ignoreCache, limit, timeout, location], action: search, risk: medium, description: "List the URLs on a site without scraping them. Uses plan credits: 1 per call." }
    - { id: crawl.start, method: POST, path: "/crawl", body_params: [url, prompt, excludePaths, includePaths, maxDiscoveryDepth, sitemap, ignoreQueryParameters, regexOnFullURL, limit, crawlEntireDomain, allowExternalLinks, allowSubdomains, delay, maxConcurrency, scrapeOptions], description: "Start a crawl of a site. Uses 1 plan credit per page and defaults to a limit of 10,000 pages, so set limit." }
    - { id: crawl.status, method: GET, path: "/crawl/{id}", path_params: [id], query_params: [skip], description: "Read a crawl's status and scraped pages. Pass skip from the next link to page through large results." }
    - { id: crawl.errors, method: GET, path: "/crawl/{id}/errors", path_params: [id], description: "List the failed pages and robots-blocked URLs of a crawl" }
    - { id: crawl.cancel, method: DELETE, path: "/crawl/{id}", path_params: [id], description: "Cancel a running crawl" }
    - { id: batch_scrape.start, method: POST, path: "/batch/scrape", body_params: [urls, maxConcurrency, ignoreInvalidURLs, formats, onlyMainContent, includeTags, excludeTags, maxAge, waitFor, mobile, timeout, parsers, location, removeBase64Images, blockAds, proxy, storeInCache], description: "Start a scrape of many URLs as one job. Uses plan credits for every page." }
    - { id: batch_scrape.status, method: GET, path: "/batch/scrape/{id}", path_params: [id], query_params: [skip], description: "Read a batch scrape's status and pages. Pass skip from the next link to page through large results." }
    - { id: batch_scrape.errors, method: GET, path: "/batch/scrape/{id}/errors", path_params: [id], description: "List the failed pages and robots-blocked URLs of a batch scrape" }
    - { id: batch_scrape.cancel, method: DELETE, path: "/batch/scrape/{id}", path_params: [id], description: "Cancel a running batch scrape" }
    - { id: agent.start, method: POST, path: "/agent", body_params: [prompt, urls, schema, maxCredits, strictConstrainToURLs, model, effort, threadId, mode, location, safe], requires_approval: true, description: "Start an agent research run. Spends up to maxCredits, default 2,500; usage is billed after the free daily runs." }
    - { id: agent.status, method: GET, path: "/agent/{jobId}", path_params: [jobId], description: "Read an agent run's status and results" }
    - { id: agent.cancel, method: DELETE, path: "/agent/{jobId}", path_params: [jobId], description: "Cancel a running agent run" }
    - { id: team.credit_usage, method: GET, path: "/team/credit-usage", description: "Read the team's remaining plan credits and billing period" }
    - { id: team.activity, method: GET, path: "/team/activity", query_params: [endpoint, limit, cursor], description: "List the team's API jobs from the last 24 hours with their ids" }

