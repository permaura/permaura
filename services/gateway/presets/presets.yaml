    - { id: list_items.read, method: GET, path: "/sites/{site_id}/lists/{list_id}/items/{item_id}", path_params: [site_id, list_id, item_id], query_params: ["$select", "$expand"], description: "Read a list item; $expand=fields returns its column values" }
    - { id: pages.list, method: GET, path: "/sites/{site_id}/pages/microsoft.graph.sitePage", path_params: [site_id], query_params: ["$filter", "$select", "$top", "$orderby", "$expand", "$count"], description: "List a site's modern pages" }
    - { id: pages.read, method: GET, path: "/sites/{site_id}/pages/{page_id}/microsoft.graph.sitePage", path_params: [site_id, page_id], query_params: ["$select", "$expand"], description: "Read a page; $expand=canvasLayout returns its content" }
    - { id: list_items.create, method: POST, path: "/sites/{site_id}/lists/{list_id}/items", path_params: [site_id, list_id], body_params: [fields], description: "Create a list item; fields holds its column values" }
    - { id: folders.create, method: POST, path: "/drives/{drive_id}/items/{item_id}/children", path_params: [drive_id, item_id], body_params: [name, folder, "@microsoft.graph.conflictBehavior"], description: "Create a folder in a library; pass folder as an empty object" }
    - { id: items.update, method: PATCH, path: "/drives/{drive_id}/items/{item_id}", path_params: [drive_id, item_id], body_params: [name, description, parentReference], description: "Rename a file or folder, or move it by setting parentReference" }
    - { id: links.create, method: POST, path: "/drives/{drive_id}/items/{item_id}/createLink", path_params: [drive_id, item_id], body_params: [type, scope, expirationDateTime, retainInheritedPermissions], risk: high, requires_approval: true, description: "Create a sharing link for a file or folder" }
    - { id: list_items.delete, method: DELETE, path: "/sites/{site_id}/lists/{list_id}/items/{item_id}", path_params: [site_id, list_id, item_id], description: "Delete a list item" }
