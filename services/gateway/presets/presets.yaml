    - { id: applications.reject, method: POST, path: "/applications/{id}/reject", path_params: [id], body_params: [rejection_reason_id, notes, custom_fields], action: update, requires_approval: true, description: "Reject an application with a reason; sends no rejection email" }
    - { id: applications.hire, method: POST, path: "/applications/{id}/hire", path_params: [id], body_params: [start_date, opening_id, close_reason_id], action: update, requires_approval: true, description: "Mark an application as hired and close its opening" }
    - { id: candidates.anonymize, method: PATCH, path: "/candidates/{id}/anonymize", path_params: [id], body_params: [fields], action: delete, risk: critical, requires_approval: true, description: "Irreversibly scrub selected personal data from a candidate" }
    - { id: candidates.delete, method: DELETE, path: "/candidates/{id}", path_params: [id], description: "Permanently delete a candidate and all their applications, notes and scorecards" }

