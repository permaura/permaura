    label: "API key, as apikey:X"
    url: "https://support.freshdesk.com/support/solutions/articles/215517"
    hint: "Click your profile picture, open Profile settings and copy the API key. Paste it as apikey:X, with a literal X as the dummy password."
  capabilities:
    - { id: tickets.list, method: GET, path: "/tickets", query_params: [filter, requester_id, email, unique_external_id, company_id, updated_since, order_by, order_type, include, page, per_page], description: "List tickets, newest first by default" }
    - { id: tickets.read, method: GET, path: "/tickets/{id}", path_params: [id], query_params: [include], description: "Read a ticket" }
    - { id: tickets.search, method: GET, path: "/search/tickets", query_params: [query, page], description: "Filter tickets with a double-quoted query, such as \"priority:3 AND status:2\"" }
    - { id: tickets.conversations, method: GET, path: "/tickets/{id}/conversations", path_params: [id], query_params: [page, per_page], description: "List the replies and notes on a ticket" }
    - { id: contacts.list, method: GET, path: "/contacts", query_params: [email, mobile, phone, company_id, state, contact_type, updated_since, page, per_page], description: "List contacts, filtered by email, phone, company or state" }
    - { id: contacts.read, method: GET, path: "/contacts/{id}", path_params: [id], description: "Read a contact" }
    - { id: contacts.search, method: GET, path: "/contacts/autocomplete", query_params: [term], description: "Search contacts by name" }
    - { id: agents.list, method: GET, path: "/agents", query_params: [email, mobile, phone, state, page, per_page], description: "List agents" }
    - { id: groups.list, method: GET, path: "/groups", query_params: [page, per_page], description: "List support groups" }
    - { id: tickets.reply, method: POST, path: "/tickets/{id}/reply", path_params: [id], body_params: [body, from_email, user_id, cc_emails, bcc_emails], action: send, requires_approval: true, description: "Reply to a ticket, which emails the requester" }
    - { id: tickets.create, method: POST, path: "/tickets", body_params: [name, requester_id, email, unique_external_id, subject, type, status, priority, description, responder_id, cc_emails, custom_fields, due_by, fr_due_by, email_config_id, group_id, parent_id, product_id, source, tags, company_id], action: send, requires_approval: true, description: "Create a ticket; automations can email the requester and it creates a contact for a new address" }
    - { id: tickets.update, method: PUT, path: "/tickets/{id}", path_params: [id], body_params: [subject, type, status, priority, description, responder_id, custom_fields, due_by, fr_due_by, group_id, product_id, source, tags, company_id], action: send, requires_approval: true, description: "Change status, priority, assignee or fields on a ticket; automations can email the requester about it" }
    - { id: tickets.note, method: POST, path: "/tickets/{ticket_id}/notes", path_params: [ticket_id], body_params: [body, user_id], description: "Add a private note to a ticket" }
    - { id: contacts.create, method: POST, path: "/contacts", body_params: [name, email, phone, mobile, unique_external_id, other_emails, company_id, other_companies, custom_fields, description, job_title, language, tags, time_zone], description: "Create a contact" }
    - { id: contacts.update, method: PUT, path: "/contacts/{id}", path_params: [id], body_params: [name, email, phone, mobile, unique_external_id, other_emails, company_id, other_companies, custom_fields, description, job_title, language, tags, time_zone], description: "Update a contact" }
    - { id: tickets.delete, method: DELETE, path: "/tickets/{id}", path_params: [id], description: "Delete a ticket" }

