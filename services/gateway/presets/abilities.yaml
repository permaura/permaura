# WordPress abilities Permaura has reviewed, compiled into the gateway like presets.yaml.
#
# An ability a site lists under one of these names, with exactly these annotations and an input schema whose
# top-level fields are all in `input`, lands with the posture given here instead of the floor discovery holds
# every other ability to. Any other annotations, a new input field or no input schema means the ability has
# changed since it was reviewed, so it gets the floor (approval on every call) until it is reviewed again. Each posture matches what the same plugin's REST route gets
# from the WordPress discovery rules (reads Medium and on, creates and updates High and off, deletes
# Critical with approval), plus an approval on anything that reaches a customer or moves money.
#
# annotations: readonly, destructive, idempotent, as the plugin registers them. input: the reviewed top-level
# input fields, including those another reviewed plugin adds by filter (Events Manager Pro on events).
# action: read | list | create | update | delete   risk: low | medium | high | critical

